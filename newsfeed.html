<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>News Feed - CampusConnect</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
body{background:#0d1117;color:#fff;max-width:450px;margin:0 auto;min-height:100vh}
.header{background:linear-gradient(135deg,#0d4a1a,#1a6b2e);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.header h1{font-size:16px;color:white}
.header a{color:white;font-size:12px;text-decoration:none;background:rgba(255,255,255,0.2);padding:6px 12px;border-radius:15px}
.content{padding:12px;padding-bottom:40px}
.filter-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filter-btn{padding:6px 12px;border:1px solid #30363d;background:#161b22;color:#aaa;border-radius:20px;font-size:11px;cursor:pointer;transition:0.2s}
.filter-btn.active,.filter-btn:hover{background:#1a3a2a;color:#4caf50;border-color:#4caf50}
.news-card{background:#21262d;padding:14px;border-radius:12px;margin:8px 0;border-left:4px solid #4caf50;transition:0.2s;content-visibility:auto;contain-intrinsic-size:200px}
.news-card:hover{border-left-color:#ffd700}
.news-card-cat{display:inline-block;padding:3px 10px;border-radius:10px;font-size:9px;font-weight:700;background:#1a3a2a;color:#4caf50;margin-bottom:6px}
.news-card-title{font-size:14px;font-weight:700;color:#e0e0e0;margin-bottom:4px}
.news-card-meta{font-size:10px;color:#666;margin-bottom:6px}
.news-card-body{font-size:12px;color:#bbb;line-height:1.7;margin-bottom:6px;white-space:pre-wrap}
.news-card img{width:100%;border-radius:8px;margin:6px 0;cursor:pointer}
.news-card iframe{width:100%;height:180px;border:none;border-radius:8px;margin:6px 0}
.video-wrap{position:relative;margin:6px 0}
.video-wrap video{width:100%;border-radius:8px;display:block;background:#000}
.expand-btn{position:absolute;bottom:10px;right:10px;background:rgba(0,0,0,0.6);color:white;border:none;border-radius:8px;padding:8px 10px;font-size:14px;cursor:pointer}
.skeleton{background:linear-gradient(90deg,#21262d 25%,#2d333b 50%,#21262d 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:12px;margin:8px 0}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.refresh-btn{display:block;width:100%;padding:11px;margin-bottom:10px;background:#1a3a2a;color:#4caf50;border:1px solid #2a4a2a;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;text-align:center;transition:0.2s}
.refresh-btn:hover{background:#1f4a2f}
.empty{text-align:center;color:#555;padding:30px;font-size:13px}
.footer{text-align:center;padding:15px;color:#555;font-size:10px}
.footer a{color:#4caf50;text-decoration:none}
#sentinel{height:1px}
#loadMoreSpinner{text-align:center;padding:14px;color:#555;font-size:12px;display:none}
#endOfFeed{text-align:center;padding:14px;color:#444;font-size:11px;display:none}
</style>
</head>
<body>
<div class="header">
  <h1>📰 News Feed</h1>
  <a href="index.html">← Home</a>
</div>
<div class="content">
  <button class="refresh-btn" onclick="hardRefresh()">🔄 Refresh News</button>

  <div class="filter-bar" id="filterBar">
    <button class="filter-btn active" onclick="setFilter('All')">All</button>
    <button class="filter-btn" onclick="setFilter('Academic')">📚 Academic</button>
    <button class="filter-btn" onclick="setFilter('Sports')">⚽ Sports</button>
    <button class="filter-btn" onclick="setFilter('Events')">🎉 Events</button>
    <button class="filter-btn" onclick="setFilter('Campus')">🏫 Campus</button>
    <button class="filter-btn" onclick="setFilter('Urgent')">🔴 Urgent</button>
  </div>

  <div id="newsContent">
    <div class="skeleton" style="height:80px"></div>
    <div class="skeleton" style="height:80px"></div>
    <div class="skeleton" style="height:80px"></div>
  </div>
  <div id="loadMoreSpinner">⏳ Loading more...</div>
  <div id="endOfFeed">📭 You've reached the end</div>
  <div id="sentinel"></div>
</div>
<div class="footer"><a href="index.html">← Back to CampusConnect</a></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";
import { getFirestore, collection, query, orderBy, limit, startAfter, getDocs }
  from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyB553_waOZcKoyvIdF7NsIH7EpjjbUeP68",
  authDomain: "campuconnect-bd52f.firebaseapp.com",
  projectId: "campuconnect-bd52f",
  storageBucket: "campuconnect-bd52f.firebasestorage.app",
  messagingSenderId: "762013163609",
  appId: "1:762013163609:web:7f565fbde05a4ad35ed148"
});
const db = getFirestore(app);

var SID = "13RLLmcXk6BAZBWAxgiHcy_BwOAhhpPxwLQb1W12uyLg";
var PAGE_SIZE = 8;
var CACHE_KEY = 'cc_newsfeed_cache_v1';

var allNews = [];         // rendered items, sorted newest-first
var seenIds = {};         // dedupe key -> true
var currentFilter = 'All';
var lastDoc = null;       // Firestore pagination cursor
var hasMore = true;
var loadingMore = false;
var sheetsLoaded = false;

function escapeHtml(str) {
  var d = document.createElement('div');
  d.textContent = str == null ? '' : String(str);
  return d.innerHTML;
}

function parseCSVLine(line) {
  var result = [], current = '', inQuotes = false;
  for (var i = 0; i < line.length; i++) {
    var ch = line[i];
    if (ch === '"') { inQuotes = !inQuotes; }
    else if (ch === ',' && !inQuotes) { result.push(current.trim()); current = ''; }
    else { current += ch; }
  }
  result.push(current.trim());
  return result;
}

function getYouTubeID(url) {
  if (!url) return null;
  if (url.includes('youtu.be')) return url.split('/').pop().split('?')[0];
  if (url.includes('youtube.com')) return (url.split('v=')[1]||'').split('&')[0];
  return null;
}

window.setFilter = function(cat) {
  currentFilter = cat;
  document.querySelectorAll('.filter-btn').forEach(function(b){ b.classList.remove('active'); });
  event.target.classList.add('active');
  renderNews();
};

// Tap the expand icon on an uploaded video -> real fullscreen + try to lock landscape
window.goFullscreen = function(btn) {
  var video = btn.previousElementSibling;
  var req = video.requestFullscreen || video.webkitRequestFullscreen || video.webkitEnterFullscreen;
  try {
    if (video.webkitEnterFullscreen && !video.requestFullscreen) {
      // iOS Safari - native fullscreen player, auto-rotates with device
      video.webkitEnterFullscreen();
    } else if (req) {
      req.call(video).then(function() {
        if (screen.orientation && screen.orientation.lock) {
          screen.orientation.lock('landscape').catch(function(){});
        }
      }).catch(function(){});
    }
    video.play();
  } catch(e) {}
};

document.addEventListener('fullscreenchange', function() {
  if (!document.fullscreenElement && screen.orientation && screen.orientation.unlock) {
    try { screen.orientation.unlock(); } catch(e) {}
  }
});

function cardHtml(n) {
  var h = '<div class="news-card">';
  if (n.cat) h += '<span class="news-card-cat">' + escapeHtml(n.cat) + '</span>';
  h += '<div class="news-card-title">' + escapeHtml(n.t) + '</div>';
  h += '<div class="news-card-meta">✍️ ' + escapeHtml(n.author||'Admin') + ' · 📅 ' + escapeHtml(n.d||'') + '</div>';
  if (n.b) h += '<div class="news-card-body">' + escapeHtml(n.b) + '</div>';
  if (n.img && n.img.length > 5) h += '<img src="' + escapeHtml(n.img) + '" loading="lazy" alt="' + escapeHtml(n.t) + '">';
  if (n.vid && n.vid.length > 5) {
    var ytId = getYouTubeID(n.vid);
    if (ytId) {
      h += '<iframe src="https://www.youtube.com/embed/' + escapeHtml(ytId) + '" loading="lazy" allow="fullscreen; encrypted-media; picture-in-picture" allowfullscreen></iframe>';
    } else {
      h += '<div class="video-wrap"><video controls playsinline preload="none" src="' + escapeHtml(n.vid) + '"></video>'
        + '<button class="expand-btn" onclick="goFullscreen(this)">⛶ Fullscreen</button></div>';
    }
  }
  if (n.fb && n.fb.length > 10) {
    h += '<iframe src="https://www.facebook.com/plugins/post.php?href=' + encodeURIComponent(n.fb) + '&show_text=true&width=500" loading="lazy" style="border:none;overflow:hidden;min-height:300px" scrolling="no" allowfullscreen="true" allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share"></iframe>';
  }
  h += '</div>';
  return h;
}

function renderNews() {
  var el = document.getElementById('newsContent');
  var filtered = currentFilter === 'All' ? allNews : allNews.filter(function(n){ return n.cat === currentFilter; });
  if (filtered.length === 0) {
    el.innerHTML = '<div class="empty">📭 No news in this category yet.</div>';
    return;
  }
  el.innerHTML = filtered.map(cardHtml).join('');
}

function addItems(items) {
  items.forEach(function(n) {
    if (seenIds[n.id]) return;
    seenIds[n.id] = true;
    allNews.push(n);
  });
  allNews.sort(function(a, b){ return b.createdAt - a.createdAt; });
}

function saveCache() {
  try {
    var slim = allNews.slice(0, 20).map(function(n){
      return Object.assign({}, n, { createdAt: n.createdAt.getTime() });
    });
    sessionStorage.setItem(CACHE_KEY, JSON.stringify(slim));
  } catch(e) {}
}

function loadCache() {
  try {
    var raw = sessionStorage.getItem(CACHE_KEY);
    if (!raw) return false;
    var slim = JSON.parse(raw);
    addItems(slim.map(function(n){ return Object.assign({}, n, { createdAt: new Date(n.createdAt) }); }));
    renderNews();
    return true;
  } catch(e) { return false; }
}

async function loadSheetsOnce() {
  if (sheetsLoaded) return;
  sheetsLoaded = true;
  try {
    var r = await fetch("https://docs.google.com/spreadsheets/d/" + SID + "/gviz/tq?tqx=out:csv&sheet=Sheet1&v=" + Date.now());
    var csv = await r.text();
    var lines = csv.split('\n');
    var items = [];
    for (var i = 1; i < lines.length; i++) {
      if (!lines[i].trim()) continue;
      var co = parseCSVLine(lines[i]);
      if (co.length >= 6 && co[0]) {
        items.push({ id: 'sheet_' + i, t: co[0], author: 'Sheets', d: co[1], b: co[2], img: co[3], vid: co[4], fb: '', cat: co[5], createdAt: new Date(co[1]||Date.now()) });
      }
    }
    addItems(items);
    renderNews();
    saveCache();
  } catch(e) {}
}

async function loadNextPage() {
  if (loadingMore || !hasMore) return;
  loadingMore = true;
  document.getElementById('loadMoreSpinner').style.display = 'block';
  try {
    var q = lastDoc
      ? query(collection(db, 'news'), orderBy('createdAt', 'desc'), startAfter(lastDoc), limit(PAGE_SIZE))
      : query(collection(db, 'news'), orderBy('createdAt', 'desc'), limit(PAGE_SIZE));
    var snap = await getDocs(q);
    if (snap.empty) { hasMore = false; }
    else {
      lastDoc = snap.docs[snap.docs.length - 1];
      var items = snap.docs.map(function(d) {
        var f = d.data();
        return { id: d.id, t: f.title||'', author: f.author||'Admin', d: f.date||'', b: f.content||'', img: f.imageUrl||'', vid: f.videoUrl||'', fb: f.fbLink||'', cat: f.category||'', createdAt: f.createdAt ? new Date(f.createdAt.seconds*1000) : new Date() };
      });
      addItems(items);
      if (snap.docs.length < PAGE_SIZE) hasMore = false;
    }
  } catch(e) { hasMore = false; }
  loadingMore = false;
  document.getElementById('loadMoreSpinner').style.display = 'none';
  document.getElementById('endOfFeed').style.display = hasMore ? 'none' : 'block';
  renderNews();
  saveCache();
}

window.hardRefresh = function() {
  allNews = []; seenIds = {}; lastDoc = null; hasMore = true; sheetsLoaded = false;
  try { sessionStorage.removeItem(CACHE_KEY); } catch(e) {}
  document.getElementById('endOfFeed').style.display = 'none';
  document.getElementById('newsContent').innerHTML =
    '<div class="skeleton" style="height:80px"></div><div class="skeleton" style="height:80px"></div><div class="skeleton" style="height:80px"></div>';
  loadNextPage().then(loadSheetsOnce);
};

// Infinite scroll: fetch the next page shortly before the user reaches the bottom
var observer = new IntersectionObserver(function(entries) {
  if (entries[0].isIntersecting) loadNextPage();
}, { rootMargin: '400px' });
observer.observe(document.getElementById('sentinel'));

// Show cached feed instantly (if any), then refresh from the network in the background
var hadCache = loadCache();
loadNextPage().then(loadSheetsOnce);
</script>
<script>
// Service worker registration - auto-checks for updates and reloads when a new version is ready
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('service-worker.js?v=10', { updateViaCache: 'none' })
      .then(function(reg) {
        reg.update(); // check for a new version right away
        setInterval(function() { reg.update(); }, 30 * 60 * 1000); // re-check every 30 min while the tab is open
      })
      .catch(function() {});
  });

  var __swRefreshed = false;
  navigator.serviceWorker.addEventListener('controllerchange', function() {
    if (__swRefreshed) return;
    __swRefreshed = true;
    window.location.reload();
  });
}
</script>
</body>
</html>
