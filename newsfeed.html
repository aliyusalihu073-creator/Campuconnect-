<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>News Feed - CampusConnect</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
body{background:#0d1117;color:#fff;max-width:450px;margin:0 auto;min-height:100vh}
.header{background:linear-gradient(135deg,#0d4a1a,#1a6b2e);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.header h1{font-size:16px;color:white}
.header a{color:white;font-size:12px;text-decoration:none;background:rgba(255,255,255,0.2);padding:6px 12px;border-radius:15px}
.content{padding:12px;padding-bottom:40px}
.filter-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filter-btn{padding:6px 12px;border:1px solid #30363d;background:#161b22;color:#aaa;border-radius:20px;font-size:11px;cursor:pointer;transition:0.2s}
.filter-btn.active,.filter-btn:hover{background:#1a3a2a;color:#4caf50;border-color:#4caf50}
.news-card{background:#21262d;padding:14px;border-radius:12px;margin:8px 0;border-left:4px solid #4caf50;transition:0.2s}
.news-card:hover{border-left-color:#ffd700}
.news-card-cat{display:inline-block;padding:3px 10px;border-radius:10px;font-size:9px;font-weight:700;background:#1a3a2a;color:#4caf50;margin-bottom:6px}
.news-card-title{font-size:14px;font-weight:700;color:#e0e0e0;margin-bottom:4px}
.news-card-meta{font-size:10px;color:#666;margin-bottom:6px}
.news-card-body{font-size:12px;color:#bbb;line-height:1.7;margin-bottom:6px}
.news-card img{width:100%;border-radius:8px;margin:6px 0;cursor:pointer}
.news-card iframe{width:100%;height:180px;border:none;border-radius:8px;margin:6px 0}
.skeleton{background:linear-gradient(90deg,#21262d 25%,#2d333b 50%,#21262d 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:12px;margin:8px 0}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.refresh-btn{display:block;width:100%;padding:11px;margin-bottom:10px;background:#1a3a2a;color:#4caf50;border:1px solid #2a4a2a;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;text-align:center;transition:0.2s}
.refresh-btn:hover{background:#1f4a2f}
.empty{text-align:center;color:#555;padding:30px;font-size:13px}
.footer{text-align:center;padding:15px;color:#555;font-size:10px}
.footer a{color:#4caf50;text-decoration:none}
</style>
</head>
<body>
<div class="header">
  <h1>📰 News Feed</h1>
  <a href="index.html">← Home</a>
</div>
<div class="content">
  <button class="refresh-btn" onclick="loadAll()">🔄 Refresh News</button>

  <div class="filter-bar" id="filterBar">
    <button class="filter-btn active" onclick="setFilter('All')">All</button>
    <button class="filter-btn" onclick="setFilter('Academic')">📚 Academic</button>
    <button class="filter-btn" onclick="setFilter('Sports')">⚽ Sports</button>
    <button class="filter-btn" onclick="setFilter('Events')">🎉 Events</button>
    <button class="filter-btn" onclick="setFilter('Campus')">🏫 Campus</button>
    <button class="filter-btn" onclick="setFilter('Urgent')">🔴 Urgent</button>
  </div>

  <div id="newsContent">
    <div class="skeleton" style="height:80px"></div>
    <div class="skeleton" style="height:80px"></div>
    <div class="skeleton" style="height:80px"></div>
  </div>
</div>
<div class="footer"><a href="index.html">← Back to CampusConnect</a></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";
import { getFirestore, collection, query, orderBy, limit, getDocs }
  from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyB553_waOZcKoyvIdF7NsIH7EpjjbUeP68",
  authDomain: "campuconnect-bd52f.firebaseapp.com",
  projectId: "campuconnect-bd52f",
  storageBucket: "campuconnect-bd52f.firebasestorage.app",
  messagingSenderId: "762013163609",
  appId: "1:762013163609:web:7f565fbde05a4ad35ed148"
});
const db = getFirestore(app);

var SID = "13RLLmcXk6BAZBWAxgiHcy_BwOAhhpPxwLQb1W12uyLg";
var allNews = [];
var currentFilter = 'All';

// FIX: Proper CSV parser that handles commas inside quoted fields
function parseCSVLine(line) {
  var result = [], current = '', inQuotes = false;
  for (var i = 0; i < line.length; i++) {
    var ch = line[i];
    if (ch === '"') { inQuotes = !inQuotes; }
    else if (ch === ',' && !inQuotes) { result.push(current.trim()); current = ''; }
    else { current += ch; }
  }
  result.push(current.trim());
  return result;
}

function getYouTubeID(url) {
  if (!url) return null;
  if (url.includes('youtu.be')) return url.split('/').pop().split('?')[0];
  if (url.includes('youtube.com')) return (url.split('v=')[1]||'').split('&')[0];
  return null;
}

window.setFilter = function(cat) {
  currentFilter = cat;
  document.querySelectorAll('.filter-btn').forEach(function(b){ b.classList.remove('active'); });
  event.target.classList.add('active');
  renderNews();
};

function renderNews() {
  var el = document.getElementById('newsContent');
  var filtered = currentFilter === 'All' ? allNews : allNews.filter(function(n){ return n.cat === currentFilter; });
  if (filtered.length === 0) {
    el.innerHTML = '<div class="empty">📭 No news in this category yet.</div>';
    return;
  }
  var h = '';
  filtered.forEach(function(n) {
    h += '<div class="news-card">';
    if (n.cat) h += '<span class="news-card-cat">' + n.cat + '</span>';
    h += '<div class="news-card-title">' + n.t + '</div>';
    h += '<div class="news-card-meta">✍️ ' + (n.author||'Admin') + ' · 📅 ' + (n.d||'') + '</div>';
    if (n.b) h += '<div class="news-card-body">' + n.b + '</div>';
    if (n.img && n.img.length > 5) h += '<img src="' + n.img + '" loading="lazy" alt="' + n.t + '">';
    if (n.vid && n.vid.length > 5) {
      var ytId = getYouTubeID(n.vid);
      if (ytId) h += '<iframe src="https://www.youtube.com/embed/' + ytId + '" loading="lazy" allowfullscreen></iframe>';
      else h += '<video controls src="' + n.vid + '" preload="none" style="width:100%;border-radius:8px"></video>';
    }
    h += '</div>';
  });
  el.innerHTML = h;
}

window.loadAll = async function() {
  var el = document.getElementById('newsContent');
  el.innerHTML = '<div class="skeleton" style="height:80px"></div><div class="skeleton" style="height:80px"></div><div class="skeleton" style="height:80px"></div>';
  allNews = [];
  var fetched = 0;

  // Source 1: Firestore
  try {
    var q = query(collection(db, 'news'), orderBy('createdAt', 'desc'), limit(50));
    var snap = await getDocs(q);
    snap.forEach(function(d) {
      var f = d.data();
      allNews.push({ t: f.title||'', author: f.author||'Admin', d: f.date||'', b: f.content||'', img: f.imageUrl||'', vid: f.videoUrl||'', cat: f.category||'', createdAt: f.createdAt ? new Date(f.createdAt.seconds*1000) : new Date() });
    });
  } catch(e) {}
  fetched++;

  // Source 2: Google Sheets
  try {
    var r = await fetch("https://docs.google.com/spreadsheets/d/" + SID + "/gviz/tq?tqx=out:csv&sheet=Sheet1&v=" + Date.now());
    var csv = await r.text();
    var lines = csv.split('\n');
    for (var i = 1; i < lines.length; i++) {
      if (!lines[i].trim()) continue;
      var co = parseCSVLine(lines[i]);
      if (co.length >= 6 && co[0]) {
        allNews.push({ t: co[0], author: 'Sheets', d: co[1], b: co[2], img: co[3], vid: co[4], cat: co[5], createdAt: new Date(co[1]||Date.now()) });
      }
    }
  } catch(e) {}
  fetched++;

  // Sort newest first
  allNews.sort(function(a, b){ return b.createdAt - a.createdAt; });
  renderNews();
};

loadAll();
</script>
</body>
</html>
