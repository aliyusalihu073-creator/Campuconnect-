<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel - CampusConnect</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
body{background:#0a0a0a;color:#fff;max-width:500px;margin:0 auto;min-height:100vh}
.header{background:linear-gradient(135deg,#1B5E20,#2E7D32);padding:16px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.header h1{font-size:18px;color:white}
.header a{color:white;font-size:13px;text-decoration:none;background:rgba(255,255,255,0.2);padding:8px 14px;border-radius:20px}
.tabs{display:flex;overflow-x:auto;background:#161b22;padding:6px;gap:4px;position:sticky;top:52px;z-index:99}
.tabs button{flex-shrink:0;padding:10px 14px;border:none;border-radius:8px;font-size:11px;font-weight:600;cursor:pointer;background:#21262d;color:#8b949e;white-space:nowrap}
.tabs button.active{background:#1B5E20;color:white}
.content{padding:15px}
.card{background:#1a1a2e;padding:20px;border-radius:12px;margin-bottom:15px;box-shadow:0 4px 16px rgba(0,0,0,0.3);border:1px solid #2a2a3e}
.card h2{color:#4caf50;font-size:16px;margin-bottom:12px}
.card input,.card textarea,.card select{width:100%;padding:14px;margin:8px 0;border-radius:10px;border:2px solid #333;background:#0d0d1a;color:white;font-size:13px;outline:none}
.card input:focus,.card textarea:focus,.card select:focus{border-color:#4caf50}
.card textarea{min-height:100px;resize:vertical}
.btn{display:block;width:100%;padding:14px;margin:10px 0;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;text-align:center;transition:0.3s}
.btn-green{background:linear-gradient(135deg,#1B5E20,#2E7D32);color:white}
.btn-blue{background:linear-gradient(135deg,#0f3460,#1a5276);color:white}
.btn-red{background:#cc0000;color:white}
.progress-bar{width:100%;height:8px;background:#333;border-radius:4px;margin:10px 0;overflow:hidden;display:none}
.progress-bar .fill{height:100%;background:linear-gradient(90deg,#4caf50,#8bc34a);width:0%;border-radius:4px}
.preview-box{background:#0d0d1a;padding:15px;border-radius:10px;margin:10px 0;display:none}
.preview-box img{width:100%;border-radius:8px;max-height:200px;object-fit:cover}
.preview-box video{width:100%;border-radius:8px;max-height:200px}
.success{color:#4caf50;text-align:center;margin:10px 0;font-size:12px;font-weight:600}
.error{color:#f44336;text-align:center;margin:10px 0;font-size:12px}
.news-list-item{background:#0d0d1a;padding:12px;border-radius:8px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;border:1px solid #333}
.news-list-item .title{font-size:13px;flex:1}
.news-list-item button{background:#cc0000;color:white;border:none;padding:6px 12px;border-radius:6px;font-size:10px;cursor:pointer;margin-left:8px}
.footer{text-align:center;padding:20px;color:#555;font-size:11px}
</style>
</head>
<body>

<div class="header"><h1>🔧 Admin Panel</h1><a href="index.html">← Home</a></div>

<div class="tabs" id="adminTabs">
<button class="active" onclick="switchAdminTab('news')">📰 News</button>
<button onclick="switchAdminTab('media')">📸 Media</button>
<button onclick="switchAdminTab('documents')">📚 Docs</button>
<button onclick="switchAdminTab('results')">📊 Results</button>
<button onclick="switchAdminTab('timetable')">🗓️ Timetable</button>
<button onclick="switchAdminTab('manage')">📋 Manage</button>
</div>

<div class="content">

<!-- NEWS TAB -->
<div class="section" id="tab-news">
<div class="card">
<h2>📰 Post News</h2>
<input type="text" id="newsTitle" placeholder="News Title">
<input type="text" id="newsAuthor" placeholder="Author Name">
<input type="date" id="newsDate">
<textarea id="newsContent" placeholder="News Content (supports 10,000+ characters)..."></textarea>
<input type="text" id="newsImage" placeholder="Image URL (any link: Imgur, TikTok, Facebook, etc.)">
<input type="text" id="newsVideo" placeholder="Video URL (any link: YouTube, Vimeo, TikTok, etc.)">
<select id="newsCategory">
<option value="">Select Category</option>
<option value="Academic">📚 Academic</option>
<option value="Sports">⚽ Sports</option>
<option value="Events">🎉 Events</option>
<option value="Campus">🏫 Campus</option>
<option value="Urgent">🔴 Urgent</option>
</select>
<button class="btn btn-green" onclick="postNews()">📤 Post News</button>
<p class="success" id="newsMsg"></p>
</div>
</div>

<!-- MEDIA TAB -->
<div class="section" id="tab-media" style="display:none">
<div class="card">
<h2>📸 Quick Media Post</h2>
<p style="font-size:11px;color:#999;margin-bottom:10px;">Upload image or video — automatically becomes news. Supports LARGE files.</p>
<input type="text" id="mediaTitle" placeholder="Title for this media">
<input type="text" id="mediaAuthor" placeholder="Author Name">
<select id="mediaCategory"><option value="">Select Category</option><option value="Academic">📚 Academic</option><option value="Sports">⚽ Sports</option><option value="Events">🎉 Events</option><option value="Campus">🏫 Campus</option></select>
<input type="file" id="mediaFile" accept="image/*,video/*" onchange="previewMedia()">
<div class="preview-box" id="previewBox"></div>
<div class="progress-bar" id="progressBar"><div class="fill" id="progressFill"></div></div>
<button class="btn btn-blue" onclick="quickMediaPost()">📤 Post Media</button>
<p class="success" id="mediaMsg"></p>
</div>
</div>

<!-- DOCUMENTS TAB -->
<div class="section" id="tab-documents" style="display:none">
<div class="card">
<h2>📚 Upload Document (PDF/Text)</h2>
<input type="text" id="docTitle" placeholder="Document Title">
<input type="text" id="docAuthor" placeholder="Author Name">
<select id="docCategory"><option value="">Select Category</option><option value="Lecture Notes">📖 Lecture Notes</option><option value="Past Questions">📝 Past Questions</option><option value="Textbook">📚 Textbook</option><option value="Other">📄 Other</option></select>
<input type="file" id="docFile" accept=".pdf,.txt,.doc,.docx,.ppt,.pptx">
<div class="progress-bar" id="docProgressBar"><div class="fill" id="docProgressFill"></div></div>
<button class="btn btn-blue" onclick="uploadDocument()">📤 Upload Document</button>
<p class="success" id="docMsg"></p>
</div>
</div>

<!-- RESULTS TAB -->
<div class="section" id="tab-results" style="display:none">
<div class="card">
<h2>📊 Add Student Result</h2>
<input type="text" id="resultRegNo" placeholder="Registration Number">
<input type="text" id="resultName" placeholder="Student Name">
<select id="resultSemester"><option value="">Select Semester</option><option value="First">First Semester</option><option value="Second">Second Semester</option></select>
<textarea id="resultCourses" placeholder="Paste courses as JSON: [{'course':'COM111','grade':'A','point':4}]"></textarea>
<button class="btn btn-green" onclick="addResult()">📤 Add Result</button>
<p class="success" id="resultMsg"></p>
</div>
</div>

<!-- TIMETABLE TAB -->
<div class="section" id="tab-timetable" style="display:none">
<div class="card">
<h2>🗓️ Update Timetable</h2>
<select id="ttDay"><option value="">Select Day</option><option value="MONDAY">Monday</option><option value="TUESDAY">Tuesday</option><option value="WEDNESDAY">Wednesday</option><option value="THURSDAY">Thursday</option><option value="FRIDAY">Friday</option></select>
<textarea id="ttClasses" placeholder="Paste classes as JSON: ['8:00-10:00 | COM111 | Hall A','10:00-12:00 | GNS101 | LT1']"></textarea>
<button class="btn btn-green" onclick="updateTimetable()">📤 Update Timetable</button>
<p class="success" id="ttMsg"></p>
</div>
</div>

<!-- MANAGE TAB -->
<div class="section" id="tab-manage" style="display:none">
<div class="card">
<h2>📋 Manage News</h2>
<div id="newsList">Loading...</div>
</div>
</div>

</div>

<div class="footer">© 2026 CampusConnect Admin | Built by Aliyu Salihu</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, doc, deleteDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";
import { getStorage, ref as storageRef, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyB553_waOZcKoyvIdF7NsIH7EpjjbUeP68",
  authDomain: "campuconnect-bd52f.firebaseapp.com",
  projectId: "campuconnect-bd52f",
  storageBucket: "campuconnect-bd52f.firebasestorage.app",
  messagingSenderId: "762013163609",
  appId: "1:762013163609:web:7f565fbde05a4ad35ed148"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);

// TAB SWITCHING
window.switchAdminTab = function(tab) {
  document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.section').forEach(s => s.style.display = 'none');
  document.getElementById('tab-' + tab).style.display = 'block';
  event.target.classList.add('active');
  if (tab === 'manage') loadNewsList();
};

// NEWS POST
window.postNews = async function() {
  var t = document.getElementById('newsTitle').value.trim();
  var a = document.getElementById('newsAuthor').value.trim() || 'Admin';
  var d = document.getElementById('newsDate').value;
  var c = document.getElementById('newsContent').value.trim();
  var img = document.getElementById('newsImage').value.trim();
  var vid = document.getElementById('newsVideo').value.trim();
  var cat = document.getElementById('newsCategory').value;
  
  if (!t || !d || !c || !cat) { alert('Fill all required fields'); return; }
  
  try {
    await addDoc(collection(db, 'news'), {
      title: t, author: a, date: d, content: c,
      imageUrl: img, videoUrl: vid, category: cat, createdAt: new Date()
    });
    document.getElementById('newsMsg').innerHTML = '✅ News posted!';
    document.getElementById('newsTitle').value = '';
    document.getElementById('newsContent').value = '';
  } catch(err) {
    document.getElementById('newsMsg').innerHTML = '❌ Error: ' + err.message;
  }
};

// MEDIA PREVIEW
window.previewMedia = function() {
  var file = document.getElementById('mediaFile').files[0];
  var preview = document.getElementById('previewBox');
  if (!file) { preview.style.display = 'none'; return; }
  preview.style.display = 'block';
  var url = URL.createObjectURL(file);
  if (file.type.startsWith('image/')) {
    preview.innerHTML = '<img src="' + url + '"><p style="font-size:10px;color:#999;">📷 ' + (file.size/(1024*1024)).toFixed(1) + 'MB</p>';
  } else {
    preview.innerHTML = '<video controls src="' + url + '"></video><p style="font-size:10px;color:#999;">🎥 ' + (file.size/(1024*1024)).toFixed(1) + 'MB</p>';
  }
};

// QUICK MEDIA POST
window.quickMediaPost = async function() {
  var title = document.getElementById('mediaTitle').value.trim();
  var author = document.getElementById('mediaAuthor').value.trim() || 'Admin';
  var cat = document.getElementById('mediaCategory').value;
  var file = document.getElementById('mediaFile').files[0];
  if (!title || !cat || !file) { alert('Fill all fields and select a file'); return; }
  
  var isVideo = file.type.startsWith('video/');
  document.getElementById('mediaMsg').innerHTML = '⏳ Uploading...';
  document.getElementById('progressBar').style.display = 'block';
  
  var sRef = storageRef(storage, 'media/' + Date.now() + '_' + file.name);
  var uploadTask = uploadBytesResumable(sRef, file);
  
  uploadTask.on('state_changed',
    function(snapshot) {
      var progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
      document.getElementById('progressFill').style.width = progress + '%';
      document.getElementById('mediaMsg').innerHTML = '⏳ ' + Math.round(progress) + '%';
    },
    function(error) { document.getElementById('mediaMsg').innerHTML = '❌ ' + error.message; },
    async function() {
      var url = await getDownloadURL(uploadTask.snapshot.ref);
      await addDoc(collection(db, 'news'), {
        title: title, author: author,
        date: new Date().toLocaleDateString('en-US', {year:'numeric', month:'long', day:'numeric'}),
        content: isVideo ? '🎥 ' + title : '📸 ' + title,
        imageUrl: isVideo ? '' : url, videoUrl: isVideo ? url : '',
        category: cat, createdAt: new Date()
      });
      document.getElementById('mediaMsg').innerHTML = '✅ Posted!';
      document.getElementById('progressBar').style.display = 'none';
      document.getElementById('mediaFile').value = '';
      document.getElementById('previewBox').style.display = 'none';
    }
  );
};

// DOCUMENT UPLOAD
window.uploadDocument = async function() {
  var title = document.getElementById('docTitle').value.trim();
  var author = document.getElementById('docAuthor').value.trim() || 'Admin';
  var cat = document.getElementById('docCategory').value;
  var file = document.getElementById('docFile').files[0];
  if (!title || !cat || !file) { alert('Fill all fields and select a file'); return; }
  
  document.getElementById('docMsg').innerHTML = '⏳ Uploading...';
  document.getElementById('docProgressBar').style.display = 'block';
  
  var sRef = storageRef(storage, 'documents/' + Date.now() + '_' + file.name);
  var uploadTask = uploadBytesResumable(sRef, file);
  
  uploadTask.on('state_changed',
    function(snapshot) {
      var progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
      document.getElementById('docProgressFill').style.width = progress + '%';
    },
    function(error) { document.getElementById('docMsg').innerHTML = '❌ ' + error.message; },
    async function() {
      var url = await getDownloadURL(uploadTask.snapshot.ref);
      await addDoc(collection(db, 'documents'), {
        title: title, author: author, category: cat,
        fileUrl: url, fileName: file.name, createdAt: new Date()
      });
      document.getElementById('docMsg').innerHTML = '✅ Document uploaded!';
      document.getElementById('docProgressBar').style.display = 'none';
    }
  );
};

// RESULTS
window.addResult = async function() {
  var reg = document.getElementById('resultRegNo').value.trim();
  var name = document.getElementById('resultName').value.trim();
  var sem = document.getElementById('resultSemester').value;
  var coursesText = document.getElementById('resultCourses').value.trim();
  if (!reg || !name || !sem || !coursesText) { alert('Fill all fields'); return; }
  
  try {
    var courses = JSON.parse(coursesText);
    var totalPoints = 0;
    courses.forEach(function(c) { totalPoints += Number(c.point) || 0; });
    var gpa = (totalPoints / courses.length).toFixed(2);
    
    await setDoc(doc(db, 'results', reg.replace(/\//g, '_') + '_' + sem), {
      regNo: reg, name: name, semester: sem,
      courses: courses, gpa: parseFloat(gpa), createdAt: new Date()
    });
    document.getElementById('resultMsg').innerHTML = '✅ Result added! GPA: ' + gpa;
  } catch(err) {
    document.getElementById('resultMsg').innerHTML = '❌ Invalid JSON format';
  }
};

// TIMETABLE
window.updateTimetable = async function() {
  var day = document.getElementById('ttDay').value;
  var classesText = document.getElementById('ttClasses').value.trim();
  if (!day || !classesText) { alert('Fill all fields'); return; }
  
  try {
    var classes = JSON.parse(classesText);
    await setDoc(doc(db, 'timetable', day), {
      day: day, classes: classes, updatedAt: new Date()
    });
    document.getElementById('ttMsg').innerHTML = '✅ Timetable updated for ' + day;
  } catch(err) {
    document.getElementById('ttMsg').innerHTML = '❌ Invalid JSON format';
  }
};

// MANAGE NEWS
window.loadNewsList = async function() {
  var list = document.getElementById('newsList');
  list.innerHTML = 'Loading...';
  try {
    var snapshot = await getDocs(collection(db, 'news'));
    var html = '';
    snapshot.forEach(function(doc) {
      var data = doc.data();
      html += '<div class="news-list-item"><span class="title">' + (data.title || 'Untitled') + '</span><button onclick="deleteNews(\'' + doc.id + '\')">🗑️</button></div>';
    });
    list.innerHTML = html || '<p style="color:#999;">No news found.</p>';
  } catch(err) {
    list.innerHTML = '<p style="color:#f44336;">Error loading.</p>';
  }
};

window.deleteNews = async function(id) {
  if (confirm('Delete this news?')) {
    await deleteDoc(doc(db, 'news', id));
    loadNewsList();
  }
};
</script>
</body>
</html>
