<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel - CampusConnect</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
body{background:#0a0a0a;color:#fff;max-width:500px;margin:0 auto;min-height:100vh}
.header{background:linear-gradient(135deg,#1B5E20,#2E7D32);padding:16px 20px;display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:18px;color:white}
.header a{color:white;font-size:13px;text-decoration:none;background:rgba(255,255,255,0.2);padding:8px 14px;border-radius:20px}
.content{padding:15px}
.card{background:#1a1a2e;padding:20px;border-radius:12px;margin-bottom:15px;box-shadow:0 2px 8px rgba(0,0,0,0.3)}
.card h2{color:#4caf50;margin-bottom:15px;font-size:16px}
.card input,.card textarea,.card select{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:2px solid #333;background:#0a0a0a;color:white;font-size:13px;outline:none}
.card input:focus,.card textarea:focus{border-color:#1B5E20}
.card textarea{min-height:80px;resize:vertical}
.btn{display:block;width:100%;padding:14px;margin:8px 0;background:#1B5E20;color:white;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;text-align:center}
.btn-blue{background:#0f3460}
.btn-red{background:#cc0000}
.success{color:#4caf50;text-align:center;margin:10px 0;font-size:12px}
.footer{text-align:center;padding:20px;color:#555;font-size:11px}
.footer a{color:#4caf50;text-decoration:none}
</style>
</head>
<body>

<div class="header"><h1>🔧 Admin Panel</h1><a href="index.html">← Home</a></div>
<div class="content">

<!-- NEWS UPLOAD -->
<div class="card">
<h2>📰 Upload News</h2>
<input type="text" id="newsTitle" placeholder="News Title">
<input type="date" id="newsDate">
<textarea id="newsContent" placeholder="News Content (supports 1000+ characters)"></textarea>
<input type="text" id="newsImage" placeholder="Image URL (optional)">
<input type="text" id="newsVideo" placeholder="Video URL (optional)">
<select id="newsCategory">
<option value="">Select Category</option>
<option value="Academic">Academic</option>
<option value="Sports">Sports</option>
<option value="Events">Events</option>
<option value="Urgent">Urgent</option>
</select>
<button class="btn" onclick="uploadNews()">📤 Upload to Firebase</button>
<p class="success" id="newsMsg"></p>
</div>

<!-- FILE UPLOAD -->
<div class="card">
<h2>📁 Upload Image/Video</h2>
<input type="file" id="mediaFile" accept="image/*,video/*">
<button class="btn btn-blue" onclick="uploadMedia()">📤 Upload Media to Storage</button>
<p class="success" id="mediaMsg"></p>
<p style="font-size:10px;color:#999;" id="mediaUrl"></p>
</div>

<!-- QUICK LINKS -->
<div class="card">
<h2>🔗 Quick Links</h2>
<button class="btn" onclick="window.open('https://docs.google.com/spreadsheets/d/13RLLmcXk6BAZBWAxgiHcy_BwOAhhpPxwLQb1W12uyLg/edit','_blank')">📊 Open Google Sheets</button>
<button class="btn btn-blue" onclick="window.open('https://console.firebase.google.com/project/campuconnect-bd52f/firestore/data','_blank')">☁️ Open Firestore</button>
</div>

</div>
<div class="footer"><a href="index.html">← Back to CampusConnect</a></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";
import { getStorage, ref as storageRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyB553_waOZcKoyvIdF7NsIH7EpjjbUeP68",
  authDomain: "campuconnect-bd52f.firebaseapp.com",
  projectId: "campuconnect-bd52f",
  storageBucket: "campuconnect-bd52f.firebasestorage.app",
  messagingSenderId: "762013163609",
  appId: "1:762013163609:web:7f565fbde05a4ad35ed148"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);

window.uploadNews = async function() {
  var t = document.getElementById('newsTitle').value.trim();
  var d = document.getElementById('newsDate').value;
  var c = document.getElementById('newsContent').value.trim();
  var img = document.getElementById('newsImage').value.trim();
  var vid = document.getElementById('newsVideo').value.trim();
  var cat = document.getElementById('newsCategory').value;
  
  if(!t || !d || !c || !cat){ alert('Fill all required fields'); return; }
  
  try {
    await addDoc(collection(db, 'news'), {
      title: t, date: d, content: c, imageUrl: img, videoUrl: vid,
      category: cat, createdAt: new Date()
    });
    document.getElementById('newsMsg').innerHTML = '✅ News uploaded successfully!';
    document.getElementById('newsTitle').value = '';
    document.getElementById('newsContent').value = '';
    document.getElementById('newsImage').value = '';
    document.getElementById('newsVideo').value = '';
  } catch(err) {
    document.getElementById('newsMsg').innerHTML = '❌ Error: ' + err.message;
  }
};

window.uploadMedia = async function() {
  var file = document.getElementById('mediaFile').files[0];
  if(!file){ alert('Select a file first'); return; }
  
  try {
    var sRef = storageRef(storage, 'media/' + Date.now() + '_' + file.name);
    var snapshot = await uploadBytes(sRef, file);
    var url = await getDownloadURL(snapshot.ref);
    document.getElementById('mediaMsg').innerHTML = '✅ Uploaded!';
    document.getElementById('mediaUrl').innerHTML = 'URL: ' + url;
  } catch(err) {
    document.getElementById('mediaMsg').innerHTML = '❌ Error: ' + err.message;
  }
};
</script>
</body>
</html>
