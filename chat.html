<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Chat - CampusConnect</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:#F5F5F5;max-width:480px;margin:0 auto;min-height:100vh}
.header{background:#1B5E20;color:white;padding:18px 20px;font-size:20px;font-weight:bold;text-align:center}
.chat-area{padding:15px}
.chat-messages{max-height:450px;overflow-y:auto;padding:10px;background:white;border-radius:12px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
.msg{padding:10px 14px;border-radius:14px;margin:6px 0;max-width:80%;font-size:13px}
.msg.user{background:#1B5E20;color:white;margin-left:auto;border-bottom-right-radius:4px}
.msg.other{background:#E8E8E8;color:#333;margin-right:auto;border-bottom-left-radius:4px}
.msg .sender{font-size:10px;font-weight:700;margin-bottom:3px;opacity:0.8}
.msg .text{font-size:13px;line-height:1.4}
.msg .time{font-size:8px;opacity:0.5;text-align:right;margin-top:4px}
.input-row{display:flex;gap:8px}
.input-row input{flex:1;padding:12px 15px;border-radius:25px;border:2px solid #E0E0E0;font-size:13px;outline:none}
.input-row input:focus{border-color:#1B5E20}
.input-row button{padding:12px 20px;background:#1B5E20;color:white;border:none;border-radius:25px;font-weight:600;cursor:pointer;white-space:nowrap}
.clear-btn{display:block;width:100%;padding:10px;margin-top:10px;background:#FF5722;color:white;border:none;border-radius:10px;font-size:12px;font-weight:600;cursor:pointer}
.footer{text-align:center;padding:20px;color:#999;font-size:11px}
</style>
</head>
<body>

<div class="header">💬 Student Chat</div>
<div class="chat-area">
    <div class="chat-messages" id="chatMsgs">
        <p style="text-align:center;color:#9E9E9E;padding:20px;">No messages yet. Start the conversation!</p>
    </div>
    <div class="input-row">
        <input type="text" id="chatInput" placeholder="Type your message..." onkeypress="if(event.key==='Enter')sendMsg()">
        <button onclick="sendMsg()">Send</button>
    </div>
    <button class="clear-btn" onclick="clearChat()">🗑️ Clear All Messages</button>
</div>
<div class="footer">
    <a href="index.html" style="color:#1B5E20;text-decoration:none;font-weight:600;">← Back to CampusConnect</a>
</div>

<script>
var messages = JSON.parse(localStorage.getItem('cc_chat_separate') || '[]');

function renderChat(){
    var el = document.getElementById('chatMsgs');
    if(!el) return;
    if(messages.length === 0){
        el.innerHTML = '<p style="text-align:center;color:#9E9E9E;padding:20px;">No messages yet. Start the conversation!</p>';
        return;
    }
    var h = '';
    messages.forEach(function(m){
        h += '<div class="msg ' + (m.sender === 'You' ? 'user' : 'other') + '">';
        h += '<div class="sender">' + m.sender + '</div>';
        h += '<div class="text">' + m.text + '</div>';
        h += '<div class="time">' + m.time + '</div>';
        h += '</div>';
    });
    el.innerHTML = h;
    el.scrollTop = el.scrollHeight;
}

function sendMsg(){
    var inp = document.getElementById('chatInput');
    if(!inp) return;
    var text = inp.value.trim();
    if(!text) return;
    messages.push({
        sender: 'Student',
        text: text,
        time: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})
    });
    localStorage.setItem('cc_chat_separate', JSON.stringify(messages));
    inp.value = '';
    renderChat();
}

function clearChat(){
    if(confirm('Delete all messages? This cannot be undone.')){
        messages = [];
        localStorage.removeItem('cc_chat_separate');
        renderChat();
    }
}

renderChat();
</script>
</body>
  </html>
