<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Results - CampusConnect</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
body{background:#0a0a0a;color:#fff;max-width:500px;margin:0 auto;min-height:100vh}
.header{background:linear-gradient(135deg,#1B5E20,#2E7D32);padding:16px 20px;display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:18px;color:white}
.header a{color:white;font-size:13px;text-decoration:none;background:rgba(255,255,255,0.2);padding:8px 14px;border-radius:20px}
.content{padding:15px;padding-bottom:40px}
.card{background:#1a1a2e;padding:20px;border-radius:14px;margin-bottom:15px;border:1px solid #2a2a3e}
.card h2{color:#4caf50;font-size:16px;margin-bottom:14px}
label{display:block;color:#aaa;font-size:11px;font-weight:600;margin-bottom:4px;margin-top:12px}
.card input,.card textarea,.card select{width:100%;padding:13px 14px;border-radius:10px;border:2px solid #333;background:#0d0d1a;color:white;font-size:13px;outline:none;transition:0.3s}
.card input:focus,.card textarea:focus,.card select:focus{border-color:#4caf50}
.card textarea{min-height:100px;resize:vertical;font-family:monospace;font-size:12px}
.btn{display:block;width:100%;padding:14px;margin:10px 0;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;text-align:center;color:white;transition:0.3s}
.btn-green{background:linear-gradient(135deg,#1B5E20,#2E7D32)}
.btn-green:hover{opacity:0.9}
.btn-green:disabled{opacity:0.5;cursor:not-allowed}
.hint{font-size:10px;color:#555;margin-top:4px;line-height:1.5}
.toast{position:fixed;top:20px;right:20px;padding:12px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:9999;animation:slideIn 0.3s ease;max-width:280px}
.toast.success{background:#1a3a2a;color:#4caf50;border:1px solid #4caf50}
.toast.error{background:#2a1a1a;color:#f44336;border:1px solid #f44336}
@keyframes slideIn{from{transform:translateX(110%)}to{transform:translateX(0)}}
.course-builder{background:#0d0d1a;border-radius:10px;padding:12px;margin-top:8px;border:1px solid #333}
.course-row{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:6px;margin-bottom:6px;align-items:center}
.course-row input,.course-row select{margin:0;padding:8px 10px;font-size:12px}
.course-row button{background:#2a0d0d;color:#f44336;border:1px solid #3a1a1a;padding:8px;border-radius:6px;cursor:pointer;font-size:14px}
.add-course-btn{background:#1a3a2a;color:#4caf50;border:1px dashed #4caf50;width:100%;padding:8px;border-radius:8px;cursor:pointer;font-size:12px;margin-top:4px}
.gpa-display{text-align:center;padding:10px;background:#1a3a2a;border-radius:8px;margin-top:8px;color:#ffd700;font-weight:700;font-size:16px;display:none}
</style>
</head>
<body>
<div class="header"><h1>📊 Add Results</h1><a href="admin.html">← Admin</a></div>
<div class="content">
  <div class="card">
    <h2>📊 Add Student Result</h2>

    <label>📋 Registration Number *</label>
    <input type="text" id="resultRegNo" placeholder="e.g. SST/NDCOM/S/2025/186">

    <label>👤 Student Name *</label>
    <input type="text" id="resultName" placeholder="Full name">

    <label>📚 Semester *</label>
    <select id="resultSemester">
      <option value="">— Select Semester —</option>
      <option value="First">First Semester</option>
      <option value="Second">Second Semester</option>
    </select>

    <label>📝 Courses & Grades</label>
    <div class="course-builder">
      <div style="display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:6px;margin-bottom:4px;">
        <span style="font-size:10px;color:#555">Course Code</span>
        <span style="font-size:10px;color:#555">Grade</span>
        <span style="font-size:10px;color:#555">Points</span>
        <span></span>
      </div>
      <div id="courseRows"></div>
      <button class="add-course-btn" onclick="addCourseRow()">+ Add Course</button>
    </div>
    <div class="gpa-display" id="gpaDisplay">GPA: —</div>

    <button class="btn btn-green" id="addBtn" onclick="addResult()">📤 Save Result</button>

    <p class="hint">💡 Grade points: A=4, B=3, C=2, D=1, F=0. GPA is auto-calculated.</p>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyB553_waOZcKoyvIdF7NsIH7EpjjbUeP68",
  authDomain: "campuconnect-bd52f.firebaseapp.com",
  projectId: "campuconnect-bd52f",
  storageBucket: "campuconnect-bd52f.firebasestorage.app",
  messagingSenderId: "762013163609",
  appId: "1:762013163609:web:7f565fbde05a4ad35ed148"
});
const db = getFirestore(app);

var COURSES = ['COM111','COM112','COM113','COM114','COM115','GNS101','GNS102','MTH111'];
var courseCount = 0;

function showToast(msg, type) {
  var t = document.createElement('div'); t.className='toast '+(type||'success'); t.innerHTML=msg;
  document.body.appendChild(t); setTimeout(function(){ t.remove(); }, 4000);
}

window.addCourseRow = function() {
  var id = ++courseCount;
  var courseOpts = COURSES.map(function(c){ return '<option value="'+c+'">'+c+'</option>'; }).join('');
  var row = document.createElement('div');
  row.className = 'course-row';
  row.id = 'crow-' + id;
  row.innerHTML =
    '<select onchange="calcGPA()"><option value="">Course</option>' + courseOpts + '</select>'
    + '<select onchange="autoPoint(this);calcGPA()">'
    + '<option value="">Grade</option>'
    + '<option value="A">A</option><option value="B">B</option>'
    + '<option value="C">C</option><option value="D">D</option><option value="F">F</option>'
    + '</select>'
    + '<input type="number" min="0" max="4" step="0.5" placeholder="Pts" oninput="calcGPA()">'
    + '<button onclick="document.getElementById(\'crow-'+id+'\').remove();calcGPA()">✕</button>';
  document.getElementById('courseRows').appendChild(row);
};

window.autoPoint = function(sel) {
  var map = {A:4,B:3,C:2,D:1,F:0};
  var row = sel.closest('.course-row');
  var ptInput = row.querySelectorAll('input')[0];
  if (sel.value && map[sel.value] !== undefined) ptInput.value = map[sel.value];
};

window.calcGPA = function() {
  var rows = document.querySelectorAll('.course-row');
  var total = 0, count = 0;
  rows.forEach(function(r) {
    var pt = parseFloat(r.querySelectorAll('input')[0].value);
    if (!isNaN(pt)) { total += pt; count++; }
  });
  var gpaEl = document.getElementById('gpaDisplay');
  if (count > 0) {
    gpaEl.style.display = 'block';
    gpaEl.innerHTML = '📊 Calculated GPA: ' + (total/count).toFixed(2);
  } else {
    gpaEl.style.display = 'none';
  }
};

window.addResult = async function() {
  var reg = document.getElementById('resultRegNo').value.trim();
  var name = document.getElementById('resultName').value.trim();
  var sem = document.getElementById('resultSemester').value;
  if (!reg || !name || !sem) { showToast('⚠️ Fill all required fields', 'error'); return; }

  var rows = document.querySelectorAll('.course-row');
  var courses = []; var totalPts = 0;
  rows.forEach(function(r) {
    var sels = r.querySelectorAll('select');
    var courseCode = sels[0].value;
    var grade = sels[1].value;
    var pt = parseFloat(r.querySelectorAll('input')[0].value);
    if (courseCode && grade && !isNaN(pt)) {
      courses.push({ course: courseCode, grade: grade, point: pt });
      totalPts += pt;
    }
  });

  if (courses.length === 0) { showToast('⚠️ Add at least one course', 'error'); return; }

  var gpa = parseFloat((totalPts / courses.length).toFixed(2));
  var btn = document.getElementById('addBtn');
  btn.disabled = true; btn.innerHTML = '⏳ Saving...';

  try {
    var docId = reg.replace(/\//g,'_') + '_' + sem;
    await setDoc(doc(db, 'results', docId), {
      regNo: reg, name: name, semester: sem,
      courses: courses, gpa: gpa, createdAt: new Date()
    });
    showToast('✅ Result saved! GPA: ' + gpa + '. Students can now check their results.', 'success');
    // Clear course rows
    document.getElementById('courseRows').innerHTML = '';
    document.getElementById('resultRegNo').value = '';
    document.getElementById('resultName').value = '';
    document.getElementById('resultSemester').value = '';
    document.getElementById('gpaDisplay').style.display = 'none';
    courseCount = 0;
  } catch(e) {
    showToast('❌ Error: ' + e.message, 'error');
  }
  btn.disabled = false; btn.innerHTML = '📤 Save Result';
};

// Add initial course rows
addCourseRow(); addCourseRow(); addCourseRow();
</script>
</body>
</html>
