<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Results - CampusConnect</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
body{background:#0a0a0a;color:#fff;max-width:500px;margin:0 auto;min-height:100vh}
.header{background:linear-gradient(135deg,#1B5E20,#2E7D32);padding:16px 20px;display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:18px;color:white}
.header a{color:white;font-size:13px;text-decoration:none;background:rgba(255,255,255,0.2);padding:8px 14px;border-radius:20px}
.content{padding:15px}
.card{background:#1a1a2e;padding:20px;border-radius:12px;margin-bottom:15px}
.card h2{color:#4caf50;font-size:16px;margin-bottom:12px}
.card input,.card textarea,.card select{width:100%;padding:14px;margin:8px 0;border-radius:10px;border:2px solid #333;background:#0d0d1a;color:white;font-size:13px;outline:none}
.card input:focus,.card textarea:focus,.card select:focus{border-color:#4caf50}
.card textarea{min-height:80px;resize:vertical}
.btn{display:block;width:100%;padding:14px;margin:10px 0;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;text-align:center;color:white}
.btn-green{background:linear-gradient(135deg,#1B5E20,#2E7D32)}
.success{color:#4caf50;text-align:center;margin:10px 0;font-size:12px}
</style>
</head>
<body>
<div class="header"><h1>📊 Admin Results</h1><a href="index.html">← Home</a></div>
<div class="content">
<div class="card">
<h2>📊 Add Student Result</h2>
<input type="text" id="resultRegNo" placeholder="Registration Number">
<input type="text" id="resultName" placeholder="Student Name">
<select id="resultSemester"><option value="">Semester</option><option value="First">First</option><option value="Second">Second</option></select>
<textarea id="resultCourses" placeholder='Paste courses as JSON: [{"course":"COM111","grade":"A","point":4}]'></textarea>
<button class="btn btn-green" onclick="addResult()">📤 Add Result</button>
<p class="success" id="resultMsg"></p>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";
const app = initializeApp({apiKey:"AIzaSyB553_waOZcKoyvIdF7NsIH7EpjjbUeP68",authDomain:"campuconnect-bd52f.firebaseapp.com",projectId:"campuconnect-bd52f",storageBucket:"campuconnect-bd52f.firebasestorage.app",messagingSenderId:"762013163609",appId:"1:762013163609:web:7f565fbde05a4ad35ed148"});
const db = getFirestore(app);

window.addResult = async function() {
  var reg=document.getElementById('resultRegNo').value.trim(), name=document.getElementById('resultName').value.trim();
  var sem=document.getElementById('resultSemester').value, ct=document.getElementById('resultCourses').value.trim();
  if(!reg||!name||!sem||!ct){alert('Fill all fields');return}
  try {
    var courses=JSON.parse(ct), tp=0;
    courses.forEach(function(c){tp+=Number(c.point)||0;});
    var gpa=(tp/courses.length).toFixed(2);
    await setDoc(doc(db,'results',reg.replace(/\//g,'_')+'_'+sem),{regNo:reg,name:name,semester:sem,courses:courses,gpa:parseFloat(gpa),createdAt:new Date()});
    document.getElementById('resultMsg').innerHTML='✅ Result added! GPA: '+gpa;
  } catch(e) { document.getElementById('resultMsg').innerHTML='❌ Invalid JSON'; }
};
</script>
</body>
</html>
