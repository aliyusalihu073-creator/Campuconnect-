<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Documents - CampusConnect</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
body{background:#0d1117;color:#fff;max-width:480px;margin:0 auto;min-height:100vh}
.header{background:linear-gradient(135deg,#0d4a1a,#1a6b2e);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.header h1{font-size:16px;color:white}
.header a{color:white;font-size:12px;text-decoration:none;background:rgba(255,255,255,0.2);padding:6px 12px;border-radius:15px}
.content{padding:15px;padding-bottom:40px}
.card{background:#161b22;border-radius:12px;padding:14px;margin-bottom:10px;border:1px solid #30363d}
.card b{color:#4caf50}
.doc-item{background:#21262d;border-radius:10px;padding:12px;margin:8px 0;display:flex;align-items:center;gap:12px;border:1px solid #30363d;transition:0.2s}
.doc-item:hover{border-color:#4caf50}
.doc-icon{font-size:28px;flex-shrink:0}
.doc-info{flex:1;min-width:0}
.doc-title{font-size:13px;font-weight:600;color:#e0e0e0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc-meta{font-size:10px;color:#666;margin-top:2px}
.doc-cat{display:inline-block;padding:2px 8px;border-radius:8px;font-size:9px;font-weight:700;background:#1a3a2a;color:#4caf50;margin-top:4px}
.doc-actions{display:flex;gap:6px;margin-top:8px}
.doc-btn{flex:1;padding:8px;border:none;border-radius:8px;font-size:11px;font-weight:600;cursor:pointer}
.btn-open{background:linear-gradient(135deg,#0d4a1a,#1a6b2e);color:white}
.btn-dl{background:#21262d;color:#4caf50;border:1px solid #30363d}
.skeleton{background:linear-gradient(90deg,#161b22 25%,#21262d 50%,#161b22 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:10px;height:80px;margin:8px 0}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.empty{text-align:center;color:#555;padding:30px;font-size:13px}
.viewer-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.97);z-index:9999;flex-direction:column}
.viewer-overlay.show{display:flex}
.viewer-header{background:#0d4a1a;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.viewer-title{font-size:14px;font-weight:700;color:white;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-right:10px}
.viewer-btns{display:flex;gap:8px;flex-shrink:0}
.viewer-btns button{padding:7px 12px;border:none;border-radius:8px;font-size:11px;font-weight:600;cursor:pointer}
.close-btn{background:rgba(255,255,255,0.2);color:white}
.dl-btn{background:#ffd700;color:#000}
.viewer-frame{flex:1;width:100%;border:none}
.viewer-loading{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:12px;color:#4caf50}
.spinner{width:40px;height:40px;border:3px solid rgba(76,175,80,0.2);border-top-color:#4caf50;border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.footer{text-align:center;padding:15px;color:#555;font-size:10px}
.footer a{color:#4caf50;text-decoration:none}
</style>
</head>
<body>
<div class="header">
  <h1>📁 Documents</h1>
  <a href="index.html">← Home</a>
</div>
<div class="content">
  <div class="card"><b>📁 All Documents</b><p style="font-size:11px;color:#666;margin-top:4px">Tap Open to view · Download saves to phone</p></div>
  <div id="docsContainer">
    <div class="skeleton"></div>
    <div class="skeleton"></div>
    <div class="skeleton"></div>
  </div>
</div>
<div class="footer"><a href="index.html">← Back to CampusConnect</a></div>

<div class="viewer-overlay" id="viewerOverlay">
  <div class="viewer-header">
    <div class="viewer-title" id="viewerTitle">Document</div>
    <div class="viewer-btns">
      <button class="dl-btn" onclick="dlCurrent()">📥 Download</button>
      <button class="close-btn" onclick="closeViewer()">✕ Close</button>
    </div>
  </div>
  <div class="viewer-loading" id="viewerLoading">
    <div class="spinner"></div>
    <p style="font-size:13px">Loading...</p>
  </div>
  <iframe class="viewer-frame" id="viewerFrame" src="" style="display:none"
    onload="document.getElementById('viewerLoading').style.display='none';this.style.display='block'">
  </iframe>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";
import { getFirestore, collection, getDocs, query, orderBy }
  from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyB553_waOZcKoyvIdF7NsIH7EpjjbUeP68",
  authDomain:"campuconnect-bd52f.firebaseapp.com",
  projectId:"campuconnect-bd52f",
  storageBucket:"campuconnect-bd52f.firebasestorage.app",
  messagingSenderId:"762013163609",
  appId:"1:762013163609:web:7f565fbde05a4ad35ed148"
});
const db = getFirestore(app);
var dlUrl = '';

function toViewUrl(url){
  if(!url)return'';
  if(url.includes('/preview'))return url;
  if(url.includes('drive.google.com/file/d/')){var id=url.split('/d/')[1].split('/')[0];return'https://drive.google.com/file/d/'+id+'/preview';}
  if(url.includes('drive.google.com/open?id=')){var id=url.split('id=')[1].split('&')[0];return'https://drive.google.com/file/d/'+id+'/preview';}
  return'https://docs.google.com/viewer?url='+encodeURIComponent(url)+'&embedded=true';
}

function toDlUrl(url){
  if(!url)return'';
  if(url.includes('drive.google.com/file/d/')){var id=url.split('/d/')[1].split('/')[0];return'https://drive.google.com/uc?export=download&id='+id;}
  if(url.includes('drive.google.com/open?id=')){var id=url.split('id=')[1].split('&')[0];return'https://drive.google.com/uc?export=download&id='+id;}
  return url;
}

window.openDoc=function(viewUrl,title,downloadUrl){
  dlUrl=downloadUrl;
  document.getElementById('viewerTitle').innerHTML=title;
  document.getElementById('viewerLoading').style.display='flex';
  document.getElementById('viewerFrame').style.display='none';
  document.getElementById('viewerFrame').src=viewUrl;
  document.getElementById('viewerOverlay').classList.add('show');
};
window.closeViewer=function(){document.getElementById('viewerOverlay').classList.remove('show');document.getElementById('viewerFrame').src='';};
window.dlCurrent=function(){if(dlUrl)window.open(dlUrl,'_blank');};

async function load(){
  try{
    var q=query(collection(db,'documents'),orderBy('createdAt','desc'));
    var snap=await getDocs(q);
    var docs=[];
    snap.forEach(function(d){var data=d.data();data.id=d.id;docs.push(data);});
    if(docs.length===0){document.getElementById('docsContainer').innerHTML='<div class="empty">📭 No documents yet.</div>';return;}
    var h='';
    docs.forEach(function(d){
      var v=toViewUrl(d.fileUrl||d.originalUrl||'');
      var dl=toDlUrl(d.originalUrl||d.fileUrl||'');
      var ext=(d.fileName||'').split('.').pop().toLowerCase();
      var icon=ext==='pdf'?'📕':['doc','docx'].includes(ext)?'📘':['ppt','pptx'].includes(ext)?'📙':'📄';
      h+='<div class="doc-item"><div class="doc-icon">'+icon+'</div><div class="doc-info"><div class="doc-title">'+(d.title||'Document')+'</div><div class="doc-meta">✍️ '+(d.author||'Admin')+'</div><span class="doc-cat">'+(d.category||'Other')+'</span><div class="doc-actions"><button class="doc-btn btn-open" onclick="openDoc(\''+v.replace(/'/g,"\\'")+'\',\''+(d.title||'').replace(/'/g,"\\'")+'\',\''+dl.replace(/'/g,"\\'")+'\')">👁️ Open</button><button class="doc-btn btn-dl" onclick="window.open(\''+dl.replace(/'/g,"\\'")+'\',\'_blank\')">📥 Download</button></div></div></div>';
    });
    document.getElementById('docsContainer').innerHTML=h;
  }catch(e){document.getElementById('docsContainer').innerHTML='<div class="empty">❌ Could not load. Check connection.</div>';}
}
load();
</script>
</body>
</html>
