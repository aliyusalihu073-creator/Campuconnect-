<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Timetable - CampusConnect</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
body{background:#0a0a0a;color:#fff;max-width:500px;margin:0 auto;min-height:100vh}
.header{background:linear-gradient(135deg,#1B5E20,#2E7D32);padding:16px 20px;display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:18px;color:white}
.header a{color:white;font-size:13px;text-decoration:none;background:rgba(255,255,255,0.2);padding:8px 14px;border-radius:20px}
.content{padding:15px;padding-bottom:40px}
.card{background:#1a1a2e;padding:20px;border-radius:14px;margin-bottom:15px;border:1px solid #2a2a3e}
.card h2{color:#4caf50;font-size:16px;margin-bottom:14px}
label{display:block;color:#aaa;font-size:11px;font-weight:600;margin-bottom:4px;margin-top:12px}
.card select{width:100%;padding:13px 14px;border-radius:10px;border:2px solid #333;background:#0d0d1a;color:white;font-size:13px;outline:none;transition:0.3s}
.card select:focus{border-color:#4caf50}
.class-builder{background:#0d0d1a;border-radius:10px;padding:12px;margin-top:8px;border:1px solid #333}
.class-row{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:6px;margin-bottom:6px;align-items:center}
.class-row input,.class-row select{margin:0;padding:8px 10px;font-size:12px;border-radius:8px;border:1px solid #333;background:#161b22;color:white;outline:none}
.class-row input:focus,.class-row select:focus{border-color:#4caf50}
.class-row button{background:#2a0d0d;color:#f44336;border:1px solid #3a1a1a;padding:8px;border-radius:6px;cursor:pointer;font-size:14px}
.add-class-btn{background:#1a3a2a;color:#4caf50;border:1px dashed #4caf50;width:100%;padding:8px;border-radius:8px;cursor:pointer;font-size:12px;margin-top:4px}
.btn{display:block;width:100%;padding:14px;margin:10px 0;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;text-align:center;color:white;transition:0.3s}
.btn-green{background:linear-gradient(135deg,#1B5E20,#2E7D32)}
.btn-green:hover{opacity:0.9}
.btn-green:disabled{opacity:0.5;cursor:not-allowed}
.btn-blue{background:linear-gradient(135deg,#0f3460,#1a5276)}
.current-tt{background:#0d0d1a;border-radius:10px;padding:12px;margin-top:8px}
.tt-day{color:#4caf50;font-weight:700;font-size:12px;margin:8px 0 4px}
.tt-class{color:#ccc;font-size:11px;padding:4px 8px;background:#161b22;border-radius:6px;margin:3px 0;border-left:2px solid #4caf50}
.hint{font-size:10px;color:#555;margin-top:4px}
.toast{position:fixed;top:20px;right:20px;padding:12px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:9999;animation:slideIn 0.3s ease;max-width:280px}
.toast.success{background:#1a3a2a;color:#4caf50;border:1px solid #4caf50}
.toast.error{background:#2a1a1a;color:#f44336;border:1px solid #f44336}
@keyframes slideIn{from{transform:translateX(110%)}to{transform:translateX(0)}}
</style>
</head>
<body>
<div id="authGate" style="position:fixed;inset:0;background:#0a0a0a;z-index:99999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;font-family:'Segoe UI',Arial,sans-serif">
  <div style="width:36px;height:36px;border:3px solid rgba(76,175,80,0.2);border-top-color:#4caf50;border-radius:50%;animation:authSpin 0.8s linear infinite"></div>
  <p style="color:#4caf50;font-size:13px">Verifying admin access...</p>
</div>
<style>@keyframes authSpin{to{transform:rotate(360deg)}}</style>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";
const __guardApp = initializeApp({
  apiKey: "AIzaSyB553_waOZcKoyvIdF7NsIH7EpjjbUeP68",
  authDomain: "campuconnect-bd52f.firebaseapp.com",
  projectId: "campuconnect-bd52f",
  storageBucket: "campuconnect-bd52f.firebasestorage.app",
  messagingSenderId: "762013163609",
  appId: "1:762013163609:web:7f565fbde05a4ad35ed148"
}, "authGuard");
const __guardAuth = getAuth(__guardApp);
const ADMIN_EMAILS = ['aliyusalihu@gmail.com', 'admin@campusconnect.com', 'aliyusalihu073@gmail.com'];
onAuthStateChanged(__guardAuth, function(user) {
  var gate = document.getElementById('authGate');
  if (!user) { window.location.href = 'login.html'; return; }
  if (!ADMIN_EMAILS.includes(user.email)) {
    gate.innerHTML = '<div style="text-align:center;padding:30px">'
      + '<p style="font-size:40px">🚫</p>'
      + '<p style="color:#f44336;font-size:16px;margin:10px 0">Access Denied</p>'
      + '<p style="color:#999;font-size:12px">You do not have admin privileges.</p>'
      + '<a href="index.html" style="display:inline-block;margin-top:16px;background:#0d4a1a;color:white;padding:10px 20px;border-radius:10px;text-decoration:none;font-size:13px">← Go Home</a>'
      + '</div>';
    return;
  }
  gate.remove();
});
</script>

<div class="header"><h1>🗓️ Timetable</h1><a href="admin.html">← Admin</a></div>
<div class="content">
  <div class="card">
    <h2>🗓️ Update Class Schedule</h2>
    <p class="hint" style="margin-bottom:10px;">Students see this immediately after you save.</p>

    <label>📅 Day of Week *</label>
    <select id="ttDay" onchange="loadCurrentDay()">
      <option value="">— Select Day —</option>
      <option value="MONDAY">Monday</option>
      <option value="TUESDAY">Tuesday</option>
      <option value="WEDNESDAY">Wednesday</option>
      <option value="THURSDAY">Thursday</option>
      <option value="FRIDAY">Friday</option>
    </select>

    <!-- Current timetable for selected day -->
    <div id="currentDayDisplay" style="display:none">
      <label>📋 Current Schedule for this Day</label>
      <div class="current-tt" id="currentDayContent"></div>
    </div>

    <label>➕ New Classes</label>
    <div class="class-builder">
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:6px;margin-bottom:6px;">
        <span style="font-size:10px;color:#555">Time</span>
        <span style="font-size:10px;color:#555">Course</span>
        <span style="font-size:10px;color:#555">Venue</span>
        <span></span>
      </div>
      <div id="classRows"></div>
      <button class="add-class-btn" onclick="addClassRow()">+ Add Class</button>
    </div>

    <button class="btn btn-green" id="updateBtn" onclick="updateTT()">📤 Save Timetable</button>
    <p class="hint">⚠️ This will replace the entire day's schedule for students.</p>
  </div>

  <!-- Preview all days -->
  <div class="card">
    <h2>📅 Full Timetable Preview</h2>
    <button class="btn btn-blue" onclick="loadAllDays()" style="margin-bottom:10px">🔄 Load Current Timetable</button>
    <div id="fullTTDisplay"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc, collection, getDocs }
  from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyB553_waOZcKoyvIdF7NsIH7EpjjbUeP68",
  authDomain: "campuconnect-bd52f.firebaseapp.com",
  projectId: "campuconnect-bd52f",
  storageBucket: "campuconnect-bd52f.firebasestorage.app",
  messagingSenderId: "762013163609",
  appId: "1:762013163609:web:7f565fbde05a4ad35ed148"
});
const db = getFirestore(app);

var COURSES = ['COM111','COM112','COM113','COM114','COM115','GNS101','GNS102','MTH111'];
var TIMES = ['8:00-10:00','10:00-12:00','12:00-2:00','2:00-4:00','4:00-6:00'];
var VENUES = ['Hall A','Hall B','Hall C','LT1','LT2','Computer Lab','Digital Lab','Programming Lab'];
var classCount = 0;

function showToast(msg, type) {
  var t = document.createElement('div'); t.className='toast '+(type||'success'); t.innerHTML=msg;
  document.body.appendChild(t); setTimeout(function(){ t.remove(); }, 4000);
}

window.addClassRow = function() {
  var id = ++classCount;
  var timeOpts = TIMES.map(function(t){ return '<option value="'+t+'">'+t+'</option>'; }).join('');
  var courseOpts = COURSES.map(function(c){ return '<option value="'+c+'">'+c+'</option>'; }).join('');
  var venueOpts = VENUES.map(function(v){ return '<option value="'+v+'">'+v+'</option>'; }).join('');
  var row = document.createElement('div');
  row.className = 'class-row'; row.id = 'clrow-'+id;
  row.innerHTML =
    '<select><option value="">Time</option>' + timeOpts + '</select>'
    + '<select><option value="">Course</option>' + courseOpts + '</select>'
    + '<select><option value="">Venue</option>' + venueOpts + '</select>'
    + '<button onclick="document.getElementById(\'clrow-'+id+'\').remove()">✕</button>';
  document.getElementById('classRows').appendChild(row);
};

window.loadCurrentDay = async function() {
  var day = document.getElementById('ttDay').value;
  if (!day) return;
  try {
    var snap = await getDoc(doc(db, 'timetable', day));
    var display = document.getElementById('currentDayDisplay');
    var content = document.getElementById('currentDayContent');
    display.style.display = 'block';
    if (snap.exists() && snap.data().classes && snap.data().classes.length > 0) {
      content.innerHTML = snap.data().classes.map(function(c){ return '<div class="tt-class">📌 ' + c + '</div>'; }).join('');
    } else {
      content.innerHTML = '<p style="color:#555;font-size:11px;text-align:center;padding:8px;">No classes set for this day yet.</p>';
    }
  } catch(e) {}
};

window.updateTT = async function() {
  var day = document.getElementById('ttDay').value;
  if (!day) { showToast('⚠️ Please select a day', 'error'); return; }

  var rows = document.querySelectorAll('.class-row');
  var classes = [];
  rows.forEach(function(r) {
    var sels = r.querySelectorAll('select');
    var time = sels[0].value, course = sels[1].value, venue = sels[2].value;
    if (time && course && venue) classes.push(time + ' | ' + course + ' | ' + venue);
  });

  if (classes.length === 0) { showToast('⚠️ Add at least one class', 'error'); return; }

  var btn = document.getElementById('updateBtn');
  btn.disabled = true; btn.innerHTML = '⏳ Saving...';

  try {
    await setDoc(doc(db, 'timetable', day), {
      day: day, classes: classes, updatedAt: new Date()
    });
    showToast('✅ ' + day + ' timetable updated! Students see it now.', 'success');
    loadCurrentDay();
    document.getElementById('classRows').innerHTML = '';
    classCount = 0;
  } catch(e) {
    showToast('❌ Error: ' + e.message, 'error');
  }
  btn.disabled = false; btn.innerHTML = '📤 Save Timetable';
};

window.loadAllDays = async function() {
  var el = document.getElementById('fullTTDisplay');
  el.innerHTML = '<p style="color:#555;font-size:12px;text-align:center">Loading...</p>';
  try {
    var snap = await getDocs(collection(db, 'timetable'));
    var days = ['MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY'];
    var data = {};
    snap.forEach(function(d){ data[d.id] = d.data(); });
    var h = '';
    days.forEach(function(day) {
      h += '<div class="tt-day">▌ ' + day + '</div>';
      if (data[day] && data[day].classes && data[day].classes.length > 0) {
        data[day].classes.forEach(function(c){ h += '<div class="tt-class">' + c + '</div>'; });
      } else {
        h += '<div class="tt-class" style="color:#555;border-left-color:#333">No classes set</div>';
      }
    });
    el.innerHTML = h || '<p style="color:#555;font-size:12px;text-align:center">No timetable data yet.</p>';
  } catch(e) {
    el.innerHTML = '<p style="color:#f44336;font-size:12px;text-align:center">❌ Failed to load.</p>';
  }
};

// Add initial rows
addClassRow(); addClassRow();
</script>
<script>
// Service worker registration - auto-checks for updates and reloads when a new version is ready
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('service-worker.js?v=10', { updateViaCache: 'none' })
      .then(function(reg) {
        reg.update(); // check for a new version right away
        setInterval(function() { reg.update(); }, 30 * 60 * 1000); // re-check every 30 min while the tab is open
      })
      .catch(function() {});
  });

  var __swRefreshed = false;
  navigator.serviceWorker.addEventListener('controllerchange', function() {
    if (__swRefreshed) return;
    __swRefreshed = true;
    window.location.reload();
  });
}
</script>
</body>
</html>
