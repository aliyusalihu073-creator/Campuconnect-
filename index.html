*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif}
body{background:#F5F5F5;max-width:480px;margin:0 auto;min-height:100vh;position:relative;overflow-x:hidden}

/* ANIMATED HERO */
.hero{background:linear-gradient(135deg,#1B5E20,#2E7D32,#4caf50);padding:30px 20px;text-align:center;color:white;animation:heroGlow 3s ease-in-out infinite;position:relative;overflow:hidden}
@keyframes heroGlow{0%,100%{box-shadow:0 0 20px rgba(76,175,80,0.3)}50%{box-shadow:0 0 40px rgba(76,175,80,0.6)}}
.hero::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle,rgba(255,255,255,0.1) 0%,transparent 60%);animation:rotate 10s linear infinite}
@keyframes rotate{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.hero h1{font-size:24px;font-weight:800;position:relative;z-index:1;animation:slideDown 0.8s ease}
@keyframes slideDown{from{opacity:0;transform:translateY(-30px)}to{opacity:1;transform:translateY(0)}}
.hero p{font-size:12px;margin:8px 0;position:relative;z-index:1;animation:slideUp 0.8s ease 0.2s both}
@keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.hero .stats-hero{display:flex;gap:15px;justify-content:center;margin-top:15px;position:relative;z-index:1}
.hero .stat-item{text-align:center;animation:pop 0.5s ease 0.5s both}
@keyframes pop{0%{transform:scale(0)}80%{transform:scale(1.1)}100%{transform:scale(1)}}
.hero .stat-num{font-size:32px;font-weight:900}
.hero .stat-label{font-size:10px;opacity:0.9}

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";
import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, doc, getDoc, setDoc, increment, getCount } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";
import { getStorage, ref as storageRef, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyB553_waOZcKoyvIdF7NsIH7EpjjbUeP68",
  authDomain: "campuconnect-bd52f.firebaseapp.com",
  projectId: "campuconnect-bd52f",
  storageBucket: "campuconnect-bd52f.firebasestorage.app",
  messagingSenderId: "762013163609",
  appId: "1:762013163609:web:7f565fbde05a4ad35ed148"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);

window.auth = auth; window.db = db; window.storage = storage;
window.signOut = signOut; window.onAuthStateChanged = onAuthStateChanged;
window.collection = collection; window.addDoc = addDoc;
window.query = query; window.orderBy = orderBy; window.onSnapshot = onSnapshot;
window.doc = doc; window.getDoc = getDoc; window.setDoc = setDoc;
window.storageRef = storageRef; window.uploadBytesResumable = uploadBytesResumable;
window.getDownloadURL = getDownloadURL; window.increment = increment;

let currentLightboxURL = '';

// VISITOR COUNTER
async function updateVisitorCount() {
  try {
    var counterRef = doc(db, 'stats', 'visitors');
    var counterDoc = await getDoc(counterRef);
    if (!counterDoc.exists()) {
      await setDoc(counterRef, { count: 1 });
      document.getElementById('visitorCount').innerHTML = '👁️ Visitors: 1';
    } else {
      await setDoc(counterRef, { count: counterDoc.data().count + 1 }, { merge: true });
      document.getElementById('visitorCount').innerHTML = '👁️ Visitors: ' + (counterDoc.data().count + 1);
    }
  } catch(e) {
    document.getElementById('visitorCount').innerHTML = '👁️ Visitors: --';
  }
}
updateVisitorCount();

// AUTH STATE
onAuthStateChanged(auth, async function(user) {
  if (user) {
    window.currentUser = user;
    try {
      const userDoc = await getDoc(doc(db, 'users', user.uid));
      if (userDoc.exists()) {
        window.userProfile = userDoc.data();
        document.getElementById('userDisplay').innerHTML = '👤 ' + (window.userProfile.username || user.email);
      } else {
        document.getElementById('userDisplay').innerHTML = '👤 ' + user.email;
      }
    } catch(e) {
      document.getElementById('userDisplay').innerHTML = '👤 ' + user.email;
    }
  } else {
    window.currentUser = null; window.userProfile = null;
  }
});

window.logout = function() { signOut(auth); };

// UPLOAD FUNCTIONS
window.uploadImageToChat = function() { document.getElementById('imageFileInput').click(); };
window.uploadVideoToChat = function() { document.getElementById('videoFileInput').click(); };

window.handleImageUpload = async function(event) {
  var file = event.target.files[0];
  if (!file) return;
  if (!window.currentUser) { alert('Please login first!'); return; }
  try {
    var sRef = storageRef(storage, 'chat/' + Date.now() + '_' + file.name);
    var uploadTask = uploadBytesResumable(sRef, file);
    uploadTask.on('state_changed', null, function(err){ alert('Upload failed'); }, async function() {
      var url = await getDownloadURL(uploadTask.snapshot.ref);
      var name = (window.userProfile && window.userProfile.username) ? window.userProfile.username : window.currentUser.email;
      await addDoc(collection(db, 'messages'), {
        sender: name, senderId: window.currentUser.uid,
        text: '📷 Sent an image',
        time: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}),
        createdAt: new Date(), imageUrl: url, videoUrl: null
      });
    });
  } catch(err) { alert('Upload failed: ' + err.message); }
  event.target.value = '';
};

window.handleVideoUpload = async function(event) {
  var file = event.target.files[0];
  if (!file) return;
  if (!window.currentUser) { alert('Please login first!'); return; }
  try {
    var sRef = storageRef(storage, 'chat/' + Date.now() + '_' + file.name);
    var uploadTask = uploadBytesResumable(sRef, file);
    uploadTask.on('state_changed', null, function(err){ alert('Upload failed'); }, async function() {
      var url = await getDownloadURL(uploadTask.snapshot.ref);
      var name = (window.userProfile && window.userProfile.username) ? window.userProfile.username : window.currentUser.email;
      await addDoc(collection(db, 'messages'), {
        sender: name, senderId: window.currentUser.uid,
        text: '🎥 Sent a video',
        time: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}),
        createdAt: new Date(), imageUrl: null, videoUrl: url
      });
    });
  } catch(err) { alert('Upload failed: ' + err.message); }
  event.target.value = '';
};

// LIGHTBOX
window.openLightboxFull = function(url, type) {
  currentLightboxURL = url;
  var box = document.getElementById('lightboxFull');
  var content = document.getElementById('lightboxContent');
  if (type === 'image') content.innerHTML = '<img src="' + url + '">';
  else content.innerHTML = '<iframe src="' + url + '" allowfullscreen></iframe>';
  box.classList.add('active');
};

window.closeLightboxFull = function() {
  document.getElementById('lightboxFull').classList.remove('active');
  currentLightboxURL = '';
};

window.downloadMedia = function() {
  if (currentLightboxURL) window.open(currentLightboxURL, '_blank');
};

window.toggleDark = function() {
  document.body.classList.toggle('dark');
  var btn = document.querySelector('.dark-toggle');
  btn.innerHTML = document.body.classList.contains('dark') ? '☀️' : '🌙';
};
</script>

function getVidEmb(u){if(!u||u.length<5)return'';u=u.trim();if(u.indexOf('youtube.com')>=0||u.indexOf('youtu.be')>=0){var v='';if(u.indexOf('youtu.be')>=0)v=u.split('/').pop().split('?')[0];else{v=u.split('v=')[1];if(v&&v.indexOf('&')>=0)v=v.split('&')[0];}if(v)return'<iframe src="https://www.youtube.com/embed/'+v+'" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen style="width:100%;border-radius:8px;height:220px;"></iframe>';}if(u.indexOf('vimeo.com')>=0){var vi=u.split('/').pop().split('?')[0];if(vi)return'<iframe src="https://player.vimeo.com/video/'+vi+'" frameborder="0" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen style="width:100%;border-radius:8px;height:220px;"></iframe>';}return'<video controls playsinline src="'+u+'" style="width:100%;border-radius:8px;max-height:250px;cursor:pointer" onclick="openLightboxFull(\''+u+'\',\'video\')"></video>';}

// SMART SEARCH
function smartSearch(q){
  q = q.toLowerCase().trim();
  if(!q) return;
  var results = [];
  courses.forEach(function(c,i){
    if(c.toLowerCase().indexOf(q)>=0) results.push({type:'Course',name:c,action:'showSyl('+i+')'});
    topics[i].forEach(function(t,k){
      if(t.toLowerCase().indexOf(q)>=0) results.push({type:'Topic',name:t+' ('+c+')',action:'showLec('+i+','+k+')'});
    });
  });
  lecturers.forEach(function(l){
    if(l.name.toLowerCase().indexOf(q)>=0 || l.course.toLowerCase().indexOf(q)>=0) results.push({type:'Lecturer',name:l.name+' - '+l.course,action:''});
  });
  return results;
}

function searchApp(q){
  q=q.toLowerCase().trim();
  var c=document.getElementById("content");
  if(q===""){showPage("home");return}
  var results = smartSearch(q);
  var h='<div class="card"><b>🔍 Search: '+q+'</b></div>';
  if(results.length===0){h+='<div class="card"><p>No results found.</p></div>';c.innerHTML=h;return}
  results.forEach(function(r){
    if(r.action){
      h+='<button class="btn btn-white" onclick="'+r.action+'">'+r.type+': '+r.name+'</button>';
    } else {
      h+='<div class="card"><p>'+r.type+': '+r.name+'</p></div>';
    }
  });

}

function loadNews(cb){
  var allNews = [];
  var fetched = 0;
  fetch("https://docs.google.com/spreadsheets/d/"+SID+"/gviz/tq?tqx=out:csv&sheet=Sheet1&v="+Date.now())
  .then(function(r){return r.text()})
  .then(function(csv){
    var ls=csv.split('\n');
    for(var i=1;i<ls.length;i++){
      if(ls[i].trim()==='')continue;
      var co=ls[i].split(',');
      if(co.length>=6) allNews.push({t:co[0].replace(/"/g,'').trim(),d:co[1].replace(/"/g,'').trim(),b:co[2].replace(/"/g,'').trim(),img:co[3].replace(/"/g,'').trim(),vid:co[4].replace(/"/g,'').trim(),cat:co[5].replace(/"/g,'').trim(),source:'sheets'});
    }
    fetched++;
    if(fetched >= 2) finishNews();
  }).catch(function(){ fetched++; if(fetched >= 2) finishNews(); });
  
  fetch("https://firestore.googleapis.com/v1/projects/campuconnect-bd52f/databases/(default)/documents/news")
  .then(function(r){return r.json()})
  .then(function(data){
    if(data.documents){
      data.documents.forEach(function(doc){
        var f = doc.fields;
        allNews.push({
          t: f.title ? f.title.stringValue : '',
          d: f.date ? f.date.stringValue : '',
          b: f.content ? f.content.stringValue : '',
          img: f.imageUrl ? f.imageUrl.stringValue : '',
          vid: f.videoUrl ? f.videoUrl.stringValue : '',
          cat: f.category ? f.category.stringValue : '',
          source: 'firestore'
        });
      });
    }
    fetched++;
    if(fetched >= 2) finishNews();
  }).catch(function(){ fetched++; if(fetched >= 2) finishNews(); });
  
  function finishNews(){
    allNews.sort(function(a,b){ return new Date(b.d) - new Date(a.d); });
    cb(allNews);
  }
}

function showNews(id){
  var el=document.getElementById(id);if(!el)return;
  el.innerHTML='Loading...';
  loadNews(function(a){
    if(a.length===0){el.innerHTML='<div class="card"><p style="text-align:center;color:#9E9E9E;">No announcements yet.</p></div>';return}
    var h='';
    a.forEach(function(x){
      h+='<div class="news-card">';
      if(x.cat)h+='<span class="news-card-category">'+x.cat+'</span>';
      h+='<div class="news-card-title">'+x.t+'</div>';
      h+='<div class="news-card-date">📅 '+x.d+'</div>';
      if(x.b)h+='<div class="news-card-body">'+x.b+'</div>';
      if(x.img&&x.img.length>5)h+='<img src="'+x.img+'" onerror="this.style.display=\'none\'" style="width:100%;height:auto;max-height:none;object-fit:contain;cursor:pointer" onclick="openLightboxFull(\''+x.img+'\',\'image\')">';
      if(x.vid&&x.vid.length>5)h+=getVidEmb(x.vid);
      h+='</div>';
    });
    el.innerHTML=h;
  });
}
