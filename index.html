// ── CSV PARSER ──
function parseCSVLine(line){
  var result=[],current='',inQuotes=false;
  for(var i=0;i<line.length;i++){
    var ch=line[i];
    if(ch==='"'){inQuotes=!inQuotes;}
    else if(ch===','&&!inQuotes){result.push(current.trim());current='';}
    else{current+=ch;}
  }
  result.push(current.trim());
  return result;
}

// ── CLEAN IMAGE URL (fix Google Sheets image links) ──
function cleanImageUrl(url) {
  if (!url) return '';
  url = url.trim();
  // Remove surrounding quotes if any
  url = url.replace(/^["']|["']$/g, '');
  if (url.length < 8) return '';
  // Fix Google Drive links
  if (url.includes('drive.google.com/file/d/')) {
    var id = url.split('/d/')[1].split('/')[0];
    return 'https://drive.google.com/uc?export=view&id=' + id;
  }
  // Fix Google Drive open links
  if (url.includes('drive.google.com/open?id=')) {
    var id = url.split('id=')[1].split('&')[0];
    return 'https://drive.google.com/uc?export=view&id=' + id;
  }
  return url;
}

// ── GET YOUTUBE ID ──
function getYouTubeID(url){
  if(!url)return'';
  if(url.includes('youtu.be'))return url.split('/').pop().split('?')[0];
  return(url.split('v=')[1]||'').split('&')[0];
}

// ── MEDIA EMBED ──
function getMediaEmbed(url){
  if(!url||url.trim().length<8)return'';
  url=url.trim();
  var u=url.toLowerCase();
  if(u.includes('youtube.com')||u.includes('youtu.be')){
    var v=getYouTubeID(url);
    return v?'<iframe class="news-iframe" src="https://www.youtube.com/embed/'+v+'" loading="lazy" allowfullscreen></iframe>':'';
  }
  if(u.match(/\.(mp4|webm|ogg|mov)(\?|$)/))return'<video class="news-video" controls src="'+url+'" preload="none"></video>';
  if(u.match(/\.(mp3|wav|m4a)(\?|$)/))return'<audio controls src="'+url+'" style="width:100%;margin:6px 0"></audio>';
  if(u.includes('drive.google.com')){
    var cleaned=cleanImageUrl(url);
    return'<img class="news-img" src="'+cleaned+'" loading="lazy" onclick="openLightboxFull(\''+cleaned.replace(/'/g,"\\'")+'\')">'; 
  }
  if(u.match(/\.(jpg|jpeg|png|gif|webp|bmp)(\?|$)/)||u.includes('imgur.com')||u.includes('i.imgur')){
    return'<img class="news-img" src="'+url+'" loading="lazy" onclick="openLightboxFull(\''+url.replace(/'/g,"\\'")+'\')">'; 
  }
  return'<a href="'+url+'" target="_blank" style="color:#4caf50;font-size:12px">🔗 Open Link</a>';
}

// ══════════════════════════════════════
// NEWS LOADER - Firestore + Google Sheets
// Newest first, all images shown
// ══════════════════════════════════════
var newsUnsubscribe=null;

function loadNews(containerId){
  var el=document.getElementById(containerId);if(!el)return;
  el.innerHTML='<div class="skeleton" style="height:80px"></div><div class="skeleton" style="height:80px"></div>';

  var allNews=[];
  var sheetsDone=false;

  // Firestore - real time, newest first
  if(newsUnsubscribe){try{newsUnsubscribe();}catch(e){}}
  var q=window._query(window._collection(window._db,'news'),window._orderBy('createdAt','desc'),window._limit(50));
  newsUnsubscribe=window._onSnapshot(q,function(snapshot){
    var firestoreNews=[];
    snapshot.forEach(function(d){
      var f=d.data();
      firestoreNews.push({
        t:f.title||'',author:f.author||'Admin',
        d:f.date||'',b:f.content||'',
        img:f.imageUrl||'',vid:f.videoUrl||'',
        cat:f.category||'',source:'firestore',
        createdAt:f.createdAt?new Date(f.createdAt.seconds*1000):new Date()
      });
    });
    // Merge: firestore items + sheets items, newest first
    var sheetsNews=allNews.filter(function(n){return n.source==='sheets';});
    allNews=firestoreNews.concat(sheetsNews);
    allNews.sort(function(a,b){return b.createdAt-a.createdAt;});
    renderNews(el,allNews);
  },function(){});

  // Google Sheets
  fetch("https://docs.google.com/spreadsheets/d/"+SID+"/gviz/tq?tqx=out:csv&sheet=Sheet1&v="+Date.now())
    .then(function(r){return r.text();})
    .then(function(csv){
      var lines=csv.split('\n');
      var sheetsItems=[];
      for(var i=1;i<lines.length;i++){
        if(!lines[i].trim())continue;
        var co=parseCSVLine(lines[i]);
        if(co.length>=3&&co[0]){
          sheetsItems.push({
            t:co[0]||'',author:co[6]||'Admin',
            d:co[1]||'',b:co[2]||'',
            img:co[3]||'',vid:co[4]||'',
            cat:co[5]||'',source:'sheets',
            createdAt:co[1]?new Date(co[1]):new Date(0)
          });
        }
      }
      var firestoreNews=allNews.filter(function(n){return n.source==='firestore';});
      allNews=firestoreNews.concat(sheetsItems);
      allNews.sort(function(a,b){return b.createdAt-a.createdAt;});
      renderNews(el,allNews);
    }).catch(function(){});
}

function renderNews(el,news){
  if(!el)return;
  if(!news||news.length===0){el.innerHTML='<div class="empty-msg">📭 No announcements yet.</div>';return;}
  var h='';
  news.forEach(function(x){
    if(!x.t)return;
    h+='<div class="news-card">';
    if(x.cat)h+='<span class="news-cat">'+x.cat+'</span>';
    h+='<div class="news-title">'+x.t+'</div>';
    h+='<div class="news-meta">✍️ '+(x.author||'Admin')+(x.d?' · 📅 '+x.d:'')+'</div>';
    if(x.b)h+='<div class="news-body">'+x.b+'</div>';
    // Show image - clean URL first
    if(x.img&&x.img.trim().length>5){
      var cleanImg=cleanImageUrl(x.img);
      if(cleanImg)h+=getMediaEmbed(cleanImg);
    }
    // Show video
    if(x.vid&&x.vid.trim().length>5)h+=getMediaEmbed(x.vid);
    h+='</div>';
  });
  el.innerHTML=h||'<div class="empty-msg">📭 No announcements yet.</div>';
}

// DOCS
async function loadDocs(containerId){
  var el=document.getElementById(containerId);if(!el)return;
  el.innerHTML='<div class="skeleton" style="height:60px"></div><div class="skeleton" style="height:60px"></div>';
  try{
    var q=window._query(window._collection(window._db,'documents'),window._orderBy('createdAt','desc'),window._limit(20));
    var snap=await window._getDocs(q);
    if(snap.empty){el.innerHTML='<div class="empty-msg">📭 No documents uploaded yet.</div>';return;}
    var h='';
    snap.forEach(function(d){
      var data=d.data();
      var ext=(data.fileName||'').split('.').pop().toLowerCase();
      var icon=ext==='pdf'?'📕':['doc','docx'].includes(ext)?'📘':['ppt','pptx'].includes(ext)?'📙':'📄';
      var viewUrl=toViewUrl(data.fileUrl||'');
      var dlUrl=toDlUrl(data.originalUrl||data.fileUrl||'');
      h+='<div class="doc-item"><div class="doc-icon-el">'+icon+'</div><div class="doc-info"><div class="doc-title-el">'+(data.title||'Document')+'</div><div class="doc-meta-el">📂 '+(data.category||'Other')+' · ✍️ '+(data.author||'Admin')+'</div><div class="doc-acts"><button class="doc-btn btn-view" onclick="window.open(\''+viewUrl.replace(/'/g,"\\'")+'\',\'_blank\')">👁️ Open</button><button class="doc-btn btn-dl" onclick="window.open(\''+dlUrl.replace(/'/g,"\\'")+'\',\'_blank\')">📥 Download</button></div></div></div>';
    });
    el.innerHTML=h;
  }catch(e){el.innerHTML='<div class="empty-msg">❌ Could not load documents.</div>';}
}

function toViewUrl(url){
  if(!url)return'';
  if(url.includes('/preview'))return url;
  if(url.includes('drive.google.com/file/d/')){var id=url.split('/d/')[1].split('/')[0];return'https://drive.google.com/file/d/'+id+'/preview';}
  return'https://docs.google.com/viewer?url='+encodeURIComponent(url)+'&embedded=true';
}
function toDlUrl(url){
  if(!url)return'';
  if(url.includes('drive.google.com/file/d/')){var id=url.split('/d/')[1].split('/')[0];return'https://drive.google.com/uc?export=download&id='+id;}
  return url;
}

// LEADERBOARD
async function loadLeaderboard(containerId){
  var el=document.getElementById(containerId);if(!el)return;
  el.innerHTML='<div class="skeleton" style="height:50px"></div><div class="skeleton" style="height:50px"></div>';
  try{
    var snap=await window._getDocs(window._collection(window._db,'results'));
    var students={};
    snap.forEach(function(d){var data=d.data();var reg=data.regNo||'';if(!reg)return;if(!students[reg])students[reg]={name:data.name||reg,regNo:reg,total:0,count:0};if(data.gpa){students[reg].total+=data.gpa;students[reg].count++;}});
    var list=Object.values(students).map(function(s){s.avgGPA=s.count>0?(s.total/s.count).toFixed(2):'0.00';return s;}).sort(function(a,b){return parseFloat(b.avgGPA)-parseFloat(a.avgGPA);}).slice(0,10);
    if(list.length===0){el.innerHTML='<div class="empty-msg">📭 No results published yet.</div>';return;}
    var h='';
    list.forEach(function(s,i){var rc=i===0?'r1':i===1?'r2':i===2?'r3':'ro';h+='<div class="rank-item"><div class="rank-num '+rc+'">'+(i+1)+'</div><div class="rank-info"><div class="rank-name">'+s.name+'</div><div class="rank-reg">'+s.regNo+'</div></div><div class="rank-gpa">'+s.avgGPA+'</div></div>';});
    el.innerHTML=h;
  }catch(e){el.innerHTML='<div class="empty-msg">❌ Could not load leaderboard.</div>';}
}

// RESULT CHECKER
window.checkResult=async function(){
  var reg=document.getElementById('resultRegInput').value.trim();
  var sem=document.getElementById('resultSemInput').value;
  var el=document.getElementById('resultOutput');
  if(!reg||!sem){el.innerHTML='<div class="empty-msg" style="color:#f44336">⚠️ Fill both fields.</div>';return;}
  el.innerHTML='<div class="skeleton" style="height:100px"></div>';
  try{
    var docId=reg.replace(/\//g,'_')+'_'+sem;
    var snap=await window._getDoc(window._doc(window._db,'results',docId));
    if(!snap.exists()){el.innerHTML='<div class="empty-msg" style="color:#f44336">❌ No result found for <b>'+reg+'</b> — '+sem+' Semester.</div>';return;}
    var data=snap.data();var cs=data.courses||[];var total=0;
    var rows='';
    cs.forEach(function(c){var g=(c.grade||'').toUpperCase();var gc=g==='A'?'color:#4caf50':g==='B'?'color:#8bc34a':g==='C'?'color:#ff9800':'color:#f44336';rows+='<tr><td style="padding:8px;border-bottom:1px solid #30363d">'+c.course+'</td><td style="padding:8px;border-bottom:1px solid #30363d;'+gc+';font-weight:bold">'+g+'</td><td style="padding:8px;border-bottom:1px solid #30363d;text-align:center">'+c.point+'</td></tr>';total+=Number(c.point)||0;});
    var gpa=cs.length>0?(total/cs.length).toFixed(2):'0.00';
    var standing=parseFloat(gpa)>=3.5?'🏆 Distinction':parseFloat(gpa)>=3.0?'⭐ Upper Credit':parseFloat(gpa)>=2.0?'✅ Lower Credit':'⚠️ Pass';
    el.innerHTML='<div class="card" style="margin-top:8px"><div style="text-align:center;margin-bottom:10px"><b style="font-size:16px">'+data.name+'</b><br><span style="font-size:11px;color:#999">'+sem+' Semester · '+standing+'</span></div><table style="width:100%;border-collapse:collapse"><tr style="background:#0d4a1a"><th style="padding:8px;font-size:11px;text-align:left">Course</th><th style="padding:8px;font-size:11px">Grade</th><th style="padding:8px;font-size:11px">Points</th></tr>'+rows+'<tr style="background:#1a3a2a"><td colspan="2" style="padding:10px;font-weight:bold;color:#ffd700">📊 GPA</td><td style="padding:10px;font-weight:bold;color:#ffd700;text-align:center">'+gpa+'</td></tr></table></div>';
  }catch(e){el.innerHTML='<div class="empty-msg" style="color:#f44336">❌ Error. Check connection.</div>';}
};
