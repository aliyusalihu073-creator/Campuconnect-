<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";
import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";
import { getStorage, ref as storageRef, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyB553_waOZcKoyvIdF7NsIH7EpjjbUeP68",
  authDomain: "campuconnect-bd52f.firebaseapp.com",
  projectId: "campuconnect-bd52f",
  storageBucket: "campuconnect-bd52f.firebasestorage.app",
  messagingSenderId: "762013163609",
  appId: "1:762013163609:web:7f565fbde05a4ad35ed148"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);

window.auth = auth; window.db = db; window.storage = storage;
window.signOut = signOut; window.onAuthStateChanged = onAuthStateChanged;
window.collection = collection; window.addDoc = addDoc;
window.query = query; window.orderBy = orderBy; window.onSnapshot = onSnapshot;
window.doc = doc; window.getDoc = getDoc; window.setDoc = setDoc;
window.storageRef = storageRef; window.uploadBytesResumable = uploadBytesResumable;
window.getDownloadURL = getDownloadURL;

let currentLightboxURL = '';

// TOAST
function showToast(msg) {
  var t = document.createElement('div'); t.className = 'toast'; t.innerHTML = msg;
  document.body.appendChild(t); setTimeout(function(){ t.remove(); }, 3000);
}

// PUSH NOTIFICATION
function requestNotification() {
  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission();
  }
}

function sendPush(title, body) {
  if ('Notification' in window && Notification.permission === 'granted') {
    new Notification(title, { body: body, icon: 'https://i.imgur.com/DFc04md.jpeg' });
  }
}

// AUTO LOGIN
onAuthStateChanged(auth, async function(user) {
  if (!user) { window.location.href = 'login.html'; return; }
  window.currentUser = user;
  document.getElementById('mainApp').classList.remove('hidden');
  requestNotification();
  try {
    const uDoc = await getDoc(doc(db, 'users', user.uid));
    if (uDoc.exists()) {
      window.userProfile = uDoc.data();
      document.getElementById('userDisplay').innerHTML = '👤 ' + (window.userProfile.username || user.email);
    } else {
      document.getElementById('userDisplay').innerHTML = '👤 ' + user.email;
    }
  } catch(e) {
    document.getElementById('userDisplay').innerHTML = '👤 ' + user.email;
  }
  if (typeof showPage === 'function') showPage('home');
});

// VISITOR COUNTER
(async function() {
  try {
    var ref = doc(db, 'stats', 'visitors');
    var snap = await getDoc(ref);
    if (!snap.exists()) { await setDoc(ref, { count: 1 }); document.getElementById('visitorCount').innerHTML = '👁️ 1'; }
    else { await setDoc(ref, { count: snap.data().count + 1 }, { merge: true }); document.getElementById('visitorCount').innerHTML = '👁️ ' + (snap.data().count + 1); }
  } catch(e) {}
})();

window.logout = function() { signOut(auth).then(function(){ window.location.href = 'login.html'; }); };

// UPLOAD HANDLERS
window.handleImageUpload = async function(event) {
  var file = event.target.files[0]; if (!file || !window.currentUser) return;
  try {
    var sRef = storageRef(storage, 'chat/' + Date.now() + '_' + file.name);
    var task = uploadBytesResumable(sRef, file);
    task.on('state_changed', null, function(){}, async function() {
      var url = await getDownloadURL(task.snapshot.ref);
      var name = (window.userProfile && window.userProfile.username) ? window.userProfile.username : window.currentUser.email;
      await addDoc(collection(db, 'messages'), { sender: name, senderId: window.currentUser.uid, text: '📷 Image', time: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}), createdAt: new Date(), type: 'image', imageUrl: url });
      showToast('✅ Image sent!');
    });
  } catch(e) {}
  event.target.value = '';
};

window.handleVideoUpload = async function(event) {
  var file = event.target.files[0]; if (!file || !window.currentUser) return;
  try {
    var sRef = storageRef(storage, 'chat/' + Date.now() + '_' + file.name);
    var task = uploadBytesResumable(sRef, file);
    task.on('state_changed', null, function(){}, async function() {
      var url = await getDownloadURL(task.snapshot.ref);
      var name = (window.userProfile && window.userProfile.username) ? window.userProfile.username : window.currentUser.email;
      await addDoc(collection(db, 'messages'), { sender: name, senderId: window.currentUser.uid, text: '🎥 Video', time: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}), createdAt: new Date(), type: 'video', videoUrl: url });
      showToast('✅ Video sent!');
    });
  } catch(e) {}
  event.target.value = '';
};

// MEDIA DETECTION
function detectMediaType(url) {
  if (!url || url.length < 5) return 'none';
  url = url.trim().toLowerCase();
  if (url.match(/\.(jpg|jpeg|png|gif|webp|bmp|svg)/)) return 'image';
  if (url.match(/\.(mp4|webm|ogg|mov|avi|mkv|3gp)/)) return 'video';
  if (url.match(/\.(mp3|wav|m4a|flac)/)) return 'audio';
  if (url.indexOf('youtube.com') >= 0 || url.indexOf('youtu.be') >= 0) return 'youtube';
  if (url.indexOf('vimeo.com') >= 0) return 'vimeo';
  if (url.indexOf('tiktok.com') >= 0) return 'tiktok';
  if (url.indexOf('facebook.com') >= 0 || url.indexOf('fb.com') >= 0) return 'facebook';
  if (url.indexOf('imgur.com') >= 0) return 'image';
  return 'link';
}

function getMediaEmbed(url) {
  var type = detectMediaType(url);
  if (type === 'youtube') { var v = url.indexOf('youtu.be') >= 0 ? url.split('/').pop().split('?')[0] : (url.split('v=')[1] || '').split('&')[0]; if (v) return '<iframe src="https://www.youtube.com/embed/' + v + '" allowfullscreen style="width:100%;border-radius:8px;height:220px;"></iframe>'; }
  if (type === 'vimeo') { var vi = url.split('/').pop().split('?')[0]; if (vi) return '<iframe src="https://player.vimeo.com/video/' + vi + '" allowfullscreen style="width:100%;border-radius:8px;height:220px;"></iframe>'; }
  if (type === 'video') return '<video controls src="' + url + '" style="width:100%;border-radius:8px;max-height:250px;"></video>';
  if (type === 'image') return '<img src="' + url + '" style="width:100%;border-radius:8px;cursor:pointer" onclick="openLightboxFull(\'' + url + '\',\'image\')">';
  if (type === 'audio') return '<audio controls src="' + url + '" style="width:100%;"></audio>';
  return '<a href="' + url + '" target="_blank" style="color:#4caf50;">🔗 Open Link</a>';
}

// LIGHTBOX
window.openLightboxFull = function(url, type) {
  currentLightboxURL = url;
  var box = document.getElementById('lightboxFull');
  var content = document.getElementById('lightboxContent');
  box.style.display = 'flex';
  content.innerHTML = type === 'image' ? '<img src="' + url + '" style="max-width:100%;max-height:80vh;border-radius:8px;">' : '<iframe src="' + url + '" allowfullscreen style="width:100%;height:70vh;border-radius:8px;"></iframe>';
};
window.closeLightboxFull = function() { document.getElementById('lightboxFull').style.display = 'none'; };
window.downloadMedia = function() { if (currentLightboxURL) window.open(currentLightboxURL, '_blank'); };
window.toggleDark = function() { document.body.style.background = document.body.style.background === 'rgb(13,17,23)' ? '#F5F5F5' : '#0d1117'; };
</script>

// CACHE NEWS FOR FAST LOADING
var cachedNews = null;
function loadNews(cb){
  if (cachedNews) { cb(cachedNews); refreshNews(); return; }
  refreshNews();
  function refreshNews() {
    var allNews = []; var fetched = 0;
    fetch("https://docs.google.com/spreadsheets/d/"+SID+"/gviz/tq?tqx=out:csv&sheet=Sheet1&v="+Date.now())
    .then(function(r){return r.text()}).then(function(csv){
      var ls=csv.split('\n');
      for(var i=1;i<ls.length;i++){if(ls[i].trim()==='')continue;var co=ls[i].split(',');if(co.length>=6)allNews.push({t:co[0].replace(/"/g,'').trim(),author:'Sheets',d:co[1].replace(/"/g,'').trim(),b:co[2].replace(/"/g,'').trim(),img:co[3].replace(/"/g,'').trim(),vid:co[4].replace(/"/g,'').trim(),cat:co[5].replace(/"/g,'').trim(),createdAt:new Date(co[1])});}
      fetched++; if(fetched>=2)finish();
    }).catch(function(){fetched++;if(fetched>=2)finish();});
    fetch("https://firestore.googleapis.com/v1/projects/campuconnect-bd52f/databases/(default)/documents/news")
    .then(function(r){return r.json()}).then(function(data){
      if(data.documents){data.documents.forEach(function(doc){var f=doc.fields;allNews.push({t:f.title?f.title.stringValue:'',author:f.author?f.author.stringValue:'Admin',d:f.date?f.date.stringValue:'',b:f.content?f.content.stringValue:'',img:f.imageUrl?f.imageUrl.stringValue:'',vid:f.videoUrl?f.videoUrl.stringValue:'',cat:f.category?f.category.stringValue:'',createdAt:f.createdAt?new Date(f.createdAt.timestampValue):new Date()});});}
      fetched++; if(fetched>=2)finish();
    }).catch(function(){fetched++;if(fetched>=2)finish();});
    function finish(){allNews.sort(function(a,b){return b.createdAt-a.createdAt;});cachedNews=allNews;cb(allNews);}
  }
}

function showNews(id){
  var el=document.getElementById(id);if(!el)return;
  // Show cached instantly
  if(cachedNews){renderNews(cachedNews);}else{el.innerHTML='<div class="loading-skeleton"></div><div class="loading-skeleton"></div><div class="loading-skeleton"></div>';}
  loadNews(function(a){renderNews(a);});
  function renderNews(a){
    if(a.length===0){el.innerHTML='<div class="card"><p style="text-align:center;color:#999;">No announcements yet.</p></div>';return}
    var h='';a.forEach(function(x){
      h+='<div class="news-card">';
      if(x.cat)h+='<span class="news-card-category">'+x.cat+'</span>';
      h+='<div class="news-card-title">'+x.t+'</div>';
      if(x.author)h+='<div class="news-card-author">✍️ '+x.author+'</div>';
      h+='<div class="news-card-date">📅 '+x.d+'</div>';
      if(x.b)h+='<div class="news-card-body">'+x.b+'</div>';
      if(x.img&&x.img.length>5)h+=getMediaEmbed(x.img);
      if(x.vid&&x.vid.length>5)h+=getMediaEmbed(x.vid);
      h+='</div>';
    });
    el.innerHTML=h;
  }
}

function searchApp(q){q=q.toLowerCase().trim();var c=document.getElementById("content");if(q===""){showPage("home");return}var h='<div class="card"><b>Search: '+q+'</b></div>';var f=false;courses.forEach(function(cn,i){if(cn.toLowerCase().indexOf(q)>=0){h+='<button class="btn btn-white" onclick="showSyl('+i+')">'+cn+'</button>';f=true}topics[i].forEach(function(t,k){if(t.toLowerCase().indexOf(q)>=0){h+='<button class="btn btn-light" onclick="showLec('+i+','+k+')">'+t+'</button>';f=true}})});lecturers.forEach(function(l){if(l.name.toLowerCase().indexOf(q)>=0||l.course.toLowerCase().indexOf(q)>=0){h+='<div class="card"><p>👨‍🏫 '+l.name+' - '+l.course+'</p></div>';f=true}});if(!f)h+='<div class="card"><p>No results.</p></div>';c.innerHTML=h;}
function hlNav(id){document.querySelectorAll('.nav button').forEach(function(b){b.classList.remove('active')});var el=document.getElementById('nav-'+id);if(el)el.classList.add('active')}

function showPage(p,d){
