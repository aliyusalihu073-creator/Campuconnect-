.news-date{font-size:10px;color:#999;margin-bottom:6px}
.news-body{font-size:12px;color:#ccc;line-height:1.5}
.news-card img{width:100%;border-radius:8px;margin:6px 0;cursor:pointer}

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

let currentLightboxURL = '';

onAuthStateChanged(auth, async function(user) {
  if (!user) { window.location.href = 'login.html'; return; }
  window.currentUser = user;
  document.getElementById('mainApp').classList.remove('hidden');
  try {
    var uDoc = await getDoc(doc(db, 'users', user.uid));
    if (uDoc.exists()) {
      document.getElementById('userDisplay').innerHTML = '👤 ' + (uDoc.data().username || user.email);
    } else {
      document.getElementById('userDisplay').innerHTML = '👤 ' + user.email;
    }
  } catch(e) {
    document.getElementById('userDisplay').innerHTML = '👤 ' + user.email;
  }
  showPage('home');
});

window.logout = function() { signOut(auth).then(function(){ window.location.href = 'login.html'; }); };

window.openLightbox = function(url) {
  currentLightboxURL = url;
  document.getElementById('lightboxContent').innerHTML = '<img src="' + url + '" style="max-width:100%;max-height:80vh;">';
  document.getElementById('lightbox').classList.add('active');
};
window.closeLightbox = function() { document.getElementById('lightbox').classList.remove('active'); };
window.downloadMedia = function() { if (currentLightboxURL) window.open(currentLightboxURL, '_blank'); };
</script>

function loadNews(cb) {
  var url = "https://docs.google.com/spreadsheets/d/" + SID + "/gviz/tq?tqx=out:csv&sheet=Sheet1";
  fetch(url)
  .then(function(r){ return r.text(); })
  .then(function(csv) {
    var lines = csv.split('\n');
    var articles = [];
    for (var i = 1; i < lines.length; i++) {
      if (lines[i].trim() === '') continue;
      var cols = lines[i].split(',');
      if (cols.length >= 6) {
        articles.push({
          title: cols[0].replace(/"/g, '').trim(),
          author: 'Sheets',
          date: cols[1].replace(/"/g, '').trim(),
          content: cols[2].replace(/"/g, '').trim(),
          image: cols[3].replace(/"/g, '').trim(),
          video: cols[4].replace(/"/g, '').trim(),
          category: cols[5].replace(/"/g, '').trim()
        });
      }
    }
    articles.reverse();
    cb(articles);
  })
  .catch(function() { cb([]); });
}

function showNews(id) {
  var el = document.getElementById(id);
  if (!el) return;
  el.innerHTML = '<div class="loading">Loading news...</div>';
  loadNews(function(articles) {
    if (articles.length === 0) {
      el.innerHTML = '<div class="card"><p style="text-align:center;color:#999;">No announcements yet.</p></div>';
      return;
    }
    var h = '';
    articles.forEach(function(a) {
      h += '<div class="news-card">';
      if (a.category) h += '<span style="background:#1a3a2a;color:#4caf50;padding:2px 8px;border-radius:10px;font-size:10px;">' + a.category + '</span>';
      h += '<div class="news-title">' + a.title + '</div>';
      h += '<div class="news-date">📅 ' + a.date + '</div>';
      if (a.content) h += '<div class="news-body">' + a.content + '</div>';
      if (a.image && a.image.length > 5) h += '<img src="' + a.image + '" onclick="openLightbox(\'' + a.image + '\')">';
      if (a.video && a.video.length > 5) {
        if (a.video.indexOf('youtube') >= 0 || a.video.indexOf('youtu.be') >= 0) {
          var vid = a.video.split('/').pop().split('?')[0];
          if (a.video.indexOf('youtu.be') >= 0) vid = a.video.split('/').pop().split('?')[0];
          else vid = (a.video.split('v=')[1] || '').split('&')[0];
          if (vid) h += '<iframe src="https://www.youtube.com/embed/' + vid + '" allowfullscreen></iframe>';
        } else {
          h += '<video controls src="' + a.video + '" style="width:100%;border-radius:8px;"></video>';
        }
      }
      h += '</div>';
    });
    el.innerHTML = h;
  });
}
