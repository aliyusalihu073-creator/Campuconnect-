le">📰 LATEST NEWS</div><div id="newsContainer">Loading...</div>';h+='<div class="home-section-title">💬 QUICK CHAT</div><div class="chat-box"><div class="chat-msgs" id="chatMsgs"></div><div class="chat-row"><input type="text" id="chatInp" placeholder="Type a message..."><button onclick="sendChat()">Send</button></div></div>';c.innerHTML=h;showNews('newsContainer');setTimeout(function(){showChat()},200);}
