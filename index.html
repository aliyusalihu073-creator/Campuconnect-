import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";
import { getFirestore, collection, addDoc, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB553_waOZcKoyvIdF7NsIH7EpjjbUeP68",
  authDomain: "campuconnect-bd52f.firebaseapp.com",
  projectId: "campuconnect-bd52f",
  storageBucket: "campuconnect-bd52f.firebasestorage.app",
  messagingSenderId: "762013163609",
  appId: "1:762013163609:web:7f565fbde05a4ad35ed148",
  measurementId: "G-QBR7V54P0F"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

window.auth = auth;
window.db = db;
window.createUserWithEmailAndPassword = createUserWithEmailAndPassword;
window.signInWithEmailAndPassword = signInWithEmailAndPassword;
window.onAuthStateChanged = onAuthStateChanged;
window.signOut = signOut;
window.collection = collection;
window.addDoc = addDoc;
window.query = query;
window.orderBy = orderBy;
window.onSnapshot = onSnapshot;

// Show login or main app
onAuthStateChanged(auth, function(user) {
  if (user) {
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('mainApp').classList.remove('hidden');
    document.getElementById('userEmail').innerHTML = '👤 ' + user.email;
    window.currentUser = user;
    if (typeof showPage === 'function') showPage('home');
  } else {
    document.getElementById('loginScreen').classList.remove('hidden');
    document.getElementById('mainApp').classList.add('hidden');
    window.currentUser = null;
  }
});

// Auth functions
window.showSignUp = function() {
  document.getElementById('signupBox').style.display = 'block';
};
window.showLogin = function() {
  document.getElementById('signupBox').style.display = 'none';
};

window.signUp = function() {
  var email = document.getElementById('signupEmail').value.trim();
  var pass = document.getElementById('signupPass').value.trim();
  if (!email || !pass) { alert('Fill all fields'); return; }
  createUserWithEmailAndPassword(auth, email, pass)
  .then(function() {
    document.getElementById('signupBox').style.display = 'none';
  })
  .catch(function(e) { alert(e.message); });
};

window.signIn = function() {
  var email = document.getElementById('loginEmail').value.trim();
  var pass = document.getElementById('loginPass').value.trim();
  if (!email || !pass) { alert('Fill all fields'); return; }
  signInWithEmailAndPassword(auth, email, pass)
  .catch(function(e) { alert(e.message); });
};

window.logout = function() {
  signOut(auth);
};

// Firestore Chat
window.sendFireChat = function() {
  if (!window.currentUser) { alert('Please login first!'); return; }
  var inp = document.getElementById('chatInp');
  var text = inp.value.trim();
  if (!text) return;
  addDoc(collection(db, 'messages'), {
    sender: window.currentUser.email,
    text: text,
    time: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}),
    createdAt: new Date()
  });
  inp.value = '';
};

window.loadFireChat = function() {
  var el = document.getElementById('chatMsgs');
  if (!el) return;
  var q = query(collection(db, 'messages'), orderBy('createdAt'));
  onSnapshot(q, function(snapshot) {
    var h = '';
    snapshot.forEach(function(doc) {
      var m = doc.data();
      var isMe = window.currentUser && m.sender === window.currentUser.email;
      h += '<div class="chat-msg ' + (isMe ? 'u' : 'o') + '">';
      h += '<div class="chat-s">' + m.sender + '</div>';
      h += '<div class="chat-t">' + m.text + '</div>';
      h += '<div class="chat-time">' + m.time + '</div></div>';
    });
    if (!h) h = '<p style="text-align:center;color:#9E9E9E">No messages yet.</p>';
    el.innerHTML = h;
    el.scrollTop = el.scrollHeight;
  });
};

window.firebaseReady = true;
</script>
