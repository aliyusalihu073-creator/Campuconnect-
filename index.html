/* ==================== SEARCH ==================== */

function searchApp(q) {
    q = q.toLowerCase().trim();
    const content = document.getElementById("content");

    if (q === "") {
        showPage("home");
        return;
    }

    let html = `<div class="card"><b>🔍 Search Results for "${q}"</b></div>`;
    let found = false;

    courseNames.forEach((course, i) => {
        let courseMatch = false;
        if (course.toLowerCase().includes(q)) {
            html += `<button class="btn btn-white" onclick="showSyllabus(${i})">📘 ${course}</button>`;
            courseMatch = true;
            found = true;
        }
        topics[i].forEach((topic, k) => {
            if (topic.toLowerCase().includes(q)) {
                if (!courseMatch) {
                    html += `<div class="card"><b>${course}</b></div>`;
                    courseMatch = true;
                }
                html += `<button class="btn btn-light" onclick="showLecture(${i},${k})">→ ${topic}</button>`;
                found = true;
            }
        });
    });

    if (!found) {
        html += `<div class="card"><p>No results found.</p></div>`;
    }

    content.innerHTML = html;
    document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
}

<script>

function toggleChat(){
    const box = document.getElementById("chatBox");
    box.style.display = (box.style.display === "flex") ? "none" : "flex";
}

/* SEND MESSAGE */
function sendMessage(){
    let input = document.getElementById("chatInput");
    let text = input.value.trim();
    if(text === "") return;

    addMessage(text, "user");
    input.value = "";

    setTimeout(() => autoReply(text), 800);
}

/* ENTER KEY */
function enterSend(e){
    if(e.key === "Enter"){
        sendMessage();
    }
}

/* ADD MESSAGE */
function addMessage(text, type){
    let body = document.getElementById("chatBody");

    let msg = document.createElement("div");
    msg.className = "msg " + type;

    let time = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});

    msg.innerHTML = text + `<div class="time">${time}</div>`;

    body.appendChild(msg);
    body.scrollTop = body.scrollHeight;
}

/* AUTO REPLY (SMART DEMO) */
function autoReply(text){
    let reply = "I understand 👍";

    text = text.toLowerCase();

    if(text.includes("course")){
        reply = "Go to 📚 Courses section to view all your subjects.";
    }
    else if(text.includes("timetable")){
        reply = "Check 🗓️ Timetable for your weekly schedule.";
    }
    else if(text.includes("exam")){
        reply = "Prepare using 📝 Past Questions and revise all topics.";
    }
    else if(text.includes("hello") || text.includes("hi")){
        reply = "Hello 👋 How can I help you today?";
    }
    else if(text.includes("lecturer")){
        reply = "Go to 📞 Lecturers section to contact them directly.";
    }

    addMessage(reply, "bot");
}

</script>
