import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";
import { getStorage, ref as storageRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyB553_waOZcKoyvIdF7NsIH7EpjjbUeP68",
  authDomain: "campuconnect-bd52f.firebaseapp.com",
  projectId: "campuconnect-bd52f",
  storageBucket: "campuconnect-bd52f.firebasestorage.app",
  messagingSenderId: "762013163609",
  appId: "1:762013163609:web:7f565fbde05a4ad35ed148",
  measurementId: "G-QBR7V54P0F"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);

window.auth = auth; window.db = db; window.storage = storage;
window.createUserWithEmailAndPassword = createUserWithEmailAndPassword;
window.signInWithEmailAndPassword = signInWithEmailAndPassword;
window.onAuthStateChanged = onAuthStateChanged; window.signOut = signOut;
window.collection = collection; window.addDoc = addDoc;
window.query = query; window.orderBy = orderBy; window.onSnapshot = onSnapshot;
window.doc = doc; window.setDoc = setDoc; window.getDoc = getDoc;
window.storageRef = storageRef; window.uploadBytes = uploadBytes; window.getDownloadURL = getDownloadURL;

let currentLightboxURL = '';

onAuthStateChanged(auth, async function(user) {
  if (user) {
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('mainApp').classList.remove('hidden');
    window.currentUser = user;
    try {
      const userDoc = await getDoc(doc(db, 'users', user.uid));
      if (userDoc.exists()) {
        window.userProfile = userDoc.data();
        document.getElementById('userDisplay').innerHTML = '👤 ' + (window.userProfile.username || user.email);
      } else {
        document.getElementById('userDisplay').innerHTML = '👤 ' + user.email;
      }
    } catch(e) {
      document.getElementById('userDisplay').innerHTML = '👤 ' + user.email;
    }
    if (typeof showPage === 'function') showPage('home');
  } else {
    document.getElementById('loginScreen').classList.remove('hidden');
    document.getElementById('mainApp').classList.add('hidden');
    window.currentUser = null; window.userProfile = null;
  }
});

window.showSignUp = function() { document.getElementById('signupBox').style.display = 'block'; };
window.showLogin = function() { document.getElementById('signupBox').style.display = 'none'; };

window.signUp = async function() {
  var u = document.getElementById('signupUsername').value.trim();
  var e = document.getElementById('signupEmail').value.trim();
  var p = document.getElementById('signupPhone').value.trim();
  var r = document.getElementById('signupRegNo').value.trim();
  var pw = document.getElementById('signupPass').value.trim();
  if (!u || !e || !p || !r || !pw) { alert('Please fill all fields'); return; }
  try {
    var cred = await createUserWithEmailAndPassword(auth, e, pw);
    await setDoc(doc(db, 'users', cred.user.uid), {
      username: u, email: e, phone: p, regNo: r, createdAt: new Date()
    });
    document.getElementById('signupBox').style.display = 'none';
    alert('Account created successfully!');
  } catch(err) { alert('Error: ' + err.message); }
};

window.signIn = async function() {
  var e = document.getElementById('loginEmail').value.trim();
  var pw = document.getElementById('loginPass').value.trim();
  if (!e || !pw) { alert('Please fill all fields'); return; }
  try { await signInWithEmailAndPassword(auth, e, pw); }
  catch(err) { alert('Login failed: ' + err.message); }
};

window.logout = function() { signOut(auth); };

window.uploadImageToChat = function() { document.getElementById('imageFileInput').click(); };
window.uploadVideoToChat = function() { document.getElementById('videoFileInput').click(); };

window.handleImageUpload = async function(event) {
  var file = event.target.files[0];
  if (!file) return;
  if (!window.currentUser) { alert('Please login first!'); return; }
  try {
    var sRef = storageRef(storage, 'chat/' + Date.now() + '_' + file.name);
    var snapshot = await uploadBytes(sRef, file);
    var url = await getDownloadURL(snapshot.ref);
    var name = (window.userProfile && window.userProfile.username) ? window.userProfile.username : window.currentUser.email;
    await addDoc(collection(db, 'messages'), {
      sender: name, senderId: window.currentUser.uid,
      text: '📷 Sent an image',
      time: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}),
      createdAt: new Date(),
      imageUrl: url, videoUrl: null
    });
  } catch(err) { alert('Upload failed: ' + err.message); }
  event.target.value = '';
};

window.handleVideoUpload = async function(event) {
  var file = event.target.files[0];
  if (!file) return;
  if (!window.currentUser) { alert('Please login first!'); return; }
  try {
    var sRef = storageRef(storage, 'chat/' + Date.now() + '_' + file.name);
    var snapshot = await uploadBytes(sRef, file);
    var url = await getDownloadURL(snapshot.ref);
    var name = (window.userProfile && window.userProfile.username) ? window.userProfile.username : window.currentUser.email;
    await addDoc(collection(db, 'messages'), {
      sender: name, senderId: window.currentUser.uid,
      text: '🎥 Sent a video',
      time: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}),
      createdAt: new Date(),
      imageUrl: null, videoUrl: url
    });
  } catch(err) { alert('Upload failed: ' + err.message); }
  event.target.value = '';
};

window.openLightboxFull = function(url, type) {
  currentLightboxURL = url;
  var box = document.getElementById('lightboxFull');
  var content = document.getElementById('lightboxContent');
  if (type === 'image') content.innerHTML = '<img src="' + url + '">';
  else content.innerHTML = '<iframe src="' + url + '" allowfullscreen></iframe>';
  box.classList.add('active');
};

window.closeLightboxFull = function() {
  document.getElementById('lightboxFull').classList.remove('active');
  currentLightboxURL = '';
};

window.downloadMedia = function() {
  if (currentLightboxURL) window.open(currentLightboxURL, '_blank');
};

window.toggleDark = function() {
  document.body.classList.toggle('dark');
  var btn = document.querySelector('.dark-toggle');
  btn.innerHTML = document.body.classList.contains('dark') ? '☀️' : '🌙';
};

window.firebaseReady = true;
</script>

function getVidEmb(u){if(!u||u.length<5)return'';u=u.trim();if(u.indexOf('youtube.com')>=0||u.indexOf('youtu.be')>=0){var v='';if(u.indexOf('youtu.be')>=0)v=u.split('/').pop().split('?')[0];else{v=u.split('v=')[1];if(v&&v.indexOf('&')>=0)v=v.split('&')[0];}if(v)return'<iframe src="https://www.youtube.com/embed/'+v+'" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen style="width:100%;border-radius:8px;height:220px;"></iframe>';}if(u.indexOf('vimeo.com')>=0){var vi=u.split('/').pop().split('?')[0];if(vi)return'<iframe src="https://player.vimeo.com/video/'+vi+'" frameborder="0" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen style="width:100%;border-radius:8px;height:220px;"></iframe>';}return'<video controls playsinline src="'+u+'" style="width:100%;border-radius:8px;max-height:250px;cursor:pointer" onclick="openLightboxFull(\''+u+'\',\'video\')"></video>';}

// UPDATED: Fetch from BOTH Google Sheets AND Firestore
function loadNews(cb){
  var allNews = [];
  var fetched = 0;
  
  // Fetch from Google Sheets
  fetch("https://docs.google.com/spreadsheets/d/"+SID+"/gviz/tq?tqx=out:csv&sheet=Sheet1&v="+Date.now())
  .then(function(r){return r.text()})
  .then(function(csv){
    var ls=csv.split('\n');
    for(var i=1;i<ls.length;i++){
      if(ls[i].trim()==='')continue;
      var co=ls[i].split(',');
      if(co.length>=6) allNews.push({t:co[0].replace(/"/g,'').trim(),d:co[1].replace(/"/g,'').trim(),b:co[2].replace(/"/g,'').trim(),img:co[3].replace(/"/g,'').trim(),vid:co[4].replace(/"/g,'').trim(),cat:co[5].replace(/"/g,'').trim(),source:'sheets'});
    }
    fetched++;
    if(fetched >= 2) finishNews();
  }).catch(function(){ fetched++; if(fetched >= 2) finishNews(); });
  
  // Fetch from Firestore
  fetch("https://firestore.googleapis.com/v1/projects/campuconnect-bd52f/databases/(default)/documents/news")
  .then(function(r){return r.json()})
  .then(function(data){
    if(data.documents){
      data.documents.forEach(function(doc){
        var f = doc.fields;
        allNews.push({
          t: f.title ? f.title.stringValue : '',
          d: f.date ? f.date.stringValue : '',
          b: f.content ? f.content.stringValue : '',
          img: f.imageUrl ? f.imageUrl.stringValue : '',
          vid: f.videoUrl ? f.videoUrl.stringValue : '',
          cat: f.category ? f.category.stringValue : '',
          source: 'firestore'
        });
      });
    }
    fetched++;
    if(fetched >= 2) finishNews();
  }).catch(function(){ fetched++; if(fetched >= 2) finishNews(); });
  
  function finishNews(){
    allNews.sort(function(a,b){ return new Date(b.d) - new Date(a.d); });
    cb(allNews);
  }
}

function showNews(id){
  var el=document.getElementById(id);if(!el)return;
  el.innerHTML='Loading...';
  loadNews(function(a){
    if(a.length===0){el.innerHTML='<div class="card"><p style="text-align:center;color:#9E9E9E;">No announcements yet.</p></div>';return}
    var h='';
    a.forEach(function(x){
      h+='<div class="news-card">';
      if(x.cat)h+='<span class="news-card-category">'+x.cat+'</span>';
      h+='<div class="news-card-title">'+x.t+'</div>';
      h+='<div class="news-card-date">📅 '+x.d+'</div>';
      if(x.b)h+='<div class="news-card-body">'+x.b+'</div>';
      if(x.img&&x.img.length>5)h+='<img src="'+x.img+'" onerror="this.style.display=\'none\'" style="width:100%;height:auto;max-height:none;object-fit:contain;cursor:pointer" onclick="openLightboxFull(\''+x.img+'\',\'image\')">';
      if(x.vid&&x.vid.length>5)h+=getVidEmb(x.vid);
      h+='</div>';
    });
    el.innerHTML=h;
  });
}
