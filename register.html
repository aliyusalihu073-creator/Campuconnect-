<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - CampusConnect</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
body{background:linear-gradient(135deg,#0a0a0a,#1a1a2e);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.register-container{width:100%;max-width:400px}
.register-box{background:#1a1a2e;border-radius:20px;padding:35px 25px;box-shadow:0 20px 60px rgba(0,0,0,0.5);text-align:center;border:1px solid #2a2a3e;animation:fadeIn 0.6s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.logo{font-size:50px;margin-bottom:10px}
h1{color:#4caf50;font-size:22px;margin-bottom:5px}
.subtitle{color:#999;font-size:11px;margin-bottom:20px}
.input-group{margin:10px 0;text-align:left}
.input-group label{color:#aaa;font-size:11px;font-weight:600;display:block;margin-bottom:3px}
.input-group input{width:100%;padding:13px 16px;border-radius:10px;border:2px solid #333;background:#0d0d1a;color:white;font-size:13px;outline:none;transition:0.3s}
.input-group input:focus{border-color:#4caf50;box-shadow:0 0 12px rgba(76,175,80,0.2)}
.btn{width:100%;padding:15px;margin:15px 0;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;background:linear-gradient(135deg,#1B5E20,#4caf50);color:white;transition:0.3s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(27,94,32,0.4)}
.link{color:#4caf50;font-size:12px;cursor:pointer;text-decoration:none;display:inline-block}
.link:hover{text-decoration:underline}
.password-strength{height:5px;background:#333;border-radius:3px;margin-top:5px;overflow:hidden}
.strength-bar{height:100%;width:0%;transition:0.3s;border-radius:3px}
.error{color:#f44336;font-size:11px;text-align:center;margin:5px 0;display:none}
.success{color:#4caf50;font-size:11px;text-align:center;margin:5px 0;display:none}
.requirements{font-size:10px;color:#999;text-align:left;margin-top:5px}
.requirements span{display:block;margin:2px 0}
.requirements .met{color:#4caf50}
.requirements .unmet{color:#f44336}
</style>
</head>
<body>

<div class="register-container">
<div class="register-box">
<div class="logo">📝</div>
<h1>Create Account</h1>
<p class="subtitle">Join CampusConnect - Adamawa State Polytechnic, Yola</p>
<div class="input-group">
<label>👤 Username</label>
<input type="text" id="regUser" placeholder="Choose a username">
</div>
<div class="input-group">
<label>📧 Email Address</label>
<input type="email" id="regEmail" placeholder="Enter your email">
</div>
<div class="input-group">
<label>📱 Phone Number</label>
<input type="tel" id="regPhone" placeholder="Enter your phone number">
</div>
<div class="input-group">
<label>🎓 Registration Number</label>
<input type="text" id="regNo" placeholder="e.g. SST/NDCOM/S/2025/186">
</div>
<div class="input-group">
<label>🔑 Password</label>
<input type="password" id="regPass" placeholder="Create a strong password" oninput="checkPasswordStrength()">
<div class="password-strength"><div class="strength-bar" id="strengthBar"></div></div>
<div class="requirements" id="requirements">
<span class="unmet" id="req1">❌ Minimum 8 characters</span>
<span class="unmet" id="req2">❌ At least 1 uppercase letter</span>
<span class="unmet" id="req3">❌ At least 1 number</span>
<span class="unmet" id="req4">❌ At least 1 special character (!@#$%)</span>
</div>
</div>
<p class="error" id="regError"></p>
<p class="success" id="regSuccess"></p>
<button class="btn" onclick="signUp()">📝 Create Account</button>
<p style="margin-top:10px;"><a href="login.html" class="link">🔐 Already have an account? Login</a></p>
<p><a href="index.html" class="link">← Back to Home</a></p>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB553_waOZcKoyvIdF7NsIH7EpjjbUeP68",
  authDomain: "campuconnect-bd52f.firebaseapp.com",
  projectId: "campuconnect-bd52f",
  storageBucket: "campuconnect-bd52f.firebasestorage.app",
  messagingSenderId: "762013163609",
  appId: "1:762013163609:web:7f565fbde05a4ad35ed148"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

window.checkPasswordStrength = function() {
  var pass = document.getElementById('regPass').value;
  var bar = document.getElementById('strengthBar');
  var score = 0;
  
  // Check requirements
  var r1 = pass.length >= 8;
  var r2 = /[A-Z]/.test(pass);
  var r3 = /[0-9]/.test(pass);
  var r4 = /[!@#$%^&*(),.?":{}|<>]/.test(pass);
  
  if(r1) score++;
  if(r2) score++;
  if(r3) score++;
  if(r4) score++;
  
  bar.style.width = (score * 25) + '%';
  if(score <= 1) bar.className = 'strength-bar strength-weak';
  else if(score <= 3) bar.className = 'strength-bar strength-medium';
  else bar.className = 'strength-bar strength-strong';
  
  document.getElementById('req1').className = r1 ? 'met' : 'unmet';
  document.getElementById('req1').innerHTML = (r1 ? '✅' : '❌') + ' Minimum 8 characters';
  document.getElementById('req2').className = r2 ? 'met' : 'unmet';
  document.getElementById('req2').innerHTML = (r2 ? '✅' : '❌') + ' At least 1 uppercase letter';
  document.getElementById('req3').className = r3 ? 'met' : 'unmet';
  document.getElementById('req3').innerHTML = (r3 ? '✅' : '❌') + ' At least 1 number';
  document.getElementById('req4').className = r4 ? 'met' : 'unmet';
  document.getElementById('req4').innerHTML = (r4 ? '✅' : '❌') + ' At least 1 special character';
};

window.signUp = async function() {
  var u = document.getElementById('regUser').value.trim();
  var e = document.getElementById('regEmail').value.trim();
  var p = document.getElementById('regPhone').value.trim();
  var r = document.getElementById('regNo').value.trim();
  var pw = document.getElementById('regPass').value;
  var err = document.getElementById('regError');
  var suc = document.getElementById('regSuccess');
  
  err.style.display = 'none';
  suc.style.display = 'none';
  
  if (!u || !e || !p || !r || !pw) {
    err.innerHTML = 'Please fill all fields';
    err.style.display = 'block';
    return;
  }
  
  // Strong password check
  if (pw.length < 8 || !/[A-Z]/.test(pw) || !/[0-9]/.test(pw) || !/[!@#$%^&*(),.?":{}|<>]/.test(pw)) {
    err.innerHTML = 'Password does not meet all requirements';
    err.style.display = 'block';
    return;
  }
  
  try {
    var cred = await createUserWithEmailAndPassword(auth, e, pw);
    await setDoc(doc(db, 'users', cred.user.uid), {
      username: u, email: e, phone: p, regNo: r, createdAt: new Date()
    });
    suc.innerHTML = '✅ Account created! Redirecting to login...';
    suc.style.display = 'block';
    setTimeout(function(){ window.location.href = 'login.html'; }, 2000);
  } catch(error) {
    err.innerHTML = '❌ ' + error.message;
    err.style.display = 'block';
  }
};
</script>
</body>
  </html>
