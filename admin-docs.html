<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Docs - CampusConnect</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
body{background:#0a0a0a;color:#fff;max-width:500px;margin:0 auto;min-height:100vh}
.header{background:linear-gradient(135deg,#1B5E20,#2E7D32);padding:16px 20px;display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:18px;color:white}
.header a{color:white;font-size:13px;text-decoration:none;background:rgba(255,255,255,0.2);padding:8px 14px;border-radius:20px}
.content{padding:15px}
.card{background:#1a1a2e;padding:20px;border-radius:12px;margin-bottom:15px}
.card h2{color:#4caf50;font-size:16px;margin-bottom:12px}
.card input,.card select{width:100%;padding:14px;margin:8px 0;border-radius:10px;border:2px solid #333;background:#0d0d1a;color:white;font-size:13px;outline:none}
.card input:focus,.card select:focus{border-color:#4caf50}
.btn{display:block;width:100%;padding:14px;margin:10px 0;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;text-align:center;color:white}
.btn-green{background:linear-gradient(135deg,#1B5E20,#2E7D32)}
.progress-bar{width:100%;height:8px;background:#333;border-radius:4px;margin:10px 0;overflow:hidden;display:none}
.progress-bar .fill{height:100%;background:#4caf50;width:0%}
.success{color:#4caf50;text-align:center;margin:10px 0;font-size:12px}
</style>
</head>
<body>
<div class="header"><h1>📚 Admin Docs</h1><a href="index.html">← Home</a></div>
<div class="content">
<div class="card">
<h2>📚 Upload Document</h2>
<input type="text" id="docTitle" placeholder="Document Title">
<input type="text" id="docAuthor" placeholder="Author Name">
<select id="docCategory"><option value="">Category</option><option value="Lecture Notes">📖 Lecture Notes</option><option value="Past Questions">📝 Past Questions</option><option value="Textbook">📚 Textbook</option><option value="Other">📄 Other</option></select>
<input type="file" id="docFile" accept=".pdf,.txt,.doc,.docx,.ppt,.pptx">
<div class="progress-bar" id="progressBar"><div class="fill" id="progressFill"></div></div>
<button class="btn btn-green" onclick="uploadDoc()">📤 Upload Document</button>
<p class="success" id="docMsg"></p>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";
import { getStorage, ref as storageRef, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-storage.js";
const app = initializeApp({apiKey:"AIzaSyB553_waOZcKoyvIdF7NsIH7EpjjbUeP68",authDomain:"campuconnect-bd52f.firebaseapp.com",projectId:"campuconnect-bd52f",storageBucket:"campuconnect-bd52f.firebasestorage.app",messagingSenderId:"762013163609",appId:"1:762013163609:web:7f565fbde05a4ad35ed148"});
const db = getFirestore(app); const storage = getStorage(app);

window.uploadDoc = async function() {
  var t=document.getElementById('docTitle').value.trim(), a=document.getElementById('docAuthor').value.trim()||'Admin';
  var cat=document.getElementById('docCategory').value, file=document.getElementById('docFile').files[0];
  if(!t||!cat||!file){alert('Fill all fields');return}
  document.getElementById('docMsg').innerHTML='⏳ Uploading...';
  document.getElementById('progressBar').style.display='block';
  var sRef=storageRef(storage,'documents/'+Date.now()+'_'+file.name);
  var task=uploadBytesResumable(sRef,file);
  task.on('state_changed',function(snap){var p=(snap.bytesTransferred/snap.totalBytes)*100;document.getElementById('progressFill').style.width=p+'%';},function(){},async function(){
    var url=await getDownloadURL(task.snapshot.ref);
    await addDoc(collection(db,'documents'),{title:t,author:a,category:cat,fileUrl:url,fileName:file.name,createdAt:new Date()});
    document.getElementById('docMsg').innerHTML='✅ Document uploaded!';
    document.getElementById('progressBar').style.display='none';
  });
};
</script>
</body>
</html>
