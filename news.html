<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campus News - CampusConnect</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:#F5F5F5;max-width:480px;margin:0 auto;min-height:100vh}
.header{background:#1B5E20;color:white;padding:18px;font-size:20px;font-weight:bold;text-align:center}
.content{padding:15px}
.news-card{background:white;border-radius:12px;padding:16px;margin:10px 0;box-shadow:0 2px 8px rgba(0,0,0,0.06);border-left:4px solid #1B5E20}
.news-title{font-size:16px;font-weight:700;color:#1B5E20;margin-bottom:4px}
.news-date{font-size:10px;color:#9E9E9E;margin-bottom:8px}
.news-body{font-size:13px;color:#424242;line-height:1.6}
.news-cat{display:inline-block;padding:4px 10px;border-radius:15px;font-size:10px;font-weight:600;background:#E8F5E9;color:#1B5E20;margin-bottom:8px}
.news-card img{width:100%;border-radius:8px;max-height:200px;margin:8px 0}
.news-card iframe{width:100%;height:200px;border-radius:8px;margin:8px 0}
.btn{display:block;width:100%;padding:14px;margin:10px 0;background:#1B5E20;color:white;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;text-align:center}
.footer{text-align:center;padding:20px;color:#999;font-size:11px}
</style>
</head>
<body>

<div class="header">📰 Campus News</div>

<div class="content" id="newsContent">
    <p style="text-align:center;color:#9E9E9E;padding:40px;">Loading announcements...</p>
</div>

<div class="footer">
    <a href="index.html" style="color:#1B5E20;font-weight:600;">← Back to CampusConnect</a>
</div>

<script>
var SID = "13RLLmcXk6BAZBWAxgiHcy_BwOAhhpPxwLQb1W12uyLg";

function getVideoEmbed(url){
    if(!url||url.length<5)return'';
    url=url.trim();
    if(url.indexOf('youtube.com')>=0||url.indexOf('youtu.be')>=0){
        var vid='';
        if(url.indexOf('youtu.be')>=0)vid=url.split('/').pop().split('?')[0];
        else{vid=url.split('v=')[1];if(vid&&vid.indexOf('&')>=0)vid=vid.split('&')[0];}
        if(vid)return'<iframe src="https://www.youtube.com/embed/'+vid+'" frameborder="0" allowfullscreen></iframe>';
    }
    if(url.match(/\.(mp4|webm|ogg)$/i))return'<video controls src="'+url+'" style="width:100%;border-radius:8px"></video>';
    if(url.match(/\.(mp3|wav|m4a)$/i))return'<audio controls src="'+url+'" style="width:100%"></audio>';
    return'<a href="'+url+'" target="_blank">🎥 Open Media</a>';
}

function loadNews(){
    var el=document.getElementById('newsContent');
    fetch("https://docs.google.com/spreadsheets/d/"+SID+"/gviz/tq?tqx=out:csv&sheet=Sheet1")
    .then(function(r){return r.text()})
    .then(function(csv){
        var lines=csv.split('\n');
        var articles=[];
        for(var i=1;i<lines.length;i++){
            if(lines[i].trim()==='')continue;
            var cols=lines[i].split(',');
            if(cols.length>=9){
                articles.push({
                    title:cols[0].replace(/"/g,'').trim(),
                    date:cols[1].replace(/"/g,'').trim(),
                    body:cols[2].replace(/"/g,'').trim(),
                    image:cols[3].replace(/"/g,'').trim(),
                    video:cols[4].replace(/"/g,'').trim(),
                    audio:cols[5].replace(/"/g,'').trim(),
                    cat:cols[6].replace(/"/g,'').trim(),
                    author:cols[7].replace(/"/g,'').trim(),
                    status:cols[8].replace(/"/g,'').trim()
                });
            }
        }
        var published=articles.filter(function(a){return a.status.toLowerCase()!=='draft';});
        if(published.length===0){
            el.innerHTML='<div class="news-card"><p style="text-align:center;color:#9E9E9E;">No announcements yet.</p></div>';
            return;
        }
        var h='<button class="btn" onclick="location.reload()">🔄 Refresh News</button>';
        published.forEach(function(a){
            h+='<div class="news-card">';
            if(a.cat)h+='<span class="news-cat">'+a.cat+'</span>';
            if(a.title)h+='<div class="news-title">'+a.title+'</div>';
            h+='<div class="news-date">📅 '+a.date+'</div>';
            if(a.body)h+='<div class="news-body">'+a.body+'</div>';
            if(a.image&&a.image.length>5)h+='<img src="'+a.image+'" onerror="this.style.display=\'none\'">';
            if(a.video&&a.video.length>5)h+=getVideoEmbed(a.video);
            if(a.audio&&a.audio.length>5)h+=getVideoEmbed(a.audio);
            h+='</div>';
        });
        el.innerHTML=h;
    })
    .catch(function(){
        el.innerHTML='<div class="news-card"><p style="text-align:center;color:#FF5722;">Failed to load. Check internet.</p></div>';
    });
}
loadNews();
</script>
</body>
</html>
