<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campus News - CampusConnect</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:#F5F5F5;max-width:480px;margin:0 auto;min-height:100vh}
.header{background:#1B5E20;color:white;padding:18px 20px;font-size:20px;font-weight:bold;text-align:center}
.content{padding:15px}
.card{background:white;padding:18px;border-radius:12px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
.btn{display:block;width:100%;padding:14px;margin:10px 0;background:#1B5E20;color:white;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;text-align:center}
.news-card{background:white;border-radius:12px;padding:16px;margin:10px 0;box-shadow:0 2px 8px rgba(0,0,0,0.06);border-left:4px solid #1B5E20}
.news-title{font-size:15px;font-weight:700;color:#1B5E20;margin-bottom:4px}
.news-date{font-size:10px;color:#9E9E9E;margin-bottom:8px}
.news-body{font-size:12px;color:#424242;line-height:1.6}
.news-cat{display:inline-block;padding:4px 10px;border-radius:15px;font-size:10px;font-weight:600;background:#E8F5E9;color:#1B5E20;margin-bottom:6px}
.news-card img{width:100%;border-radius:8px;max-height:200px;margin:5px 0}
.news-card video{width:100%;border-radius:8px;max-height:250px;margin:5px 0}
.footer{text-align:center;padding:20px;color:#999;font-size:11px}
</style>
</head>
<body>

<div class="header">📰 Campus News</div>
<div class="content" id="newsContent">
    <p style="text-align:center;color:#9E9E9E;padding:40px;">Loading announcements...</p>
</div>
<div class="footer">
    <a href="index.html" style="color:#1B5E20;text-decoration:none;font-weight:600;">← Back to CampusConnect</a>
</div>

<script>
var SID = "13RLLmcXk6BAZBWAxgiHcy_BwOAhhpPxwLQb1W12uyLg";
function loadNews(){
    var el = document.getElementById('newsContent');
    fetch("https://docs.google.com/spreadsheets/d/"+SID+"/gviz/tq?tqx=out:csv&sheet=Sheet1")
    .then(function(r){return r.text()})
    .then(function(csv){
        var lines = csv.split('\n');
        var articles = [];
        for(var i=1; i<lines.length; i++){
            if(lines[i].trim() === '') continue;
            var cols = lines[i].split(',');
            if(cols.length >= 6){
                articles.push({
                    title: cols[0].replace(/"/g,'').trim(),
                    date: cols[1].replace(/"/g,'').trim(),
                    body: cols[2].replace(/"/g,'').trim(),
                    image: cols[3].replace(/"/g,'').trim(),
                    video: cols[4].replace(/"/g,'').trim(),
                    cat: cols[5].replace(/"/g,'').trim()
                });
            }
        }
        if(articles.length === 0){
            el.innerHTML = '<div class="card"><p style="text-align:center;color:#9E9E9E;">No announcements yet.<br><br>Add them in Google Sheets!</p></div>';
            return;
        }
        var h = '<button class="btn" onclick="location.reload()">🔄 Refresh News</button>';
        articles.forEach(function(a){
            h += '<div class="news-card">';
            h += '<span class="news-cat">' + (a.cat || 'General') + '</span>';
            h += '<div class="news-title">' + a.title + '</div>';
            h += '<div class="news-date">📅 ' + a.date + '</div>';
            h += '<div class="news-body">' + a.body + '</div>';
            if(a.image && a.image.length > 5) h += '<img src="' + a.image + '" onerror="this.style.display=\'none\'">';
            if(a.video && a.video.length > 5) h += '<video controls src="' + a.video + '"></video>';
            h += '</div>';
        });
        el.innerHTML = h;
    })
    .catch(function(){
        el.innerHTML = '<div class="card"><p style="text-align:center;color:#FF5722;">Failed to load news. Check your internet connection.</p></div>';
    });
}
loadNews();
</script>
</body>
</html>
