<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - CampusConnect</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
body{background:linear-gradient(135deg,#0a0a0a,#1a1a2e);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-container{width:100%;max-width:400px}
.login-box{background:#1a1a2e;border-radius:20px;padding:35px 25px;box-shadow:0 20px 60px rgba(0,0,0,0.5);text-align:center;border:1px solid #2a2a3e;animation:fadeIn 0.6s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.logo{font-size:60px;margin-bottom:10px;animation:bounce 2s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}
h1{color:#4caf50;font-size:24px;margin-bottom:5px}
.subtitle{color:#999;font-size:12px;margin-bottom:25px}
.input-group{margin:12px 0;text-align:left}
.input-group label{color:#aaa;font-size:11px;font-weight:600;display:block;margin-bottom:4px}
.input-group input{width:100%;padding:14px 16px;border-radius:10px;border:2px solid #333;background:#0d0d1a;color:white;font-size:14px;outline:none;transition:0.3s}
.input-group input:focus{border-color:#4caf50;box-shadow:0 0 12px rgba(76,175,80,0.2)}
.btn{width:100%;padding:15px;margin:15px 0;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;background:linear-gradient(135deg,#1B5E20,#4caf50);color:white;transition:0.3s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(27,94,32,0.4)}
.link{color:#4caf50;font-size:12px;cursor:pointer;text-decoration:none;margin:5px 0;display:inline-block}
.link:hover{text-decoration:underline}
.checkbox-row{display:flex;align-items:center;gap:8px;margin:10px 0;color:#aaa;font-size:12px}
.checkbox-row input{accent-color:#4caf50}
.error{color:#f44336;font-size:11px;text-align:center;margin:5px 0;display:none}
.success{color:#4caf50;font-size:11px;text-align:center;margin:5px 0;display:none}
.password-strength{height:4px;background:#333;border-radius:2px;margin-top:5px;overflow:hidden}
.strength-bar{height:100%;width:0%;transition:0.3s;border-radius:2px}
.strength-weak{background:#f44336}
.strength-medium{background:#ff9800}
.strength-strong{background:#4caf50}
</style>
</head>
<body>

<div class="login-container">
<div class="login-box" id="loginForm">
<div class="logo">🎓</div>
<h1>CampusConnect</h1>
<p class="subtitle">Adamawa State Polytechnic, Yola</p>
<div class="input-group">
<label>📧 Email Address</label>
<input type="email" id="loginEmail" placeholder="Enter your email">
</div>
<div class="input-group">
<label>🔑 Password</label>
<input type="password" id="loginPass" placeholder="Enter your password">
</div>
<div class="checkbox-row">
<input type="checkbox" id="rememberMe"><label for="rememberMe">Remember me (stay logged in)</label>
</div>
<p class="error" id="loginError"></p>
<button class="btn" onclick="signIn()">🔐 Login</button>
<p style="margin-top:10px;"><a href="register.html" class="link">📝 Create New Account</a></p>
<p><a href="index.html" class="link">← Back to Home</a></p>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyB553_waOZcKoyvIdF7NsIH7EpjjbUeP68",
  authDomain: "campuconnect-bd52f.firebaseapp.com",
  projectId: "campuconnect-bd52f",
  storageBucket: "campuconnect-bd52f.firebasestorage.app",
  messagingSenderId: "762013163609",
  appId: "1:762013163609:web:7f565fbde05a4ad35ed148"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// Check if already logged in
onAuthStateChanged(auth, function(user) {
  if (user) {
    window.location.href = 'index.html';
  }
});

// Remember Me
if (localStorage.getItem('rememberMe') === 'true') {
  document.getElementById('rememberMe').checked = true;
  setPersistence(auth, browserLocalPersistence);
}

window.signIn = async function() {
  var e = document.getElementById('loginEmail').value.trim();
  var p = document.getElementById('loginPass').value.trim();
  var err = document.getElementById('loginError');
  
  err.style.display = 'none';
  
  if (!e || !p) {
    err.innerHTML = 'Please fill all fields';
    err.style.display = 'block';
    return;
  }
  
  try {
    // Remember Me
    if (document.getElementById('rememberMe').checked) {
      localStorage.setItem('rememberMe', 'true');
      await setPersistence(auth, browserLocalPersistence);
    } else {
      localStorage.removeItem('rememberMe');
    }
    
    await signInWithEmailAndPassword(auth, e, p);
    window.location.href = 'index.html';
  } catch(error) {
    err.innerHTML = '❌ ' + error.message;
    err.style.display = 'block';
  }
};
</script>
</body>
  </html>
