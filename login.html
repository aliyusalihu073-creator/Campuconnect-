<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - CampusConnect</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
body{background:linear-gradient(135deg,#0a0a0a,#1a1a2e);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-container{width:100%;max-width:400px}
.login-box{background:#1a1a2e;border-radius:20px;padding:35px 25px;box-shadow:0 20px 60px rgba(0,0,0,0.5);text-align:center;border:1px solid #2a2a3e;animation:fadeIn 0.6s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.logo{font-size:60px;margin-bottom:10px;animation:bounce 2s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
h1{color:#4caf50;font-size:24px;margin-bottom:5px}
.subtitle{color:#999;font-size:12px;margin-bottom:25px}
.input-group{margin:12px 0;text-align:left}
.input-group label{color:#aaa;font-size:11px;font-weight:600;display:block;margin-bottom:4px}
.input-group input{width:100%;padding:14px 16px;border-radius:10px;border:2px solid #333;background:#0d0d1a;color:white;font-size:14px;outline:none;transition:0.3s}
.input-group input:focus{border-color:#4caf50;box-shadow:0 0 12px rgba(76,175,80,0.2)}
.btn{width:100%;padding:15px;margin:10px 0;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;transition:0.3s;color:white;position:relative}
.btn-green{background:linear-gradient(135deg,#1B5E20,#4caf50)}
.btn-green:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(27,94,32,0.4)}
.btn-green:disabled{opacity:0.6;cursor:not-allowed;transform:none}
.btn-google{background:white;color:#333;display:flex;align-items:center;justify-content:center;gap:10px}
.btn-google:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(255,255,255,0.2)}
.btn-google img{width:20px;height:20px}
.divider{display:flex;align-items:center;gap:10px;margin:20px 0;color:#999;font-size:11px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:#333}
.link{color:#4caf50;font-size:12px;cursor:pointer;text-decoration:none;margin:5px 0;display:inline-block}
.link:hover{text-decoration:underline}
.checkbox-row{display:flex;align-items:center;gap:8px;margin:10px 0;color:#aaa;font-size:12px}
.checkbox-row input{accent-color:#4caf50}
.error{color:#f44336;font-size:11px;text-align:center;margin:5px 0;padding:8px;background:rgba(244,67,54,0.1);border-radius:8px;display:none}
.success{color:#4caf50;font-size:11px;text-align:center;margin:5px 0;padding:8px;background:rgba(76,175,80,0.1);border-radius:8px;display:none}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,0.3);border-top-color:white;border-radius:50%;animation:spin 0.8s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:9999;align-items:center;justify-content:center;flex-direction:column;gap:15px}
.loading-overlay.show{display:flex}
.loading-overlay .spinner{width:40px;height:40px;border-width:3px}
.loading-overlay p{color:white;font-size:14px}
</style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <p>Signing you in...</p>
</div>

<div class="login-container">
  <div class="login-box">
    <div class="logo">🎓</div>
    <h1>CampusConnect</h1>
    <p class="subtitle">Adamawa State Polytechnic, Yola</p>

    <button class="btn btn-google" onclick="signInWithGoogle()">
      <img src="https://www.google.com/favicon.ico" alt="G"> Sign in with Google
    </button>

    <div class="divider">OR LOGIN WITH EMAIL</div>

    <div class="input-group">
      <label>📧 Email Address</label>
      <input type="email" id="loginEmail" placeholder="Enter your email" onkeypress="if(event.key==='Enter')signIn()">
    </div>
    <div class="input-group">
      <label>🔑 Password</label>
      <input type="password" id="loginPass" placeholder="Enter your password" onkeypress="if(event.key==='Enter')signIn()">
    </div>
    <div class="checkbox-row">
      <input type="checkbox" id="rememberMe"><label for="rememberMe">Remember me</label>
    </div>
    <p class="error" id="loginError"></p>
    <p class="success" id="loginSuccess"></p>
    <button class="btn btn-green" id="loginBtn" onclick="signIn()">🔐 Login</button>
    <p style="margin-top:10px;"><a href="register.html" class="link">📝 Create New Account</a></p>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged,
         setPersistence, browserLocalPersistence, browserSessionPersistence,
         GoogleAuthProvider, signInWithPopup, sendEmailVerification, signOut }
  from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";
import { getFirestore, doc, setDoc }
  from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB553_waOZcKoyvIdF7NsIH7EpjjbUeP68",
  authDomain: "campuconnect-bd52f.firebaseapp.com",
  projectId: "campuconnect-bd52f",
  storageBucket: "campuconnect-bd52f.firebasestorage.app",
  messagingSenderId: "762013163609",
  appId: "1:762013163609:web:7f565fbde05a4ad35ed148"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

function showError(msg){ var e=document.getElementById('loginError'); e.innerHTML=msg; e.style.display='block'; document.getElementById('loginSuccess').style.display='none'; }
function showSuccess(msg){ var s=document.getElementById('loginSuccess'); s.innerHTML=msg; s.style.display='block'; document.getElementById('loginError').style.display='none'; }
function setLoading(on){ document.getElementById('loadingOverlay').classList.toggle('show',on); document.getElementById('loginBtn').disabled=on; }

// If already logged in, go straight to app
onAuthStateChanged(auth, function(user) {
  if (user && user.emailVerified) {
    window.location.href = 'index.html';
  }
});

// Remember Me persistence
if (localStorage.getItem('rememberMe') === 'true') {
  document.getElementById('rememberMe').checked = true;
}

window.signIn = async function() {
  var e = document.getElementById('loginEmail').value.trim();
  var p = document.getElementById('loginPass').value;
  document.getElementById('loginError').style.display = 'none';
  if (!e || !p) { showError('Please fill all fields'); return; }

  setLoading(true);
  try {
    var persistence = document.getElementById('rememberMe').checked
      ? browserLocalPersistence : browserSessionPersistence;
    localStorage.setItem('rememberMe', document.getElementById('rememberMe').checked ? 'true' : 'false');
    await setPersistence(auth, persistence);

    var cred = await signInWithEmailAndPassword(auth, e, p);

    if (!cred.user.emailVerified) {
      await sendEmailVerification(cred.user);
      await signOut(auth);
      setLoading(false);
      showError('⚠️ Email not verified. A new verification link has been sent. Please check your inbox.');
      return;
    }
    // Redirect handled by onAuthStateChanged
  } catch(err) {
    setLoading(false);
    var msg = err.code === 'auth/user-not-found' ? '❌ No account found with this email.'
            : err.code === 'auth/wrong-password' ? '❌ Incorrect password.'
            : err.code === 'auth/too-many-requests' ? '❌ Too many attempts. Try again later.'
            : '❌ ' + err.message;
    showError(msg);
  }
};

window.signInWithGoogle = async function() {
  setLoading(true);
  try {
    var result = await signInWithPopup(auth, provider);
    if (result.user) {
      await setDoc(doc(db, 'users', result.user.uid), {
        username: result.user.displayName || 'Student',
        email: result.user.email,
        phone: result.user.phoneNumber || '',
        regNo: '',
        photoURL: result.user.photoURL || '',
        createdAt: new Date()
      }, { merge: true });
      window.location.href = 'index.html';
    }
  } catch(err) {
    setLoading(false);
    showError('❌ Google sign-in failed. ' + err.message);
  }
};
</script>
<script>
// Service worker registration - auto-checks for updates and reloads when a new version is ready
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('service-worker.js?v=10', { updateViaCache: 'none' })
      .then(function(reg) {
        reg.update(); // check for a new version right away
        setInterval(function() { reg.update(); }, 30 * 60 * 1000); // re-check every 30 min while the tab is open
      })
      .catch(function() {});
  });

  var __swRefreshed = false;
  navigator.serviceWorker.addEventListener('controllerchange', function() {
    if (__swRefreshed) return;
    __swRefreshed = true;
    window.location.reload();
  });
}
</script>
</body>
</html>
