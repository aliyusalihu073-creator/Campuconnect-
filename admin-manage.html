<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Manage - CampusConnect</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
body{background:#0a0a0a;color:#fff;max-width:500px;margin:0 auto;min-height:100vh}
.header{background:linear-gradient(135deg,#1B5E20,#2E7D32);padding:16px 20px;display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:18px;color:white}
.header a{color:white;font-size:13px;text-decoration:none;background:rgba(255,255,255,0.2);padding:8px 14px;border-radius:20px}
.content{padding:15px;padding-bottom:40px}
.tabs{display:flex;gap:6px;margin-bottom:14px;background:#1a1a2e;padding:6px;border-radius:12px}
.tab{flex:1;padding:10px 6px;border:none;border-radius:8px;background:transparent;color:#666;font-size:12px;font-weight:600;cursor:pointer;transition:0.2s}
.tab.active{background:#1B5E20;color:white}
.card{background:#1a1a2e;padding:16px;border-radius:14px;margin-bottom:12px;border:1px solid #2a2a3e}
.card h2{color:#4caf50;font-size:15px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.refresh-btn{background:#1a3a2a;color:#4caf50;border:none;padding:6px 12px;border-radius:8px;font-size:11px;cursor:pointer}
.item{background:#0d0d1a;padding:12px;border-radius:10px;margin:8px 0;border:1px solid #2a2a3e;transition:0.2s}
.item:hover{border-color:#4caf50}
.item-title{font-size:13px;font-weight:600;color:#e0e0e0;margin-bottom:4px}
.item-meta{font-size:10px;color:#555;margin-bottom:8px}
.item-actions{display:flex;gap:6px}
.del-btn{background:#2a0d0d;color:#f44336;border:1px solid #3a1a1a;padding:7px 14px;border-radius:8px;font-size:11px;cursor:pointer;font-weight:600;transition:0.2s}
.del-btn:hover{background:#f44336;color:white}
.empty{color:#555;text-align:center;padding:25px;font-size:12px}
.skeleton{background:linear-gradient(90deg,#1a1a2e 25%,#21262d 50%,#1a1a2e 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:8px;height:60px;margin:8px 0}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.toast{position:fixed;top:20px;right:20px;padding:12px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:9999;animation:slideIn 0.3s ease}
.toast.success{background:#1a3a2a;color:#4caf50;border:1px solid #4caf50}
.toast.error{background:#2a1a1a;color:#f44336;border:1px solid #f44336}
@keyframes slideIn{from{transform:translateX(110%)}to{transform:translateX(0)}}
.count-badge{background:#1a3a2a;color:#4caf50;padding:2px 8px;border-radius:8px;font-size:10px;margin-left:6px}
</style>
</head>
<body>
<div id="authGate" style="position:fixed;inset:0;background:#0a0a0a;z-index:99999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;font-family:'Segoe UI',Arial,sans-serif">
  <div style="width:36px;height:36px;border:3px solid rgba(76,175,80,0.2);border-top-color:#4caf50;border-radius:50%;animation:authSpin 0.8s linear infinite"></div>
  <p style="color:#4caf50;font-size:13px">Verifying admin access...</p>
</div>
<style>@keyframes authSpin{to{transform:rotate(360deg)}}</style>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";
const __guardApp = initializeApp({
  apiKey: "AIzaSyB553_waOZcKoyvIdF7NsIH7EpjjbUeP68",
  authDomain: "campuconnect-bd52f.firebaseapp.com",
  projectId: "campuconnect-bd52f",
  storageBucket: "campuconnect-bd52f.firebasestorage.app",
  messagingSenderId: "762013163609",
  appId: "1:762013163609:web:7f565fbde05a4ad35ed148"
}, "authGuard");
const __guardAuth = getAuth(__guardApp);
const ADMIN_EMAILS = ['aliyusalihu@gmail.com', 'admin@campusconnect.com', 'aliyusalihu073@gmail.com'];
onAuthStateChanged(__guardAuth, function(user) {
  var gate = document.getElementById('authGate');
  if (!user) { window.location.href = 'login.html'; return; }
  if (!ADMIN_EMAILS.includes(user.email)) {
    gate.innerHTML = '<div style="text-align:center;padding:30px">'
      + '<p style="font-size:40px">🚫</p>'
      + '<p style="color:#f44336;font-size:16px;margin:10px 0">Access Denied</p>'
      + '<p style="color:#999;font-size:12px">You do not have admin privileges.</p>'
      + '<a href="index.html" style="display:inline-block;margin-top:16px;background:#0d4a1a;color:white;padding:10px 20px;border-radius:10px;text-decoration:none;font-size:13px">← Go Home</a>'
      + '</div>';
    return;
  }
  gate.remove();
});
</script>

<div class="header"><h1>📋 Manage Content</h1><a href="admin.html">← Admin</a></div>
<div class="content">
  <div class="tabs">
    <button class="tab active" onclick="switchTab('news')">📰 News</button>
    <button class="tab" onclick="switchTab('docs')">📚 Docs</button>
    <button class="tab" onclick="switchTab('results')">📊 Results</button>
  </div>

  <!-- NEWS TAB -->
  <div id="tab-news">
    <div class="card">
      <h2>📰 News Posts <button class="refresh-btn" onclick="loadNews()">🔄 Refresh</button></h2>
      <div id="newsList"><div class="skeleton"></div><div class="skeleton"></div></div>
    </div>
  </div>

  <!-- DOCS TAB -->
  <div id="tab-docs" style="display:none">
    <div class="card">
      <h2>📚 Documents <button class="refresh-btn" onclick="loadDocs()">🔄 Refresh</button></h2>
      <div id="docsList"><div class="skeleton"></div><div class="skeleton"></div></div>
    </div>
  </div>

  <!-- RESULTS TAB -->
  <div id="tab-results" style="display:none">
    <div class="card">
      <h2>📊 Results <button class="refresh-btn" onclick="loadResults()">🔄 Refresh</button></h2>
      <div id="resultsList"><div class="skeleton"></div><div class="skeleton"></div></div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";
import { getFirestore, collection, getDocs, doc, deleteDoc, orderBy, query }
  from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyB553_waOZcKoyvIdF7NsIH7EpjjbUeP68",
  authDomain: "campuconnect-bd52f.firebaseapp.com",
  projectId: "campuconnect-bd52f",
  storageBucket: "campuconnect-bd52f.firebasestorage.app",
  messagingSenderId: "762013163609",
  appId: "1:762013163609:web:7f565fbde05a4ad35ed148"
});
const db = getFirestore(app);

function showToast(msg, type) {
  var t = document.createElement('div'); t.className='toast '+(type||'success'); t.innerHTML=msg;
  document.body.appendChild(t); setTimeout(function(){ t.remove(); }, 3500);
}

window.switchTab = function(tab) {
  ['news','docs','results'].forEach(function(t){
    document.getElementById('tab-'+t).style.display = t===tab ? 'block':'none';
  });
  document.querySelectorAll('.tab').forEach(function(b){ b.classList.remove('active'); });
  event.target.classList.add('active');
  if (tab==='news') loadNews();
  else if (tab==='docs') loadDocs();
  else loadResults();
};

window.loadNews = async function() {
  var el = document.getElementById('newsList');
  el.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div>';
  try {
    var q = query(collection(db,'news'), orderBy('createdAt','desc'));
    var snap = await getDocs(q);
    if (snap.empty) { el.innerHTML='<p class="empty">📭 No news posts yet.</p>'; return; }
    var h = '';
    snap.forEach(function(d) {
      var data = d.data();
      h += '<div class="item">'
        + '<div class="item-title">' + (data.title||'Untitled') + '</div>'
        + '<div class="item-meta">📅 ' + (data.date||'') + ' · ✍️ ' + (data.author||'Admin') + ' · 🏷️ ' + (data.category||'') + '</div>'
        + '<div class="item-actions">'
        + '<button class="del-btn" onclick="delItem(\'news\',\'' + d.id + '\',this)">🗑️ Delete</button>'
        + '</div></div>';
    });
    el.innerHTML = h;
  } catch(e) { el.innerHTML='<p class="empty" style="color:#f44336">❌ Failed to load.</p>'; }
};

window.loadDocs = async function() {
  var el = document.getElementById('docsList');
  el.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div>';
  try {
    var q = query(collection(db,'documents'), orderBy('createdAt','desc'));
    var snap = await getDocs(q);
    if (snap.empty) { el.innerHTML='<p class="empty">📭 No documents uploaded yet.</p>'; return; }
    var h = '';
    snap.forEach(function(d) {
      var data = d.data();
      h += '<div class="item">'
        + '<div class="item-title">📄 ' + (data.title||'Untitled') + '</div>'
        + '<div class="item-meta">📂 ' + (data.category||'Other') + ' · ✍️ ' + (data.author||'Admin') + '</div>'
        + '<div class="item-actions">'
        + '<button class="del-btn" onclick="delItem(\'documents\',\'' + d.id + '\',this)">🗑️ Delete</button>'
        + '</div></div>';
    });
    el.innerHTML = h;
  } catch(e) { el.innerHTML='<p class="empty" style="color:#f44336">❌ Failed to load.</p>'; }
};

window.loadResults = async function() {
  var el = document.getElementById('resultsList');
  el.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div>';
  try {
    var snap = await getDocs(collection(db,'results'));
    if (snap.empty) { el.innerHTML='<p class="empty">📭 No results added yet.</p>'; return; }
    var h = '';
    snap.forEach(function(d) {
      var data = d.data();
      h += '<div class="item">'
        + '<div class="item-title">👤 ' + (data.name||'Unknown') + '</div>'
        + '<div class="item-meta">📋 ' + (data.regNo||'') + ' · 📚 ' + (data.semester||'') + ' Semester · 📊 GPA: ' + (data.gpa||'N/A') + '</div>'
        + '<div class="item-actions">'
        + '<button class="del-btn" onclick="delItem(\'results\',\'' + d.id + '\',this)">🗑️ Delete</button>'
        + '</div></div>';
    });
    el.innerHTML = h;
  } catch(e) { el.innerHTML='<p class="empty" style="color:#f44336">❌ Failed to load.</p>'; }
};

window.delItem = async function(colName, id, btn) {
  if (!confirm('Delete this item? This cannot be undone.')) return;
  btn.disabled = true; btn.innerHTML = '⏳';
  try {
    await deleteDoc(doc(db, colName, id));
    btn.closest('.item').remove();
    showToast('✅ Deleted successfully.', 'success');
  } catch(e) {
    btn.disabled = false; btn.innerHTML = '🗑️ Delete';
    showToast('❌ Delete failed: ' + e.message, 'error');
  }
};

// Load news by default
loadNews();
</script>
<script>
// Service worker registration - auto-checks for updates and reloads when a new version is ready
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('service-worker.js?v=10', { updateViaCache: 'none' })
      .then(function(reg) {
        reg.update(); // check for a new version right away
        setInterval(function() { reg.update(); }, 30 * 60 * 1000); // re-check every 30 min while the tab is open
      })
      .catch(function() {});
  });

  var __swRefreshed = false;
  navigator.serviceWorker.addEventListener('controllerchange', function() {
    if (__swRefreshed) return;
    __swRefreshed = true;
    window.location.reload();
  });
}
</script>
</body>
</html>
