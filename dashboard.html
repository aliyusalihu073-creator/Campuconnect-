<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - CampusConnect</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
body{background:#0d1117;color:#fff;max-width:450px;margin:0 auto;min-height:100vh}
.header{background:linear-gradient(135deg,#0d4a1a,#1a6b2e);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.header h1{font-size:16px;color:white}
.header a{color:white;font-size:12px;text-decoration:none;background:rgba(255,255,255,0.2);padding:6px 12px;border-radius:15px}
.content{padding:15px;padding-bottom:40px}
.card{background:#161b22;padding:16px;border-radius:12px;margin-bottom:12px;border:1px solid #30363d}
.card h2{color:#4caf50;font-size:15px;margin-bottom:10px}
.profile-card{text-align:center;padding:25px 16px}
.profile-card .avatar{width:70px;height:70px;border-radius:50%;border:3px solid #4caf50;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:30px;background:#1a3a2a}
.profile-card h2{color:#4caf50;font-size:18px;margin-bottom:4px}
.profile-card p{color:#999;font-size:11px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:#161b22;padding:16px;border-radius:12px;text-align:center;border:1px solid #30363d}
.stat .num{font-size:26px;font-weight:bold;color:#ffd700}
.stat .label{font-size:10px;color:#999;margin-top:4px}
.bar{width:100%;height:8px;background:#30363d;border-radius:4px;margin:6px 0;overflow:hidden}
.bar .fill{height:100%;border-radius:4px;transition:width 1s ease}
.fill-green{background:linear-gradient(90deg,#1a6b2e,#4caf50)}
.fill-gold{background:linear-gradient(90deg,#b8860b,#ffd700)}
.course-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #30363d;font-size:12px}
.course-row:last-child{border-bottom:none}
.grade-badge{padding:3px 10px;border-radius:10px;font-size:11px;font-weight:bold}
.grade-a{background:#1a3a2a;color:#4caf50}
.grade-b{background:#1a2a3a;color:#8bc34a}
.grade-c{background:#2a2a1a;color:#ff9800}
.grade-d{background:#2a1a1a;color:#f44336}
.btn{display:block;width:100%;padding:13px;margin:6px 0;background:linear-gradient(135deg,#0d4a1a,#1a6b2e);color:white;border:none;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;text-align:center;transition:0.3s}
.btn:hover{opacity:0.9}
.skeleton{background:linear-gradient(90deg,#161b22 25%,#21262d 50%,#161b22 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:8px;margin:6px 0}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.footer{text-align:center;padding:15px;color:#555;font-size:10px}
.footer a{color:#4caf50;text-decoration:none}
.no-result{color:#999;text-align:center;padding:20px;font-size:12px}
.gpa-circle{width:90px;height:90px;border-radius:50%;border:4px solid #4caf50;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:10px auto;background:#1a3a2a}
.gpa-circle .gpa-num{font-size:22px;font-weight:900;color:#4caf50}
.gpa-circle .gpa-label{font-size:9px;color:#999}
</style>
</head>
<body>
<div class="header">
  <h1>📊 My Dashboard</h1>
  <a href="index.html">← Home</a>
</div>
<div class="content" id="dashContent">
  <!-- Skeleton loading -->
  <div class="card profile-card">
    <div class="skeleton" style="width:70px;height:70px;border-radius:50%;margin:0 auto 12px"></div>
    <div class="skeleton" style="height:20px;width:60%;margin:0 auto 8px"></div>
    <div class="skeleton" style="height:12px;width:40%;margin:0 auto"></div>
  </div>
  <div class="stats">
    <div class="stat"><div class="skeleton" style="height:30px"></div></div>
    <div class="stat"><div class="skeleton" style="height:30px"></div></div>
    <div class="stat"><div class="skeleton" style="height:30px"></div></div>
    <div class="stat"><div class="skeleton" style="height:30px"></div></div>
  </div>
</div>
<div class="footer"><a href="index.html">← Back to CampusConnect</a></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";
import { getFirestore, doc, getDoc, collection, query, where, getDocs }
  from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyB553_waOZcKoyvIdF7NsIH7EpjjbUeP68",
  authDomain: "campuconnect-bd52f.firebaseapp.com",
  projectId: "campuconnect-bd52f",
  storageBucket: "campuconnect-bd52f.firebasestorage.app",
  messagingSenderId: "762013163609",
  appId: "1:762013163609:web:7f565fbde05a4ad35ed148"
});
const auth = getAuth(app);
const db = getFirestore(app);

function escapeHtml(str) {
  var d = document.createElement('div');
  d.textContent = str == null ? '' : String(str);
  return d.innerHTML;
}

onAuthStateChanged(auth, async function(user) {
  if (!user) { window.location.href = 'login.html'; return; }
  if (!user.emailVerified) { auth.signOut(); window.location.href = 'login.html'; return; }

  try {
    // Load user profile
    var userSnap = await getDoc(doc(db, 'users', user.uid));
    var profile = userSnap.exists() ? userSnap.data() : {};
    var username = profile.username || user.displayName || user.email.split('@')[0];
    var regNo = profile.regNo || '';

    // Load results from Firestore (both semesters)
    var firstSnap = null, secondSnap = null;
    if (regNo) {
      var firstId = regNo.replace(/\//g,'_') + '_First';
      var secondId = regNo.replace(/\//g,'_') + '_Second';
      firstSnap = await getDoc(doc(db, 'results', firstId));
      secondSnap = await getDoc(doc(db, 'results', secondId));
    }

    var firstData = firstSnap && firstSnap.exists() ? firstSnap.data() : null;
    var secondData = secondSnap && secondSnap.exists() ? secondSnap.data() : null;

    // Calculate stats
    var allCourses = [];
    if (firstData && firstData.courses) allCourses = allCourses.concat(firstData.courses);
    if (secondData && secondData.courses) allCourses = allCourses.concat(secondData.courses);

    var totalPoints = 0;
    allCourses.forEach(function(c){ totalPoints += Number(c.point)||0; });
    var overallGPA = allCourses.length > 0 ? (totalPoints/allCourses.length).toFixed(2) : null;
    var gpaNum = parseFloat(overallGPA) || 0;
    var standing = gpaNum >= 3.5 ? 'Distinction' : gpaNum >= 3.0 ? 'Upper Credit' : gpaNum >= 2.0 ? 'Lower Credit' : gpaNum >= 1.0 ? 'Pass' : 'N/A';
    var totalCourses = allCourses.length;
    var passedCourses = allCourses.filter(function(c){ return Number(c.point)>=1; }).length;
    var completionPct = totalCourses > 0 ? Math.round((passedCourses/totalCourses)*100) : 0;

    // Build course rows for first semester
    function buildCourseRows(data) {
      if (!data || !data.courses || data.courses.length === 0) return '<p class="no-result">No data available.</p>';
      var h = '';
      data.courses.forEach(function(c) {
        var g = (c.grade||'').toUpperCase();
        var gc = g==='A'?'grade-a':g==='B'?'grade-b':g==='C'?'grade-c':'grade-d';
        h += '<div class="course-row"><span>' + escapeHtml(c.course) + '</span><span class="grade-badge ' + gc + '">' + escapeHtml(g) + ' (' + escapeHtml(c.point) + ')</span></div>';
      });
      return h;
    }

    var html = '';

    // Profile card
    html += '<div class="card profile-card">'
      + '<div class="avatar">👤</div>'
      + '<h2>' + escapeHtml(username) + '</h2>'
      + '<p>ND1 Computer Science | ASP Yola</p>'
      + (regNo ? '<p style="margin-top:4px;color:#4caf50;font-size:11px;">📋 ' + escapeHtml(regNo) + '</p>' : '')
      + '</div>';

    // Stats grid
    html += '<div class="stats">'
      + '<div class="stat"><div class="num">' + (totalCourses || '—') + '</div><div class="label">Total Courses</div></div>'
      + '<div class="stat"><div class="num">' + (passedCourses || '—') + '</div><div class="label">Passed</div></div>'
      + '<div class="stat"><div class="num">' + (overallGPA || '—') + '</div><div class="label">Overall GPA</div></div>'
      + '<div class="stat"><div class="num">' + (totalCourses > 0 ? completionPct + '%' : '—') + '</div><div class="label">Completion</div></div>'
      + '</div>';

    // GPA circle + standing
    if (overallGPA) {
      html += '<div class="card" style="text-align:center">'
        + '<div class="gpa-circle"><div class="gpa-num">' + overallGPA + '</div><div class="gpa-label">GPA</div></div>'
        + '<p style="color:#4caf50;font-weight:600;margin-top:8px;">' + standing + '</p>'
        + '<div class="bar" style="margin-top:12px"><div class="fill fill-green" style="width:' + Math.min(gpaNum/4*100,100) + '%"></div></div>'
        + '<p style="font-size:10px;color:#999;margin-top:4px;">Scale: 0.0 – 4.0</p>'
        + '</div>';
    }

    // First semester results
    html += '<div class="card"><h2>📚 First Semester</h2>';
    if (firstData) {
      html += buildCourseRows(firstData);
      html += '<div style="text-align:center;margin-top:10px;padding:8px;background:#1a3a2a;border-radius:8px;"><span style="color:#ffd700;font-weight:bold;">GPA: ' + escapeHtml(firstData.gpa||'N/A') + '</span></div>';
    } else {
      html += '<p class="no-result">' + (regNo ? '📭 No first semester results yet.' : '⚠️ Add your registration number in profile to see results.') + '</p>';
    }
    html += '</div>';

    // Second semester results
    html += '<div class="card"><h2>📚 Second Semester</h2>';
    if (secondData) {
      html += buildCourseRows(secondData);
      html += '<div style="text-align:center;margin-top:10px;padding:8px;background:#1a3a2a;border-radius:8px;"><span style="color:#ffd700;font-weight:bold;">GPA: ' + escapeHtml(secondData.gpa||'N/A') + '</span></div>';
    } else {
      html += '<p class="no-result">' + (regNo ? '📭 No second semester results yet.' : '⚠️ Add your registration number in profile to see results.') + '</p>';
    }
    html += '</div>';

    // Action buttons
    html += '<button class="btn" onclick="window.open(\'results.html\',\'_self\')">📊 Check Full Results</button>';
    html += '<button class="btn" onclick="window.open(\'courses.html\',\'_self\')">📖 Study Lectures</button>';
    html += '<button class="btn" onclick="window.open(\'leaderboard.html\',\'_self\')">🏆 View Leaderboard</button>';

    document.getElementById('dashContent').innerHTML = html;

  } catch(err) {
    document.getElementById('dashContent').innerHTML = '<div class="card"><p class="no-result">❌ Error loading dashboard. Please try again.</p></div>';
  }
});
</script>
<script>
// Service worker registration - auto-checks for updates and reloads when a new version is ready
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('service-worker.js?v=10', { updateViaCache: 'none' })
      .then(function(reg) {
        reg.update(); // check for a new version right away
        setInterval(function() { reg.update(); }, 30 * 60 * 1000); // re-check every 30 min while the tab is open
      })
      .catch(function() {});
  });

  var __swRefreshed = false;
  navigator.serviceWorker.addEventListener('controllerchange', function() {
    if (__swRefreshed) return;
    __swRefreshed = true;
    window.location.reload();
  });
}
</script>
</body>
</html>
