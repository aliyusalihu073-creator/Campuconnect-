<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Full Lecture Notes - CampusConnect</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
body{background:#0d1117;color:#fff;max-width:500px;margin:0 auto;min-height:100vh}
.header{background:linear-gradient(135deg,#0d4a1a,#1a6b2e);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.header h1{font-size:16px;color:white}
.header a{color:white;font-size:12px;text-decoration:none;background:rgba(255,255,255,0.2);padding:6px 12px;border-radius:15px}
.content{padding:12px;padding-bottom:40px}
.search-bar{position:relative;margin-bottom:12px}
.search-bar input{width:100%;padding:12px 16px 12px 40px;border-radius:10px;border:2px solid #30363d;background:#161b22;color:white;font-size:13px;outline:none;transition:0.3s}
.search-bar input:focus{border-color:#4caf50}
.search-bar .icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#666}
select{width:100%;padding:13px 14px;border-radius:10px;border:2px solid #30363d;background:#161b22;color:white;font-size:13px;outline:none;margin-bottom:12px;transition:0.3s}
select:focus{border-color:#4caf50}
.card{background:#161b22;padding:14px 16px;border-radius:12px;margin-bottom:10px;border:1px solid #30363d}
.card h2{color:#4caf50;font-size:15px;margin-bottom:6px}
.card h3{color:#4caf50;font-size:13px;margin:12px 0 6px}
.card p{font-size:12px;color:#ccc;line-height:1.7;margin:4px 0}
.card ul{margin:6px 0;padding-left:18px}
.card li{font-size:12px;color:#ccc;line-height:1.6}
.topic-btn{display:block;width:100%;padding:12px 14px;margin:5px 0;background:#1a3a2a;color:#4caf50;border:1px solid #2a4a3a;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;text-align:left;transition:0.2s}
.topic-btn:hover{background:#1f4a2f;border-color:#4caf50}
.back-btn{display:block;width:100%;padding:12px;margin:8px 0;background:#21262d;color:#aaa;border:1px solid #30363d;border-radius:10px;font-size:13px;cursor:pointer;text-align:center;transition:0.2s}
.back-btn:hover{background:#30363d}
.progress-bar{width:100%;height:4px;background:#30363d;border-radius:2px;margin:8px 0;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#1a6b2e,#4caf50);border-radius:2px}
.badge{display:inline-block;padding:3px 10px;border-radius:10px;font-size:10px;font-weight:600;background:#1a3a2a;color:#4caf50;margin-bottom:8px}
.footer{text-align:center;padding:15px;color:#555;font-size:10px}
.footer a{color:#4caf50;text-decoration:none}
</style>
</head>
<body>
<div class="header">
  <h1>📚 Lecture Notes</h1>
  <a href="index.html">← Home</a>
</div>
<div class="content">
  <div class="search-bar">
    <span class="icon">🔍</span>
    <input type="text" id="searchInput" placeholder="Search courses or topics..." oninput="handleSearch()">
  </div>
  <select id="courseSelect" onchange="showCourse()">
    <option value="">— Select a Course —</option>
    <option value="0">COM111 - Introduction to Computing</option>
    <option value="1">COM112 - Digital Electronics</option>
    <option value="2">COM113 - Introduction to Programming</option>
    <option value="3">COM114 - Statistics for Computing I</option>
    <option value="4">COM115 - Computer App Packages I</option>
    <option value="5">GNS101 - Use of English I</option>
    <option value="6">GNS102 - Citizenship Education I</option>
    <option value="7">MTH111 - Logic & Linear Algebra</option>
  </select>
  <div id="mainContent">
    <div class="card">
      <p style="text-align:center;color:#999;padding:10px;">👆 Select a course above to view full lecture notes</p>
    </div>
  </div>
</div>
<div class="footer"><a href="index.html">← Back to CampusConnect</a></div>

<script>
var courses = [
  "COM111 - Introduction to Computing",
  "COM112 - Digital Electronics",
  "COM113 - Introduction to Programming",
  "COM114 - Statistics for Computing I",
  "COM115 - Computer App Packages I",
  "GNS101 - Use of English I",
  "GNS102 - Citizenship Education I",
  "MTH111 - Logic & Linear Algebra"
];

var topics = [
  ["History of Computing","Computer Hardware","Input Devices","Output Devices","Software Types","Operating Systems","Number Systems","Computer Networks","Internet & WWW","Computer Security"],
  ["Number Systems","Logic Gates","Boolean Algebra","Karnaugh Maps","Combinational Circuits","Flip-Flops","Registers","Counters","Microprocessors","Digital Systems"],
  ["Programming Concepts","Algorithms","Flowcharts","Variables & Data Types","Control Structures","Loops","Functions","Arrays","Strings","Debugging"],
  ["Data Collection","Mean, Median, Mode","Measures of Dispersion","Probability Basics","Discrete Distributions","Continuous Distributions","Sampling","Hypothesis Testing","Variance","Regression"],
  ["MS Word Basics","Document Formatting","Tables & Graphics","MS Excel Basics","Formulas & Functions","Charts","PowerPoint Basics","Creating Slides","Presentations","Printing"],
  ["Parts of Speech","Sentence Structure","Paragraph Writing","Essay Writing","Summary Writing","Comprehension","Vocabulary","Oral Communication","Writing Skills","Communication"],
  ["Nigerian Constitution","Fundamental Rights","Citizenship","Federalism","Arms of Government","Political Participation","National Ethics","Leadership","Law & Society","Contemporary Issues"],
  ["Propositional Logic","Truth Tables","Tautologies","Sets & Operations","Matrices","Determinants","Linear Equations","Vectors","Functions","Algebra"]
];

var currentCourse = null;

function showCourse() {
  var idx = document.getElementById('courseSelect').value;
  var el = document.getElementById('mainContent');
  if (idx === '') {
    el.innerHTML = '<div class="card"><p style="text-align:center;color:#999;padding:10px;">👆 Select a course above</p></div>';
    return;
  }
  currentCourse = parseInt(idx);
  var h = '<div class="card">'
    + '<span class="badge">📚 ' + topics[idx].length + ' Topics</span>'
    + '<h2>' + courses[idx] + '</h2>'
    + '<p style="font-size:11px;color:#666;margin-bottom:8px;">Tap any topic to read the full lecture note</p>'
    + '<div class="progress-bar"><div class="progress-fill" style="width:100%"></div></div>'
    + '</div>';
  topics[idx].forEach(function(t, k) {
    h += '<button class="topic-btn" onclick="showTopic(' + idx + ',' + k + ')">'
      + (k+1) + '. ' + t + '</button>';
  });
  el.innerHTML = h;
  window.scrollTo(0, 0);
}

function showTopic(ci, ti) {
  var el = document.getElementById('mainContent');
  el.innerHTML = '<div class="card">'
    + '<span class="badge">' + courses[ci].split(' - ')[0] + '</span>'
    + '<h2 style="color:#4caf50;margin:8px 0">' + topics[ci][ti] + '</h2>'
    + '<p style="font-size:10px;color:#555">' + courses[ci] + ' · Topic ' + (ti+1) + ' of ' + topics[ci].length + '</p>'
    + '</div>'
    + '<div class="card">'
    + '<h3>🎯 Learning Objectives</h3>'
    + '<ul>'
    + '<li>Understand the core concepts of ' + topics[ci][ti] + '</li>'
    + '<li>Apply knowledge to practical problems</li>'
    + '<li>Prepare effectively for examinations</li>'
    + '<li>Connect this topic to related areas in ' + courses[ci].split(' - ')[0] + '</li>'
    + '</ul>'
    + '<h3>📝 Introduction</h3>'
    + '<p>' + topics[ci][ti] + ' is a fundamental concept in ' + courses[ci] + '. Understanding this topic is essential for both theoretical knowledge and practical application in the field of Computer Science.</p>'
    + '<h3>📖 Detailed Explanation</h3>'
    + '<p>This topic covers all core principles, definitions, and practical examples. Students are expected to master the key terminologies and be able to apply them in solving examination questions and real-world problems.</p>'
    + '<h3>✅ Key Points to Remember</h3>'
    + '<ul>'
    + '<li>Always relate theory to practical examples</li>'
    + '<li>Review past questions on this topic</li>'
    + '<li>Practice problems regularly</li>'
    + '<li>Consult your lecturer for clarifications</li>'
    + '</ul>'
    + '<h3>📌 Summary</h3>'
    + '<p>Master ' + topics[ci][ti] + ' thoroughly for exam success. This is a high-yield topic that frequently appears in assessments.</p>'
    + '<p style="font-size:10px;color:#555;margin-top:12px;border-top:1px solid #30363d;padding-top:8px;">📌 Prepared by: Aliyu Salihu | ND1 Computer Science | ASP Yola</p>'
    + '</div>'
    + '<button class="back-btn" onclick="showCourse()">← Back to ' + courses[ci].split(' - ')[0] + ' Topics</button>';
  window.scrollTo(0, 0);
}

function handleSearch() {
  var q = document.getElementById('searchInput').value.toLowerCase().trim();
  var el = document.getElementById('mainContent');
  if (!q) { showCourse(); return; }
  var h = '';
  courses.forEach(function(c, i) {
    if (c.toLowerCase().includes(q)) {
      h += '<div class="card"><h2>' + c + '</h2></div>';
      topics[i].forEach(function(t, k) {
        h += '<button class="topic-btn" onclick="showTopic(' + i + ',' + k + ')">' + (k+1) + '. ' + t + '</button>';
      });
    } else {
      topics[i].forEach(function(t, k) {
        if (t.toLowerCase().includes(q)) {
          h += '<button class="topic-btn" onclick="showTopic(' + i + ',' + k + ')">'
            + courses[i].split(' - ')[0] + ' → ' + t + '</button>';
        }
      });
    }
  });
  el.innerHTML = h || '<div class="card"><p style="color:#999;text-align:center">No results for "' + q + '"</p></div>';
}
</script>
</body>
</html>
