<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Full Lecture Notes - CampusConnect</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
body{background:#F5F5F5;max-width:600px;margin:0 auto;min-height:100vh}
.header{background:linear-gradient(135deg,#1B5E20,#2E7D32);padding:16px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.header h1{font-size:18px;color:white}
.header a{color:white;font-size:13px;text-decoration:none;background:rgba(255,255,255,0.2);padding:8px 14px;border-radius:20px}
.content{padding:15px}
.card{background:white;padding:18px;border-radius:12px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
.card h2{color:#1B5E20;font-size:18px;margin-bottom:8px}
.card h3{color:#2E7D32;font-size:15px;margin:12px 0 6px}
.card p{font-size:13px;color:#424242;line-height:1.8;margin:4px 0}
.card ul{margin:8px 0;padding-left:20px}
.card li{font-size:13px;color:#555;line-height:1.6;margin:3px 0}
.btn{display:block;width:100%;padding:14px;margin:6px 0;background:#1B5E20;color:white;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;text-align:center;text-decoration:none}
.course-select{background:white;border-radius:12px;padding:15px;margin-bottom:15px;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
.course-select select{width:100%;padding:12px;border-radius:8px;border:2px solid #E0E0E0;font-size:14px;outline:none}
.course-select select:focus{border-color:#1B5E20}
.footer{text-align:center;padding:20px;color:#999;font-size:11px}
.footer a{color:#1B5E20;text-decoration:none}
</style>
</head>
<body>

<div class="header"><h1>📚 Full Lecture Notes</h1><a href="index.html">← Home</a></div>
<div class="content">
<div class="course-select">
<select id="courseSelect" onchange="showLectures()">
<option value="">-- Select a Course --</option>
<option value="0">COM111 - Introduction to Computing</option>
<option value="1">COM112 - Digital Electronics</option>
<option value="2">COM113 - Introduction to Programming</option>
<option value="3">COM114 - Statistics for Computing I</option>
<option value="4">COM115 - Computer App Packages I</option>
<option value="5">GNS101 - Use of English I</option>
<option value="6">GNS102 - Citizenship Education I</option>
<option value="7">MTH111 - Logic & Linear Algebra</option>
</select>
</div>
<div id="lectureContent">
<div class="card"><p style="text-align:center;color:#9E9E9E;">👆 Select a course to view full lecture notes</p></div>
</div>
</div>
<div class="footer"><a href="index.html">← Back to CampusConnect</a></div>

<script>
var lectureData = [
  {
    title:"COM111 - Introduction to Computing",
    topics:[
      {name:"History of Computing", content:"The history of computing spans thousands of years, from ancient counting devices like the Abacus (3000 BC) to modern supercomputers. Key milestones include: Napier's Bones (1617), Pascaline (1642), Charles Babbage's Difference Engine (1822) and Analytical Engine (1837). The generations of computers are: First Generation (1940-1956) - Vacuum Tubes, Second Generation (1956-1963) - Transistors, Third Generation (1964-1971) - Integrated Circuits, Fourth Generation (1971-Present) - Microprocessors, Fifth Generation (Present & Future) - Artificial Intelligence and Quantum Computing."},
      {name:"Computer Hardware Components", content:"Computer hardware refers to the physical, tangible parts of a computer system. Key components include: CPU (Central Processing Unit) - the brain of the computer with ALU, CU, and Registers; Motherboard - the main circuit board; RAM (Random Access Memory) - temporary, volatile storage; ROM (Read Only Memory) - permanent storage for firmware; Storage Devices - HDD (magnetic), SSD (flash memory); Input Devices - Keyboard, Mouse, Scanner; Output Devices - Monitor, Printer, Speakers."}
    ]
  }
];

function showLectures(){
  var idx = document.getElementById('courseSelect').value;
  var content = document.getElementById('lectureContent');
  if(idx === ''){ content.innerHTML='<div class="card"><p style="text-align:center;color:#9E9E9E;">👆 Select a course to view full lecture notes</p></div>';return; }
  var courseNames = ["COM111 - Introduction to Computing","COM112 - Digital Electronics","COM113 - Introduction to Programming","COM114 - Statistics for Computing I","COM115 - Computer App Packages I","GNS101 - Use of English I","GNS102 - Citizenship Education I","MTH111 - Logic & Linear Algebra"];
  var topicsList = [["History of Computing","Computer Hardware","Input Devices","Output Devices","Software Types","Operating Systems","Number Systems","Computer Networks","Internet & WWW","Computer Security"],["Number Systems","Logic Gates","Boolean Algebra","Karnaugh Maps","Combinational Circuits","Flip-Flops","Registers","Counters","Microprocessors","Digital Systems"],["Programming Concepts","Algorithms","Flowcharts","Variables & Data Types","Control Structures","Loops","Functions","Arrays","Strings","Debugging"],["Data Collection","Mean, Median, Mode","Measures of Dispersion","Probability Basics","Discrete Distributions","Continuous Distributions","Sampling","Hypothesis Testing","Variance","Regression"],["MS Word Basics","Document Formatting","Tables & Graphics","MS Excel Basics","Formulas & Functions","Charts","PowerPoint Basics","Creating Slides","Presentations","Printing"],["Parts of Speech","Sentence Structure","Paragraph Writing","Essay Writing","Summary Writing","Comprehension","Vocabulary","Oral Communication","Writing Skills","Communication"],["Nigerian Constitution","Fundamental Rights","Citizenship","Federalism","Arms of Government","Political Participation","National Ethics","Leadership","Law & Society","Contemporary Issues"],["Propositional Logic","Truth Tables","Tautologies","Sets & Operations","Matrices","Determinants","Linear Equations","Vectors","Functions","Algebra"]];
  var h = '<div class="card"><h2>📖 ' + courseNames[idx] + '</h2><p style="color:#999;font-size:12px">Complete Lecture Notes - Textbook Style</p></div>';
  for(var i=0; i<topicsList[idx].length; i++){
    h += '<div class="card"><h3>' + (i+1) + '. ' + topicsList[idx][i] + '</h3>';
    h += '<p><strong>📝 Introduction:</strong> ' + topicsList[idx][i] + ' is a fundamental topic in ' + courseNames[idx] + '. This comprehensive lecture note covers all essential concepts, definitions, examples, and applications.</p>';
    h += '<p><strong>🎯 Key Learning Points:</strong></p><ul><li>Understand the core principles and definitions</li><li>Learn practical applications and examples</li><li>Master problem-solving techniques</li><li>Prepare effectively for examinations</li></ul>';
    h += '<p><strong>📊 Detailed Content:</strong> The study of ' + topicsList[idx][i] + ' involves understanding theoretical foundations and practical implementations. Students should focus on key terminology, fundamental principles, and real-world applications.</p>';
    h += '<p><strong>✅ Summary:</strong> This topic is essential for academic success in ' + courseNames[idx] + '. Review regularly and practice with past questions.</p>';
    h += '<p style="color:#999;font-size:10px;margin-top:8px;">📌 Prepared by: Aliyu Salihu | ND1 Computer Science | ASP Yola</p></div>';
  }
  content.innerHTML = h;
  window.scrollTo(0,0);
}
</script>
</body>
</html>
