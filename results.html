<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Result Checker - CampusConnect</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
body{background:#F5F5F5;max-width:500px;margin:0 auto;min-height:100vh}
.header{background:linear-gradient(135deg,#1B5E20,#2E7D32);padding:16px 20px;display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:18px;color:white}
.header a{color:white;font-size:13px;text-decoration:none;background:rgba(255,255,255,0.2);padding:8px 14px;border-radius:20px}
.content{padding:20px}
.card{background:white;padding:20px;border-radius:12px;margin-bottom:15px;box-shadow:0 2px 8px rgba(0,0,0,0.06);text-align:center}
.card h2{color:#1B5E20;margin-bottom:15px}
.card input{width:100%;padding:14px;margin:8px 0;border-radius:10px;border:2px solid #E0E0E0;font-size:14px;outline:none}
.card input:focus{border-color:#1B5E20}
.card select{width:100%;padding:14px;margin:8px 0;border-radius:10px;border:2px solid #E0E0E0;font-size:14px;outline:none;background:white}
.btn{display:block;width:100%;padding:14px;margin:10px 0;background:#1B5E20;color:white;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;text-align:center}
.result-table{width:100%;border-collapse:collapse;margin-top:10px}
.result-table th{background:#1B5E20;color:white;padding:10px;font-size:12px}
.result-table td{padding:10px;border-bottom:1px solid #E0E0E0;font-size:12px;text-align:center}
.grade-a{color:#1B5E20;font-weight:700}
.grade-b{color:#4caf50;font-weight:700}
.grade-c{color:#ff9800;font-weight:700}
.grade-f{color:#f44336;font-weight:700}
.footer{text-align:center;padding:20px;color:#999;font-size:11px}
</style>
</head>
<body>

<div class="header"><h1>📊 Result Checker</h1><a href="index.html">← Home</a></div>
<div class="content">
<div class="card">
<h2>Check Your Results</h2>
<input type="text" id="regNo" placeholder="Enter Registration Number">
<select id="semester">
<option value="">Select Semester</option>
<option value="First">First Semester</option>
<option value="Second">Second Semester</option>
</select>
<button class="btn" onclick="checkResult()">🔍 Check Result</button>
</div>
<div id="resultDisplay"></div>
</div>
<div class="footer"><a href="index.html">← Back to CampusConnect</a></div>

<script>
var sampleResults = {
  "SST/NDCOM/S/2025/186": {
    name: "Aliyu Salihu",
    level: "ND1",
    department: "Computer Science",
    First: [
      {course:"COM111", grade:"A", point:4},
      {course:"COM112", grade:"B", point:3},
      {course:"COM113", grade:"A", point:4},
      {course:"COM114", grade:"B", point:3},
      {course:"COM115", grade:"A", point:4},
      {course:"GNS101", grade:"B", point:3},
      {course:"GNS102", grade:"C", point:2},
      {course:"MTH111", grade:"A", point:4}
    ]
  }
};

function checkResult(){
  var reg = document.getElementById('regNo').value.trim();
  var sem = document.getElementById('semester').value;
  var display = document.getElementById('resultDisplay');
  
  if(!reg){ alert('Enter registration number'); return; }
  if(!sem){ alert('Select semester'); return; }
  
  if(sampleResults[reg]){
    var data = sampleResults[reg];
    var results = data[sem];
    var totalPoints = 0;
    var h = '<div class="card"><h2>📋 Result for ' + data.name + '</h2>';
    h += '<p style="color:#999;font-size:12px;">Level: ' + data.level + ' | Dept: ' + data.department + '</p>';
    h += '<p style="color:#999;font-size:12px;">Semester: ' + sem + ' Semester</p>';
    h += '<table class="result-table"><tr><th>Course</th><th>Grade</th><th>Point</th></tr>';
    for(var i=0; i<results.length; i++){
      var cls = 'grade-' + results[i].grade.toLowerCase();
      h += '<tr><td>' + results[i].course + '</td><td class="' + cls + '">' + results[i].grade + '</td><td>' + results[i].point + '</td></tr>';
      totalPoints += results[i].point;
    }
    var gpa = (totalPoints / results.length).toFixed(2);
    h += '<tr style="font-weight:700;background:#E8F5E9;"><td colspan="2">GPA</td><td>' + gpa + '</td></tr></table>';
    h += '</div>';
    display.innerHTML = h;
  } else {
    display.innerHTML = '<div class="card"><p style="color:#f44336;">❌ No result found for this registration number.</p></div>';
  }
}
</script>
</body>
</html>
