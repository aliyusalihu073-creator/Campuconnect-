<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Result Checker - CampusConnect</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
body{background:#0d1117;color:#fff;max-width:450px;margin:0 auto;min-height:100vh}
.header{background:linear-gradient(135deg,#0d4a1a,#1a6b2e);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.header h1{font-size:16px;color:white}
.header a{color:white;font-size:12px;text-decoration:none;background:rgba(255,255,255,0.2);padding:6px 12px;border-radius:15px}
.content{padding:15px;padding-bottom:40px}
.card{background:#161b22;padding:16px;border-radius:12px;margin-bottom:12px;border:1px solid #30363d}
.card h2{color:#4caf50;font-size:15px;margin-bottom:10px;text-align:center}
.card input,.card select{width:100%;padding:13px;margin:6px 0;border-radius:10px;border:2px solid #30363d;background:#0d1117;color:white;font-size:13px;outline:none;transition:0.3s}
.card input:focus,.card select:focus{border-color:#4caf50}
.btn{display:block;width:100%;padding:14px;margin:8px 0;background:linear-gradient(135deg,#0d4a1a,#1a6b2e);color:white;border:none;border-radius:10px;font-size:14px;font-weight:bold;cursor:pointer;text-align:center;transition:0.3s}
.btn:hover{opacity:0.9}
.btn:disabled{opacity:0.5;cursor:not-allowed}
table{width:100%;border-collapse:collapse;margin-top:10px}
th{background:#0d4a1a;padding:10px 8px;font-size:11px;color:white}
td{padding:10px 8px;border-bottom:1px solid #30363d;font-size:12px;text-align:center;color:#e0e0e0}
.grade-a{color:#4caf50;font-weight:bold}
.grade-b{color:#8bc34a;font-weight:bold}
.grade-c{color:#ff9800;font-weight:bold}
.grade-d{color:#f44336;font-weight:bold}
.gpa-row{font-weight:bold;background:#1a3a2a}
.gpa-row td{color:#ffd700;font-size:14px}
.info-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #30363d;font-size:12px}
.info-row span:first-child{color:#999}
.info-row span:last-child{color:#e0e0e0;font-weight:600}
.skeleton{background:linear-gradient(90deg,#161b22 25%,#21262d 50%,#161b22 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:8px;height:20px;margin:6px 0}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.error-msg{color:#f44336;text-align:center;padding:20px;font-size:13px}
.success-badge{display:inline-block;background:#1a3a2a;color:#4caf50;padding:4px 10px;border-radius:20px;font-size:10px;font-weight:600;margin-bottom:8px}
.footer{text-align:center;padding:15px;color:#555;font-size:10px}
.footer a{color:#4caf50;text-decoration:none}
</style>
</head>
<body>
<div class="header">
  <h1>📊 Result Checker</h1>
  <a href="index.html">← Home</a>
</div>
<div class="content">
  <div class="card">
    <h2>🔍 Check Your Results</h2>
    <input type="text" id="regNo" placeholder="Registration Number (e.g. SST/NDCOM/S/2025/186)">
    <select id="semester">
      <option value="">Select Semester</option>
      <option value="First">First Semester</option>
      <option value="Second">Second Semester</option>
    </select>
    <button class="btn" id="checkBtn" onclick="checkResult()">🔍 Check Result</button>
  </div>
  <div id="resultDisplay"></div>
</div>
<div class="footer"><a href="index.html">← Back to CampusConnect</a></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";
import { getFirestore, doc, getDoc }
  from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyB553_waOZcKoyvIdF7NsIH7EpjjbUeP68",
  authDomain: "campuconnect-bd52f.firebaseapp.com",
  projectId: "campuconnect-bd52f",
  storageBucket: "campuconnect-bd52f.firebasestorage.app",
  messagingSenderId: "762013163609",
  appId: "1:762013163609:web:7f565fbde05a4ad35ed148"
});
const db = getFirestore(app);

window.checkResult = async function() {
  var reg = document.getElementById('regNo').value.trim();
  var sem = document.getElementById('semester').value;
  var d = document.getElementById('resultDisplay');
  var btn = document.getElementById('checkBtn');

  if (!reg || !sem) { d.innerHTML = '<div class="card"><p class="error-msg">⚠️ Please fill all fields.</p></div>'; return; }

  // Show skeleton loading
  d.innerHTML = '<div class="card"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton" style="height:120px"></div></div>';
  btn.disabled = true;
  btn.innerHTML = '⏳ Checking...';

  try {
    // Document ID: regNo with slashes replaced + semester
    var docId = reg.replace(/\//g, '_') + '_' + sem;
    var snap = await getDoc(doc(db, 'results', docId));

    btn.disabled = false;
    btn.innerHTML = '🔍 Check Result';

    if (!snap.exists()) {
      d.innerHTML = '<div class="card"><p class="error-msg">❌ No result found for <strong>' + reg + '</strong> — ' + sem + ' Semester.<br><br><span style="font-size:11px;color:#999">Make sure your registration number is correct.</span></p></div>';
      return;
    }

    var data = snap.data();
    var courses = data.courses || [];
    var totalPoints = 0;
    var gradeRows = '';

    courses.forEach(function(c) {
      var grade = (c.grade || '').toUpperCase();
      var gradeClass = grade === 'A' ? 'grade-a' : grade === 'B' ? 'grade-b' : grade === 'C' ? 'grade-c' : 'grade-d';
      totalPoints += Number(c.point) || 0;
      gradeRows += '<tr><td>' + c.course + '</td><td class="' + gradeClass + '">' + grade + '</td><td>' + c.point + '</td></tr>';
    });

    var gpa = courses.length > 0 ? (totalPoints / courses.length).toFixed(2) : '0.00';
    var gpaNum = parseFloat(gpa);
    var standing = gpaNum >= 3.5 ? '🏆 Distinction' : gpaNum >= 3.0 ? '⭐ Upper Credit' : gpaNum >= 2.0 ? '✅ Lower Credit' : gpaNum >= 1.0 ? '⚠️ Pass' : '❌ Fail';

    d.innerHTML = '<div class="card">'
      + '<div style="text-align:center;margin-bottom:12px"><span class="success-badge">✅ Result Found</span></div>'
      + '<div class="info-row"><span>👤 Name</span><span>' + (data.name || 'N/A') + '</span></div>'
      + '<div class="info-row"><span>📋 Reg No</span><span>' + (data.regNo || reg) + '</span></div>'
      + '<div class="info-row"><span>📚 Semester</span><span>' + sem + ' Semester</span></div>'
      + '<div class="info-row"><span>🎯 Standing</span><span>' + standing + '</span></div>'
      + '<table><tr><th>Course</th><th>Grade</th><th>Points</th></tr>'
      + gradeRows
      + '<tr class="gpa-row"><td colspan="2">📊 GPA</td><td>' + gpa + '</td></tr>'
      + '</table></div>';

  } catch(err) {
    btn.disabled = false;
    btn.innerHTML = '🔍 Check Result';
    d.innerHTML = '<div class="card"><p class="error-msg">❌ Error loading results. Please check your connection and try again.</p></div>';
  }
};
</script>
</body>
</html>
