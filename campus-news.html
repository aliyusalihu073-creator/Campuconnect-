<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campus News</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f5f5;max-width:500px;margin:0 auto;padding:0}
.top{background:#1B5E20;color:white;padding:15px;text-align:center;font-size:20px;font-weight:bold}
.box{padding:15px}
.card{background:white;padding:15px;border-radius:10px;margin:10px 0;border-left:4px solid #1B5E20}
.card h3{color:#1B5E20;margin:0 0 5px 0;font-size:16px}
.card .date{color:#999;font-size:11px;margin:0 0 8px 0}
.card .body{font-size:13px;color:#444;line-height:1.5;margin-bottom:8px}
.card .cat{background:#e8f5e9;color:#1B5E20;padding:3px 10px;border-radius:12px;font-size:10px;display:inline-block;margin-bottom:8px}
.card .author{font-size:10px;color:#999;font-style:italic;margin-top:8px}
.card img{width:100%;border-radius:8px;margin-top:8px}
.card iframe{width:100%;height:200px;border-radius:8px;margin-top:8px}
.card video{width:100%;border-radius:8px;margin-top:8px;max-height:300px}
.card audio{width:100%;margin-top:8px}
.btn{display:block;width:100%;padding:14px;margin:8px 0;background:#1B5E20;color:white;border:none;border-radius:8px;font-size:14px;cursor:pointer;text-align:center}
.back{text-align:center;padding:20px}
.back a{color:#1B5E20;font-weight:bold}
</style>
</head>
<body>

<div class="top">📰 Campus News</div>

<div class="box" id="newsBox">
    <p style="text-align:center;color:#999;padding:40px;">Loading...</p>
</div>

<div class="back">
    <a href="index.html">← Back to CampusConnect</a>
</div>

<script>
var SID = "13RLLmcXk6BAZBWAxgiHcy_BwOAhhpPxwLQb1W12uyLg";
var URL = "https://docs.google.com/spreadsheets/d/" + SID + "/gviz/tq?tqx=out:csv&sheet=Sheet1";

function cleanStr(s){
    if(!s) return "";
    s = s.replace(/^"/,"").replace(/"$/,"").trim();
    return s;
}

function isVideoFile(url){
    return url.match(/\.(mp4|webm|ogg|mov|avi|mkv)$/i);
}

function isAudioFile(url){
    return url.match(/\.(mp3|wav|m4a|ogg|flac)$/i);
}

function isYouTube(url){
    return url.indexOf("youtube.com") >= 0 || url.indexOf("youtu.be") >= 0;
}

function getYouTubeID(url){
    if(url.indexOf("youtu.be") >= 0){
        return url.split("/").pop().split("?")[0];
    }
    if(url.indexOf("youtube.com") >= 0){
        var v = url.split("v=")[1];
        if(v && v.indexOf("&") >= 0) v = v.split("&")[0];
        return v;
    }
    return "";
}

fetch(URL)
.then(function(r){ return r.text(); })
.then(function(csv){
    var lines = csv.split("\n");
    var articles = [];
    
    for(var i = 1; i < lines.length; i++){
        if(lines[i].trim() === "") continue;
        var cols = lines[i].split(",");
        if(cols.length >= 9){
            var article = {
                title: cleanStr(cols[0]),
                date: cleanStr(cols[1]),
                body: cleanStr(cols[2]),
                image: cleanStr(cols[3]),
                video: cleanStr(cols[4]),
                audio: cleanStr(cols[5]),
                cat: cleanStr(cols[6]),
                author: cleanStr(cols[7]),
                status: cleanStr(cols[8])
            };
            if(article.status.toLowerCase() !== "draft"){
                articles.push(article);
            }
        }
    }
    
    var html = '<button class="btn" onclick="location.reload()">🔄 Refresh News</button>';
    
    if(articles.length === 0){
        html += '<div class="card"><p style="text-align:center;color:#999;">No published announcements yet.</p></div>';
    } else {
        for(var a = 0; a < articles.length; a++){
            var art = articles[a];
            html += '<div class="card">';
            
            // Category
            if(art.cat) html += '<span class="cat">' + art.cat + '</span>';
            
            // Title
            if(art.title) html += '<h3>' + art.title + '</h3>';
            
            // Date
            html += '<div class="date">📅 ' + art.date + '</div>';
            
            // Body
            if(art.body) html += '<div class="body">' + art.body + '</div>';
            
            // Image
            if(art.image && art.image.length > 10){
                html += '<img src="' + art.image + '" onerror="this.style.display=\'none\'">';
            }
            
            // Video
            if(art.video && art.video.length > 5){
                if(isYouTube(art.video)){
                    var ytid = getYouTubeID(art.video);
                    if(ytid) html += '<iframe src="https://www.youtube.com/embed/' + ytid + '" frameborder="0" allowfullscreen></iframe>';
                } else if(isVideoFile(art.video)){
                    html += '<video controls src="' + art.video + '"></video>';
                } else {
                    html += '<a href="' + art.video + '" target="_blank" style="color:#1B5E20;">🎥 Watch Video</a>';
                }
            }
            
            // Audio
            if(art.audio && art.audio.length > 5){
                if(isAudioFile(art.audio)){
                    html += '<audio controls src="' + art.audio + '"></audio>';
                } else {
                    html += '<a href="' + art.audio + '" target="_blank" style="color:#1B5E20;">🎵 Listen to Audio</a>';
                }
            }
            
            // Author
            if(art.author) html += '<div class="author">✍️ ' + art.author + '</div>';
            
            html += '</div>';
        }
    }
    
    document.getElementById("newsBox").innerHTML = html;
})
.catch(function(){
    document.getElementById("newsBox").innerHTML = '<div class="card"><p style="text-align:center;color:red;">Error loading. Check internet.</p></div>';
});
</script>
</body>
</html>
