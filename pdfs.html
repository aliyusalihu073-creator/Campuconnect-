<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDFs & Resources - CampusConnect</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
body{background:#0d1117;color:#fff;max-width:480px;margin:0 auto;min-height:100vh}
.header{background:linear-gradient(135deg,#0d4a1a,#1a6b2e);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.header h1{font-size:16px;color:white}
.header a{color:white;font-size:12px;text-decoration:none;background:rgba(255,255,255,0.2);padding:6px 12px;border-radius:15px}
.content{padding:15px;padding-bottom:40px}
.search-bar{position:relative;margin-bottom:12px}
.search-bar input{width:100%;padding:12px 16px 12px 40px;border-radius:10px;border:2px solid #30363d;background:#161b22;color:white;font-size:13px;outline:none;transition:0.3s}
.search-bar input:focus{border-color:#4caf50}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#666}
.filter-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filter-btn{padding:7px 13px;border:1px solid #30363d;background:#161b22;color:#aaa;border-radius:20px;font-size:11px;cursor:pointer;transition:0.2s}
.filter-btn.active,.filter-btn:hover{background:#1a3a2a;color:#4caf50;border-color:#4caf50}
.doc-card{background:#161b22;border-radius:12px;padding:14px;margin-bottom:10px;border:1px solid #30363d;transition:0.2s}
.doc-card:hover{border-color:#4caf50}
.doc-top{display:flex;align-items:center;gap:12px}
.doc-icon{font-size:30px;flex-shrink:0}
.doc-info{flex:1;min-width:0}
.doc-title{font-size:13px;font-weight:700;color:#e0e0e0;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc-meta{font-size:10px;color:#666}
.doc-cat{display:inline-block;padding:2px 8px;border-radius:8px;font-size:9px;font-weight:700;background:#1a3a2a;color:#4caf50;margin-top:4px}
.doc-actions{display:flex;gap:8px;margin-top:10px}
.doc-btn{flex:1;padding:9px;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;transition:0.2s;text-align:center}
.btn-open{background:linear-gradient(135deg,#0d4a1a,#1a6b2e);color:white}
.btn-open:hover{opacity:0.9}
.btn-dl{background:#21262d;color:#4caf50;border:1px solid #30363d}
.btn-dl:hover{background:#1a3a2a}

/* PDF VIEWER MODAL */
.viewer-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.97);z-index:9999;flex-direction:column}
.viewer-overlay.show{display:flex}
.viewer-header{background:#0d4a1a;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.viewer-title{font-size:14px;font-weight:700;color:white;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-right:10px}
.viewer-header-btns{display:flex;gap:8px;flex-shrink:0}
.viewer-header-btns button{padding:7px 12px;border:none;border-radius:8px;font-size:11px;font-weight:600;cursor:pointer}
.close-viewer{background:rgba(255,255,255,0.2);color:white}
.dl-viewer{background:#ffd700;color:#000}
.viewer-frame{flex:1;width:100%;border:none;background:#1a1a1a}
.viewer-loading{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:12px;color:#4caf50}
.spinner{width:40px;height:40px;border:3px solid rgba(76,175,80,0.2);border-top-color:#4caf50;border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.skeleton{background:linear-gradient(90deg,#161b22 25%,#21262d 50%,#161b22 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:12px;height:90px;margin:8px 0}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.empty{text-align:center;color:#555;padding:40px;font-size:13px}
.count-badge{background:#1a3a2a;color:#4caf50;padding:4px 10px;border-radius:10px;font-size:11px;font-weight:600;display:inline-block;margin-bottom:10px}
.footer{text-align:center;padding:15px;color:#555;font-size:10px}
.footer a{color:#4caf50;text-decoration:none}
</style>
</head>
<body>

<div class="header">
  <h1>📚 PDFs & Resources</h1>
  <a href="index.html">← Home</a>
</div>

<div class="content">
  <div class="search-bar">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" placeholder="Search documents..." oninput="filterDocs()">
  </div>
  <div class="filter-bar">
    <button class="filter-btn active" onclick="setFilter('All',this)">All</button>
    <button class="filter-btn" onclick="setFilter('Lecture Notes',this)">📖 Notes</button>
    <button class="filter-btn" onclick="setFilter('Past Questions',this)">📝 Past Q</button>
    <button class="filter-btn" onclick="setFilter('Textbook',this)">📚 Books</button>
    <button class="filter-btn" onclick="setFilter('Other',this)">📄 Other</button>
  </div>
  <div id="countBar"></div>
  <div id="docsContainer">
    <div class="skeleton"></div>
    <div class="skeleton"></div>
    <div class="skeleton"></div>
  </div>
</div>

<div class="footer"><a href="index.html">← Back to CampusConnect</a></div>

<!-- PDF VIEWER MODAL -->
<div class="viewer-overlay" id="viewerOverlay">
  <div class="viewer-header">
    <div class="viewer-title" id="viewerTitle">Document</div>
    <div class="viewer-header-btns">
      <button class="dl-viewer" onclick="downloadCurrent()">📥 Download</button>
      <button class="close-viewer" onclick="closeViewer()">✕ Close</button>
    </div>
  </div>
  <div class="viewer-loading" id="viewerLoading">
    <div class="spinner"></div>
    <p style="font-size:13px">Opening document...</p>
  </div>
  <iframe class="viewer-frame" id="viewerFrame" src="" style="display:none"
    onload="document.getElementById('viewerLoading').style.display='none';this.style.display='block'">
  </iframe>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";
import { getFirestore, collection, getDocs, query, orderBy }
  from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyB553_waOZcKoyvIdF7NsIH7EpjjbUeP68",
  authDomain:"campuconnect-bd52f.firebaseapp.com",
  projectId:"campuconnect-bd52f",
  storageBucket:"campuconnect-bd52f.firebasestorage.app",
  messagingSenderId:"762013163609",
  appId:"1:762013163609:web:7f565fbde05a4ad35ed148"
});
const db = getFirestore(app);

var allDocs = [];
var currentFilter = 'All';
var currentDownloadUrl = '';

function getDocIcon(fileName) {
  if (!fileName) return '📄';
  var ext = (fileName.split('.').pop() || '').toLowerCase();
  if (ext === 'pdf') return '📕';
  if (['doc','docx'].includes(ext)) return '📘';
  if (['ppt','pptx'].includes(ext)) return '📙';
  if (ext === 'txt') return '📝';
  return '📄';
}

function formatDate(ts) {
  if (!ts) return '';
  try {
    var d = ts.seconds ? new Date(ts.seconds * 1000) : new Date(ts);
    return d.toLocaleDateString('en-US', {day:'numeric', month:'short', year:'numeric'});
  } catch(e) { return ''; }
}

// Convert any Google Drive link to embed/preview URL
function toViewUrl(url) {
  if (!url) return url;
  // Already a preview link
  if (url.includes('/preview')) return url;
  // Google Drive file share link
  if (url.includes('drive.google.com/file/d/')) {
    var id = url.split('/d/')[1].split('/')[0];
    return 'https://drive.google.com/file/d/' + id + '/preview';
  }
  // Google Drive open?id= link
  if (url.includes('drive.google.com/open?id=')) {
    var id = url.split('id=')[1].split('&')[0];
    return 'https://drive.google.com/file/d/' + id + '/preview';
  }
  // Firebase Storage or direct PDF — use Google Docs viewer
  if (url.includes('.pdf') || url.includes('firebasestorage')) {
    return 'https://docs.google.com/viewer?url=' + encodeURIComponent(url) + '&embedded=true';
  }
  return url;
}

// Convert Google Drive link to direct download link
function toDownloadUrl(url, originalUrl) {
  var src = originalUrl || url;
  if (src.includes('drive.google.com/file/d/')) {
    var id = src.split('/d/')[1].split('/')[0];
    return 'https://drive.google.com/uc?export=download&id=' + id;
  }
  if (src.includes('drive.google.com/open?id=')) {
    var id = src.split('id=')[1].split('&')[0];
    return 'https://drive.google.com/uc?export=download&id=' + id;
  }
  return src;
}

window.openDoc = function(viewUrl, title, downloadUrl) {
  currentDownloadUrl = downloadUrl;
  document.getElementById('viewerTitle').innerHTML = title;
  document.getElementById('viewerLoading').style.display = 'flex';
  document.getElementById('viewerFrame').style.display = 'none';
  document.getElementById('viewerFrame').src = viewUrl;
  document.getElementById('viewerOverlay').classList.add('show');
};

window.closeViewer = function() {
  document.getElementById('viewerOverlay').classList.remove('show');
  document.getElementById('viewerFrame').src = '';
};

window.downloadCurrent = function() {
  if (currentDownloadUrl) window.open(currentDownloadUrl, '_blank');
};

window.setFilter = function(cat, btn) {
  currentFilter = cat;
  document.querySelectorAll('.filter-btn').forEach(function(b){ b.classList.remove('active'); });
  if (btn) btn.classList.add('active');
  renderDocs();
};

window.filterDocs = function() { renderDocs(); };

function renderDocs() {
  var q = document.getElementById('searchInput').value.toLowerCase().trim();
  var filtered = allDocs.filter(function(d) {
    var matchCat = currentFilter === 'All' || d.category === currentFilter;
    var matchQ = !q || (d.title||'').toLowerCase().includes(q) || (d.author||'').toLowerCase().includes(q) || (d.category||'').toLowerCase().includes(q);
    return matchCat && matchQ;
  });

  document.getElementById('countBar').innerHTML = '<span class="count-badge">📄 ' + filtered.length + ' document' + (filtered.length !== 1 ? 's' : '') + '</span>';

  if (filtered.length === 0) {
    document.getElementById('docsContainer').innerHTML = '<div class="empty">📭 No documents found.<br><span style="font-size:11px">Check back later or try a different filter.</span></div>';
    return;
  }

  var h = '';
  filtered.forEach(function(d) {
    var viewUrl = toViewUrl(d.fileUrl);
    var dlUrl = toDownloadUrl(d.fileUrl, d.originalUrl);
    var icon = getDocIcon(d.fileName);
    h += '<div class="doc-card">'
      + '<div class="doc-top">'
      + '<div class="doc-icon">' + icon + '</div>'
      + '<div class="doc-info">'
      + '<div class="doc-title">' + (d.title || 'Document') + '</div>'
      + '<div class="doc-meta">✍️ ' + (d.author||'Admin') + (d.createdAt ? ' · 📅 ' + formatDate(d.createdAt) : '') + '</div>'
      + '<span class="doc-cat">' + (d.category || 'Other') + '</span>'
      + '</div></div>'
      + '<div class="doc-actions">'
      + '<button class="doc-btn btn-open" onclick="openDoc(\'' + viewUrl.replace(/'/g,"\\'") + '\',\'' + (d.title||'Document').replace(/'/g,"\\'") + '\',\'' + dlUrl.replace(/'/g,"\\'") + '\')">👁️ Open PDF</button>'
      + '<button class="doc-btn btn-dl" onclick="window.open(\'' + dlUrl.replace(/'/g,"\\'") + '\',\'_blank\')">📥 Download</button>'
      + '</div></div>';
  });
  document.getElementById('docsContainer').innerHTML = h;
}

async function loadDocs() {
  try {
    var q = query(collection(db, 'documents'), orderBy('createdAt', 'desc'));
    var snap = await getDocs(q);
    allDocs = [];
    snap.forEach(function(d) {
      var data = d.data(); data.id = d.id; allDocs.push(data);
    });
    renderDocs();
  } catch(err) {
    document.getElementById('docsContainer').innerHTML = '<div class="empty">❌ Could not load documents.<br>Please check your connection.</div>';
  }
}

loadDocs();
</script>
<script>
// Service worker registration - auto-checks for updates and reloads when a new version is ready
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('service-worker.js?v=10', { updateViaCache: 'none' })
      .then(function(reg) {
        reg.update(); // check for a new version right away
        setInterval(function() { reg.update(); }, 30 * 60 * 1000); // re-check every 30 min while the tab is open
      })
      .catch(function() {});
  });

  var __swRefreshed = false;
  navigator.serviceWorker.addEventListener('controllerchange', function() {
    if (__swRefreshed) return;
    __swRefreshed = true;
    window.location.reload();
  });
}
</script>
</body>
</html>
