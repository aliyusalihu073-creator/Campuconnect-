<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Voting - CampusConnect</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
body{background:#0a0a0a;color:#fff;max-width:500px;margin:0 auto;min-height:100vh}
.header{background:linear-gradient(135deg,#1B5E20,#2E7D32);padding:16px 20px;display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:18px;color:white}
.header a{color:white;font-size:12px;text-decoration:none;background:rgba(255,255,255,0.2);padding:8px 14px;border-radius:20px}
.content{padding:15px;padding-bottom:40px}
.card{background:#1a1a2e;padding:18px;border-radius:14px;margin-bottom:14px;border:1px solid #2a2a3e}
.card h2{color:#4caf50;font-size:15px;margin-bottom:14px}
label{display:block;color:#aaa;font-size:11px;font-weight:600;margin-bottom:4px;margin-top:12px}
input,select,textarea{width:100%;padding:12px 14px;border-radius:10px;border:2px solid #333;background:#0d0d1a;color:white;font-size:13px;outline:none;transition:0.3s}
input:focus,select:focus,textarea:focus{border-color:#4caf50}

/* TYPE SELECTOR */
.type-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.type-card{border:2px solid #333;border-radius:10px;padding:12px 8px;text-align:center;cursor:pointer;transition:0.2s;background:#0d0d1a}
.type-card:hover{border-color:#4caf50}
.type-card.selected{border-color:#4caf50;background:#1a3a2a}
.type-card .t-icon{font-size:24px;margin-bottom:4px}
.type-card .t-label{font-size:11px;font-weight:700;color:#4caf50}

/* OPTIONS */
.option-row{display:flex;gap:8px;margin:5px 0;align-items:center}
.option-row input{flex:1;margin:0}
.option-row button{background:#2a0d0d;color:#f44336;border:1px solid #3a1a1a;padding:9px 12px;border-radius:8px;font-size:14px;cursor:pointer;flex-shrink:0}
.add-opt-btn{background:#1a3a2a;color:#4caf50;border:1px dashed #4caf50;width:100%;padding:9px;border-radius:8px;cursor:pointer;font-size:12px;margin-top:4px}

/* POLL LIST */
.poll-item{background:#0d0d1a;border-radius:12px;padding:14px;margin:8px 0;border:1px solid #2a2a3e}
.poll-title{font-size:13px;font-weight:700;color:#e0e0e0;margin-bottom:4px}
.poll-meta{font-size:10px;color:#555;margin-bottom:8px}
.poll-type{display:inline-block;padding:2px 8px;border-radius:8px;font-size:9px;font-weight:700;background:#1a3a2a;color:#4caf50;margin-bottom:6px}
.poll-status{display:inline-block;padding:2px 8px;border-radius:8px;font-size:9px;font-weight:700;margin-left:4px}
.status-open{background:#1a3a2a;color:#4caf50}
.status-closed{background:#2a1a1a;color:#f44336}
.poll-actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.poll-btn{padding:7px 12px;border:none;border-radius:8px;font-size:11px;font-weight:600;cursor:pointer}
.btn-view{background:#1a3a2a;color:#4caf50}
.btn-close{background:#2a1a10;color:#ff9800}
.btn-open{background:#1a3a2a;color:#4caf50}
.btn-del{background:#2a0d0d;color:#f44336}

/* RESULTS BAR */
.result-option{margin:6px 0}
.result-label{display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px;color:#ccc}
.result-bar{height:10px;background:#21262d;border-radius:5px;overflow:hidden}
.result-fill{height:100%;background:linear-gradient(90deg,#1a6b2e,#4caf50);border-radius:5px;transition:width 0.5s}

.btn{display:block;width:100%;padding:14px;margin:10px 0;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;text-align:center;color:white;transition:0.3s}
.btn-green{background:linear-gradient(135deg,#1B5E20,#2E7D32)}
.btn-green:disabled{opacity:0.5;cursor:not-allowed}
.skeleton{background:linear-gradient(90deg,#1a1a2e 25%,#21262d 50%,#1a1a2e 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:10px;height:80px;margin:8px 0}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.toast{position:fixed;top:20px;right:20px;padding:12px 18px;border-radius:10px;font-size:12px;font-weight:600;z-index:9999;animation:slideIn 0.3s ease;max-width:280px}
.toast.success{background:#1a3a2a;color:#4caf50;border:1px solid #4caf50}
.toast.error{background:#2a1a1a;color:#f44336;border:1px solid #f44336}
@keyframes slideIn{from{transform:translateX(110%)}to{transform:translateX(0)}}
.empty{text-align:center;color:#555;padding:20px;font-size:12px}
</style>
</head>
<body>
<div id="authGate" style="position:fixed;inset:0;background:#0a0a0a;z-index:99999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;font-family:'Segoe UI',Arial,sans-serif">
  <div style="width:36px;height:36px;border:3px solid rgba(76,175,80,0.2);border-top-color:#4caf50;border-radius:50%;animation:authSpin 0.8s linear infinite"></div>
  <p style="color:#4caf50;font-size:13px">Verifying admin access...</p>
</div>
<style>@keyframes authSpin{to{transform:rotate(360deg)}}</style>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";
const __guardApp = initializeApp({
  apiKey: "AIzaSyB553_waOZcKoyvIdF7NsIH7EpjjbUeP68",
  authDomain: "campuconnect-bd52f.firebaseapp.com",
  projectId: "campuconnect-bd52f",
  storageBucket: "campuconnect-bd52f.firebasestorage.app",
  messagingSenderId: "762013163609",
  appId: "1:762013163609:web:7f565fbde05a4ad35ed148"
}, "authGuard");
const __guardAuth = getAuth(__guardApp);
const ADMIN_EMAILS = ['aliyusalihu@gmail.com', 'admin@campusconnect.com', 'aliyusalihu073@gmail.com'];
onAuthStateChanged(__guardAuth, function(user) {
  var gate = document.getElementById('authGate');
  if (!user) { window.location.href = 'login.html'; return; }
  if (!ADMIN_EMAILS.includes(user.email)) {
    gate.innerHTML = '<div style="text-align:center;padding:30px">'
      + '<p style="font-size:40px">🚫</p>'
      + '<p style="color:#f44336;font-size:16px;margin:10px 0">Access Denied</p>'
      + '<p style="color:#999;font-size:12px">You do not have admin privileges.</p>'
      + '<a href="index.html" style="display:inline-block;margin-top:16px;background:#0d4a1a;color:white;padding:10px 20px;border-radius:10px;text-decoration:none;font-size:13px">← Go Home</a>'
      + '</div>';
    return;
  }
  gate.remove();
});
</script>

<div class="header"><h1>🗳️ Voting Manager</h1><a href="admin.html">← Admin</a></div>
<div class="content">

  <!-- CREATE POLL -->
  <div class="card">
    <h2>➕ Create New Poll</h2>

    <label>🏷️ Poll Type</label>
    <div class="type-grid">
      <div class="type-card" onclick="selectType('election',this)">
        <div class="t-icon">🏆</div>
        <div class="t-label">Election</div>
        <div style="font-size:9px;color:#666;margin-top:2px">Class Rep etc.</div>
      </div>
      <div class="type-card" onclick="selectType('poll',this)">
        <div class="t-icon">📊</div>
        <div class="t-label">General Poll</div>
        <div style="font-size:9px;color:#666;margin-top:2px">Any question</div>
      </div>
      <div class="type-card" onclick="selectType('award',this)">
        <div class="t-icon">🎓</div>
        <div class="t-label">Best Student</div>
        <div style="font-size:9px;color:#666;margin-top:2px">Award voting</div>
      </div>
      <div class="type-card" onclick="selectType('custom',this)">
        <div class="t-icon">✏️</div>
        <div class="t-label">Custom</div>
        <div style="font-size:9px;color:#666;margin-top:2px">Your own type</div>
      </div>
    </div>
    <input type="hidden" id="pollType" value="">

    <label>❓ Poll Question / Title *</label>
    <input type="text" id="pollTitle" placeholder="e.g. Who should be Class Rep?">

    <label>📝 Description (optional)</label>
    <input type="text" id="pollDesc" placeholder="e.g. Vote for your preferred class representative">

    <label>📅 End Date (optional)</label>
    <input type="date" id="pollEnd">

    <label>🗳️ Options / Candidates * <span style="color:#555;font-weight:400">(min 2)</span></label>
    <div id="optionsContainer">
      <div class="option-row">
        <input type="text" placeholder="Option 1 (e.g. Aliyu Salihu)">
        <button onclick="removeOption(this)">✕</button>
      </div>
      <div class="option-row">
        <input type="text" placeholder="Option 2 (e.g. Musa Ibrahim)">
        <button onclick="removeOption(this)">✕</button>
      </div>
    </div>
    <button class="add-opt-btn" onclick="addOption()">+ Add Option</button>

    <button class="btn btn-green" id="createBtn" onclick="createPoll()">🗳️ Create Poll</button>
  </div>

  <!-- ACTIVE POLLS -->
  <div class="card">
    <h2>📋 All Polls <button onclick="loadPolls()" style="background:#1a3a2a;color:#4caf50;border:none;padding:6px 12px;border-radius:8px;font-size:11px;cursor:pointer;margin-left:8px">🔄 Refresh</button></h2>
    <div id="pollsList"><div class="skeleton"></div><div class="skeleton"></div></div>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, query, orderBy, getDoc }
  from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyB553_waOZcKoyvIdF7NsIH7EpjjbUeP68",
  authDomain:"campuconnect-bd52f.firebaseapp.com",
  projectId:"campuconnect-bd52f",
  storageBucket:"campuconnect-bd52f.firebasestorage.app",
  messagingSenderId:"762013163609",
  appId:"1:762013163609:web:7f565fbde05a4ad35ed148"
});
const db = getFirestore(app);

function showToast(msg,type){
  var t=document.createElement('div');t.className='toast '+(type||'success');t.innerHTML=msg;
  document.body.appendChild(t);setTimeout(function(){t.remove();},4000);
}

// TYPE SELECT
window.selectType = function(type, el) {
  document.getElementById('pollType').value = type;
  document.querySelectorAll('.type-card').forEach(function(c){c.classList.remove('selected');});
  el.classList.add('selected');
  // Auto-fill placeholder based on type
  var ph = {
    election:'Who should be Class Representative?',
    poll:'What is your favourite course?',
    award:'Who is the Best Student of the Year?',
    custom:'Enter your question here'
  };
  document.getElementById('pollTitle').placeholder = ph[type]||'';
};

// ADD/REMOVE OPTIONS
window.addOption = function() {
  var count = document.querySelectorAll('#optionsContainer .option-row').length + 1;
  var row = document.createElement('div');
  row.className = 'option-row';
  row.innerHTML = '<input type="text" placeholder="Option '+count+'">'
    + '<button onclick="removeOption(this)">✕</button>';
  document.getElementById('optionsContainer').appendChild(row);
};

window.removeOption = function(btn) {
  var rows = document.querySelectorAll('#optionsContainer .option-row');
  if (rows.length <= 2) { showToast('⚠️ Minimum 2 options required','error'); return; }
  btn.closest('.option-row').remove();
};

// CREATE POLL
window.createPoll = async function() {
  var title = document.getElementById('pollTitle').value.trim();
  var desc = document.getElementById('pollDesc').value.trim();
  var type = document.getElementById('pollType').value;
  var endDate = document.getElementById('pollEnd').value;

  if (!title) { showToast('⚠️ Please enter a poll title','error'); return; }
  if (!type) { showToast('⚠️ Please select a poll type','error'); return; }

  var optInputs = document.querySelectorAll('#optionsContainer .option-row input');
  var options = [];
  optInputs.forEach(function(inp){
    var v = inp.value.trim();
    if (v) options.push({ text: v, votes: 0 });
  });

  if (options.length < 2) { showToast('⚠️ Please add at least 2 options','error'); return; }

  var btn = document.getElementById('createBtn');
  btn.disabled = true; btn.innerHTML = '⏳ Creating...';

  try {
    await addDoc(collection(db,'polls'),{
      title: title,
      description: desc,
      type: type,
      options: options,
      status: 'open',
      totalVotes: 0,
      endDate: endDate || null,
      createdAt: new Date()
    });
    showToast('✅ Poll created! Students can now vote.','success');
    // Reset form
    document.getElementById('pollTitle').value='';
    document.getElementById('pollDesc').value='';
    document.getElementById('pollEnd').value='';
    document.getElementById('pollType').value='';
    document.querySelectorAll('.type-card').forEach(function(c){c.classList.remove('selected');});
    document.getElementById('optionsContainer').innerHTML=
      '<div class="option-row"><input type="text" placeholder="Option 1"><button onclick="removeOption(this)">✕</button></div>'
      +'<div class="option-row"><input type="text" placeholder="Option 2"><button onclick="removeOption(this)">✕</button></div>';
    loadPolls();
  } catch(e){ showToast('❌ Error: '+e.message,'error'); }
  btn.disabled=false; btn.innerHTML='🗳️ Create Poll';
};

// LOAD POLLS
window.loadPolls = async function() {
  var el = document.getElementById('pollsList');
  el.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div>';
  try {
    var q = query(collection(db,'polls'), orderBy('createdAt','desc'));
    var snap = await getDocs(q);
    if (snap.empty) { el.innerHTML='<div class="empty">📭 No polls created yet.</div>'; return; }

    var h = '';
    snap.forEach(function(d){
      var p = d.data();
      var totalVotes = p.totalVotes || 0;
      var typeLabels = {election:'🏆 Election',poll:'📊 Poll',award:'🎓 Award',custom:'✏️ Custom'};
      var statusClass = p.status==='open'?'status-open':'status-closed';
      var statusLabel = p.status==='open'?'🟢 Open':'🔴 Closed';

      h += '<div class="poll-item">';
      h += '<span class="poll-type">'+(typeLabels[p.type]||p.type)+'</span>';
      h += '<span class="poll-status '+statusClass+'">'+statusLabel+'</span>';
      h += '<div class="poll-title">'+p.title+'</div>';
      if (p.description) h += '<div style="font-size:11px;color:#666;margin-bottom:4px">'+p.description+'</div>';
      h += '<div class="poll-meta">👥 '+totalVotes+' votes'+(p.endDate?' · 📅 Ends: '+p.endDate:'')+'</div>';

      // Show results bar
      if (p.options && p.options.length > 0) {
        p.options.forEach(function(opt){
          var pct = totalVotes > 0 ? Math.round((opt.votes/totalVotes)*100) : 0;
          h += '<div class="result-option">'
            + '<div class="result-label"><span>'+opt.text+'</span><span>'+opt.votes+' ('+pct+'%)</span></div>'
            + '<div class="result-bar"><div class="result-fill" style="width:'+pct+'%"></div></div>'
            + '</div>';
        });
      }

      h += '<div class="poll-actions">';
      if (p.status === 'open') {
        h += '<button class="poll-btn btn-close" onclick="togglePoll(\''+d.id+'\',\'closed\',this)">🔴 Close Poll</button>';
      } else {
        h += '<button class="poll-btn btn-open" onclick="togglePoll(\''+d.id+'\',\'open\',this)">🟢 Reopen</button>';
      }
      h += '<button class="poll-btn btn-del" onclick="deletePoll(\''+d.id+'\',this)">🗑️ Delete</button>';
      h += '</div></div>';
    });
    el.innerHTML = h;
  } catch(e){ el.innerHTML='<div class="empty" style="color:#f44336">❌ Could not load polls.</div>'; }
};

// TOGGLE POLL STATUS
window.togglePoll = async function(id, newStatus, btn) {
  btn.disabled = true;
  try {
    await updateDoc(doc(db,'polls',id), { status: newStatus });
    showToast(newStatus==='closed'?'🔴 Poll closed':'🟢 Poll reopened','success');
    loadPolls();
  } catch(e){ showToast('❌ Error: '+e.message,'error'); btn.disabled=false; }
};

// DELETE POLL
window.deletePoll = async function(id, btn) {
  if (!confirm('Delete this poll and all its votes? This cannot be undone.')) return;
  btn.disabled = true;
  try {
    await deleteDoc(doc(db,'polls',id));
    showToast('✅ Poll deleted','success');
    loadPolls();
  } catch(e){ showToast('❌ Error: '+e.message,'error'); btn.disabled=false; }
};

loadPolls();
</script>
<script>
// Service worker registration - auto-checks for updates and reloads when a new version is ready
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('service-worker.js?v=10', { updateViaCache: 'none' })
      .then(function(reg) {
        reg.update(); // check for a new version right away
        setInterval(function() { reg.update(); }, 30 * 60 * 1000); // re-check every 30 min while the tab is open
      })
      .catch(function() {});
  });

  var __swRefreshed = false;
  navigator.serviceWorker.addEventListener('controllerchange', function() {
    if (__swRefreshed) return;
    __swRefreshed = true;
    window.location.reload();
  });
}
</script>
</body>
</html>
